# ---------------------------------------------------------------------------
# streamify-relay — Cloudflare Worker (W0.4 / Task 3-b, P0 minimal CORS relay)
#
# PLAN:      Workers FREE plan. Nothing here uses a paid feature — no KV, no
#            Durable Objects, no Queues, no Cron, no custom domains. The free
#            tier's 100k requests/day is plenty for the P0 proof.
# URL:       LIVE since 2026-11-12 (deployed from merged main after PR #159):
#              https://streamify-relay.zephyr4289.workers.dev
#            (account subdomain "zephyr4289", confirmed on first deploy —
#            it replaced the account's initial Hello-World placeholder).
# DEPLOY:    `npx wrangler deploy` (or `bun run deploy`) with
#            CLOUDFLARE_API_TOKEN (Workers Scripts:Edit scope) and
#            CLOUDFLARE_ACCOUNT_ID in the environment. The token is handed
#            over a secure channel and used once — it NEVER enters the tree.
# W1.0 NOTE: REDEPLOYED 2026-11-13 with the minting surface — version
#            ab781f0f-c9b7-4d2a-a848-ecc9af6631bd. The LIVE worker now
#            serves /bg-session + the www.google.com/js/th/* and
#            jnn-pa.googleapis.com allowlist entries (browser PO mints);
#            P0 passthrough verified intact on the same redeploy. CI does
#            NOT deploy the relay — manual step by design.
# P3b NOTE:  REDEPLOYED 2026-11-14 with the BotGuard egress pivot — version
#            aae9b71a-2d51-45da-8fde-5b04d022090f. The LIVE worker now
#            carries the 3-Tier surface: X-Relay-UA named overrides, the
#            sec-ch-ua* envelope pinning (WAA legs + WEB-declared innertube),
#            and the / capability echo. VISIONOS matrix UA (client 101)
#            regression-verified on the same deploy (full-length itag 140/251
#            + hlsManifestUrl, dQw).
# LOCAL DEV: `bunx wrangler dev --port 8787` — no account needed.
#
# W1A NOTE:  REDEPLOYED 2026-11-16 with the edge metadata cache — version
#            08ee1805-21b1-49f5-a9f3-d9e1888678ab. The LIVE worker now
#            serves /ytm/meta (the / capability list carries ytm-meta);
#            the YTM_CACHE KV namespace (275cb7d17fe34ea59626c1ea4ba71dc9)
#            is created and bound. Every endpoint class was verified
#            end-to-end against the deployment (see the W1-A ADR §E2).
#            CI still does NOT deploy — manual step by design.
#
# Deploy record + live verification matrix:
#            2026-11-12 (P0):  front-end/decisions/W0.6-live-wiring.md
#            2026-11-13 (W1.0): front-end/decisions/W1.0-minting-surface.md
# ---------------------------------------------------------------------------

name = "streamify-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# ---------------------------------------------------------------------------
# W1-A — the edge metadata cache KV binding (/ytm/meta).
#
# The binding is OPTIONAL by design: local `wrangler dev`, `wrangler
# deploy --dry-run` (CI) and any environment without the namespace run on
# the per-isolate in-memory layer alone (the route detects absence per
# request and bypasses KV cleanly — never a throw).
#
# The cache TTLs are enforced INSIDE the envelopes (never KV
# expirationTtl alone — the stale-serve window needs the entry to outlive
# freshness), so the binding may be deleted and recreated at any time: the
# worst case is one refetch per hot key.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "YTM_CACHE"
id = "275cb7d17fe34ea59626c1ea4ba71dc9"

# ---------------------------------------------------------------------------
# W2-A — the OPTIONAL Apps Script solver forwarding var.
#
# Set APPS_SCRIPT_SOLVER_URL to a script.google.com/macros/s/…/exec
# deployment when STREAMIFY_RELAY_BASE points at THIS worker: the /r
# CONTROL-PLANE legs (innertube / WAA / the BotGuard script host — never
# googlevideo media bytes) then forward through the Apps Script envelope
# (Google-ASN egress, the GSF bet server-side). Unset — the default —
# leaves every /r request on the direct worker egress (strictly
# additive). /ytm/meta and /bg-session are worker-local either way.
# ---------------------------------------------------------------------------
[vars]
# APPS_SCRIPT_SOLVER_URL = "https://script.google.com/macros/s/…/exec"
