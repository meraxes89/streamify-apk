# ---------------------------------------------------------------------------
# streamify-relay — Cloudflare Worker (W0.4 / Task 3-b, P0 minimal CORS relay)
#
# PLAN:      Workers FREE plan. Nothing here uses a paid feature — no KV, no
#            Durable Objects, no Queues, no Cron, no custom domains. The free
#            tier's 100k requests/day is plenty for the P0 proof.
# URL:       after deploy the worker answers at
#              https://streamify-relay.<ACCOUNT>.workers.dev
#            (<ACCOUNT> is the account subdomain picked at Cloudflare signup —
#            confirm it after the first real deploy, it is not knowable ahead
#            of credentials).
# DEPLOY:    `npx wrangler deploy` (or `bun run deploy`).
#            Requires CLOUDFLARE_API_TOKEN (Workers Scripts:Edit scope) or an
#            interactive `wrangler login`. THE LEAD DOES NOT HAVE CREDENTIALS
#            YET — the P0 deploy is pending creds. Validation without any
#            Cloudflare account:
#              npx wrangler deploy --dry-run --outdir /tmp/relay-dry-run
# LOCAL DEV: `bunx wrangler dev --port 8787` — no account needed.
# ---------------------------------------------------------------------------

name = "streamify-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"
