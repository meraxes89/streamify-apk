# streamify-relay — Cloudflare Worker (W0.4 / Task 3-b, P0 minimal CORS relay)
#
# PLAN:      Workers FREE plan. Nothing here uses a paid feature — no KV, no
#            Durable Objects, no Queues, no Cron, no custom domains. The free
#            tier's 100k requests/day is plenty for the P0 proof.
# URL:       LIVE since 2026-11-12 (deployed from merged main after PR #159):
#              https://streamify-relay.zephyr4289.workers.dev
#            (account subdomain "zephyr4289", confirmed on first deploy —
#            it replaced the account's initial Hello-World placeholder).
# DEPLOY:    `npx wrangler deploy` (or `bun run deploy`) with
#            CLOUDFLARE_API_TOKEN (Workers Scripts:Edit scope) and
#            CLOUDFLARE_ACCOUNT_ID in the environment. The token is handed
#            over a secure channel and used once — it NEVER enters the tree.
# W1.0 NOTE: REDEPLOYED 2026-11-13 with the minting surface — version
#            ab781f0f-c9b7-4d2a-a848-ecc9af6631bd. The LIVE worker now
#            serves /bg-session + the www.google.com/js/th/* and
#            jnn-pa.googleapis.com allowlist entries (browser PO mints);
#            P0 passthrough verified intact on the same redeploy. CI does
#            NOT deploy the relay — manual step by design.
# LOCAL DEV: `bunx wrangler dev --port 8787` — no account needed.
#
