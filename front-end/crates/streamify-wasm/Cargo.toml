# streamify-wasm — WS-W P0 proof facade (W0.2 / W0.4).
#
# The wasm-bindgen surface over the vendored web rustypipe engine. Built
# with:
#   wasm-pack build crates/streamify-wasm --target web --out-dir pkg
# (run from front-end/; the pkg/ output is copied into web/src/wasm/ by the
# build tooling — see web/src/wasm/README.md).
[package]
name = "streamify-wasm"
version = "0.1.0"
edition = "2021"
description = "Streamify web proof facade: wasm-bindgen surface over the (vendored) rustypipe YouTube Music engine"
publish = false

# wasm-pack: the bundled wasm-opt (binaryen) shipped with wasm-pack 0.15
# rejects the bulk-memory ops rustc emits ("memory.copy operations require
# bulk memory operations") — skip the post-opt pass; LTO release output is
# what ships.
[package.metadata.wasm-pack.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

# ─── Feature split (P4-A) ────────────────────────────────────────────────
#
# Two independent facades share this one crate so the wasm32 surface stays
# a single lockfile entry:
#
#   * `engine` (DEFAULT, on for every existing consumer): the W0.2/W0.4
#     rustypipe proof facade — search, resolve, the radio scorer — exactly
#     the symbol set web-build.yml builds today. A bare `cargo build` picks
#     this up, so the default artifact is byte-equivalent to the pre-P4A
#     crate (same code, same deps, same output).
#
#   * `cipher`: the feishin downloads chunk cipher (P4-A) — XChaCha20-
#     Poly1305 per-chunk AEAD over a raw-pointer ABI with ZERO JS imports
#     (see src/cipher.rs). Built with:
#       cargo build --release --target wasm32-unknown-unknown \
#           -p streamify-wasm --no-default-features --features cipher
#     then wasm-bindgen --target web. The output is vendored into
#     front-end/feishin/src/renderer/api/streamify/wasm/ (deterministic
#     staging — see that folder's README and decisions/p4/).
#
# The two are disjoint: `--no-default-features --features cipher` compiles
# a compact artifact (no rustypipe, no serde, no js-sys), and
# `--features cipher` alone does NOT exist without engine unless asked;
# default builds are unchanged.
[features]
default = ["engine"]
engine = [
    "dep:rustypipe",
    "dep:streamify-radio-scorer",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:serde",
    "dep:serde_json",
]
cipher = ["dep:chacha20poly1305", "dep:getrandom"]

[dependencies]
wasm-bindgen = "0.2"
# The #[wasm_bindgen] async-fn expansion links against these (JsFuture glue).
# Engine-only: the cipher facade must not carry them (P4-A feature split).
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The vendored wasm-patched rustypipe (front-end/third_party/rustypipe,
# resolved through the [patch.crates-io] table in the workspace root).
# default-features = false — no TLS features (the browser fetch layer
# provides TLS), no QuickJS (rquickjs-sys does not compile to wasm — W0.1
# landmine; the PO-free client ladder is the web strategy).
rustypipe = { version = "0.11.4", default-features = false, optional = true }
# WS-W engine facade breadth (work item 3): the radio/blend scorer leaf
# (rust/crates/streamify-radio-scorer — moved verbatim out of
# streamify-resolver so it compiles on wasm32). Read-only path dep.
streamify-radio-scorer = { path = "../../../rust/crates/streamify-radio-scorer", optional = true }
# P4-A: the feishin downloads chunk cipher (XChaCha20-Poly1305 AEAD, the
# vault-v2 family contract in a wasm32 raw-pointer form). Optional so the
# engine facade never carries it and vice versa.
chacha20poly1305 = { version = "0.10", optional = true }
# P4-A: getrandom comes in transitively via crypto-common → rand_core
# (the RustCrypto aead stack). On wasm32-unknown-unknown it refuses to
# compile without a backend; the cipher facade NEVER draws randomness
# inside wasm (nonces/keys are minted JS-side from the platform CSPRNG and
# passed through the raw-pointer ABI), so we register a trap backend. Zero
# JS imports — this keeps the artifact instantiable with {}.
getrandom = { version = "0.2", optional = true, default-features = false, features = [
    "custom",
] }

[dev-dependencies]
# NOTE: wasm-bindgen-test's version series diverged from wasm-bindgen's —
# the 0.2 series ended at 0.2.50 (pairs with old wasm-bindgen); the current
# series is 0.3.x and pairs with wasm-bindgen 0.2.130 (what our lock
# resolves). A version skew here breaks the test registration protocol
# (the runner reports "no tests to run!" — pinned this way deliberately).
wasm-bindgen-test = "0.3"
