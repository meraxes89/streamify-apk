# ============================================================================
# _ci-wasm.yml — Reusable Compose Multiplatform Web (Wasm) spoke.
#
# Builds the production wasmJs web client, applies Brotli & Gzip
# precompression, and packages the web release archive (Streamify-*-web-wasm.zip).
# ============================================================================
name: "CI — Web Wasm Distribution"

on:
  workflow_call:
    inputs:
      fast_check:
        description: "Run fast Kotlin/Wasm compilation check instead of full browser distribution"
        type: boolean
        default: false
      release_mode:
        description: "Package distribution archive for release"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      fast_check:
        description: "Run fast Kotlin/Wasm compilation check instead of full browser distribution"
        type: boolean
        default: false
      release_mode:
        description: "Package distribution archive for release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wasm:
    name: "Client"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply core submodule patches
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify wasm compilation
        if: ${{ inputs.fast_check && !inputs.release_mode }}
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:compileKotlinWasmJs :composeApp:wasmJsProcessResources \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC" \
            -Dkotlin.daemon.jvmargs="-Xmx8g"

      - name: Build distribution
        if: ${{ !inputs.fast_check || inputs.release_mode }}
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Running wasmJsBrowserDistribution..."
            ./gradlew :composeApp:wasmJsBrowserDistribution \
              --no-daemon \
              --stacktrace \
              -Dorg.gradle.jvmargs="-Xmx10g -XX:+UseParallelGC" \
              -Dkotlin.daemon.jvmargs="-Xmx10g" && break || {
                if [ $attempt -eq 3 ]; then
                  echo "All attempts failed."
                  exit 1
                fi
                echo "Attempt $attempt failed due to network or dependency resolution. Retrying in 10s..."
                sleep 10
              }
          done

      - name: Fetch demo catalog and configure SPA fallback
        if: ${{ !inputs.fast_check || inputs.release_mode }}
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          curl -sL "https://github.com/meraxes89/docs/releases/download/v1.0.0/demo-catalog.json" -o "$DIST_DIR/demo-catalog.json"
          if [ -s "$DIST_DIR/demo-catalog.json" ]; then
            echo "Successfully fetched demo catalog (size: $(du -h "$DIST_DIR/demo-catalog.json" | cut -f1))"
          else
            echo "::warning::Demo catalog fetch failed or empty"
          fi
          if [ -f "$DIST_DIR/index.html" ] && [ ! -f "$DIST_DIR/404.html" ]; then
            cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
          fi

      - name: Precompress assets
        if: ${{ !inputs.fast_check || inputs.release_mode }}
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          sudo apt-get update && sudo apt-get install -y brotli zip
          if [ "${{ inputs.release_mode }}" = "true" ]; then
            echo "Release mode: applying maximum brotli -q 11 and gzip -9..."
            find "$DIST_DIR" -type f \( -name "*.js" -o -name "*.wasm" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
              -exec gzip -9 -k -f {} \; \
              -exec brotli -q 11 -k -f {} \;
          else
            echo "CI mode: applying fast brotli -q 1 and gzip -1 for rapid compression verification..."
            find "$DIST_DIR" -type f \( -name "*.js" -o -name "*.wasm" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
              -exec gzip -1 -k -f {} \; \
              -exec brotli -q 1 -k -f {} \;
          fi
          echo "=== Distribution Artifacts ==="
          ls -lh "$DIST_DIR"

      - name: Package archive
        if: inputs.release_mode
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          TAG_OR_REF="${GITHUB_REF_NAME:-latest}"
          TAG_CLEAN="${TAG_OR_REF//\//-}"
          ARCHIVE_NAME="Streamify-${TAG_CLEAN}-web-wasm.zip"
          (cd "$DIST_DIR" && zip -r "../../../../../${ARCHIVE_NAME}" .)
          ls -la "${ARCHIVE_NAME}"

      - name: Upload distribution
        if: ${{ !inputs.fast_check || inputs.release_mode }}
        uses: actions/upload-artifact@v7
        with:
          name: compose-wasm-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error

      - name: Upload archive
        if: inputs.release_mode
        uses: actions/upload-artifact@v7
        with:
          name: wasm-release-archive
          path: Streamify-*-web-wasm.zip
          if-no-files-found: error
