name: Gemini Contributor

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  # audit #44 P3-6: LEAST PRIVILEGE. This workflow is triggered by ANY
  # user's issue/issue-comment text containing `@gemini` — a classic
  # prompt-injection surface. The previous `contents: write` + direct
  # push-to-default-branch path let an unauthenticated comment make the
  # bot commit and push arbitrary content to main. The bot is now
  # comment-only: it can read the tree and post analysis replies, and
  # nothing else. Re-introducing any write path requires a
  # trusted-reviewer gate (environment protection rules) first.
  contents: read
  issues: write
  pull-requests: read

jobs:
  gemini-reply:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini') && !endsWith(github.event.comment.user.login, '[bot]')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          # Shallow is enough: the bot reads the tree for context. It can
          # no longer push, so full history is unnecessary.
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai PyGithub

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_NAME: ${{ github.repository }}
          # Put your GitHub App slug (name) and App ID here:
          BOT_SLUG: "gemini-contributor-agent"
          BOT_APP_ID: "4853494"
        run: |
          python - << 'EOF'
          import os, subprocess
          from github import Github
          from google import genai

          gh = Github(os.environ["GITHUB_TOKEN"])
          repo = gh.get_repo(os.environ["REPO_NAME"])
          issue_num = int(os.environ["ISSUE_NUMBER"])
          issue = repo.get_issue(issue_num)

          raw_text = os.environ.get("COMMENT_BODY") or os.environ.get("ISSUE_BODY") or ""
          prompt = raw_text.replace("@gemini", "").strip()

          bot_slug = os.environ.get("BOT_SLUG", "gemini-bot").strip()
          bot_id = os.environ.get("BOT_APP_ID", "123456").strip()

          bot_user = f"{bot_slug}[bot]"
          bot_email = f"{bot_id}+{bot_slug}[bot]@users.noreply.github.com"

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          wants_commit = any(w in prompt.lower() for w in ["commit", "readme", "contribute", "contributor"])

          if wants_commit:
              # audit #44 P3-6: the old behavior appended model-generated
              # text to README.md and PUSHED IT STRAIGHT TO THE DEFAULT
              # BRANCH from an unauthenticated comment trigger. That write
              # path is removed — commits land via reviewed PRs only. The
              # bot politely points at the normal contribution flow.
              reply = (
                  "🤖 I can no longer commit directly to this repository "
                  "(write access was scoped down for supply-chain safety — "
                  "see audit #44 P3-6). "
                  "Please open a PR with your change and ask me to review "
                  "it in a comment; I'll reply with analysis here."
              )
              issue.create_comment(reply)

          else:
              file_list = subprocess.check_output(
                  ["git", "ls-tree", "-r", "HEAD", "--name-only"], text=True
              ).splitlines()

              context_snippets = []
              ignored_exts = ('.png', '.jpg', '.jpeg', '.gif', '.zip', '.tar', '.gz', '.pdf', '.bin', '.so', '.apk')
              for f in file_list[:80]:
                  if not f.startswith('.') and not f.endswith(ignored_exts) and os.path.isfile(f):
                      try:
                          with open(f, 'r', errors='ignore') as src:
                              content = src.read(3000)
                              context_snippets.append(f"--- FILE: {f} ---\n{content}\n")
                      except Exception:
                          pass

              repo_context = "\n".join(context_snippets)

              system_message = f"""
              You are an active contributor and senior software engineer for the repository '{repo.full_name}'.
              Analyze the codebase context provided and fulfill the user's instructions directly.
              """

              response = client.models.generate_content(
                  model="gemini-3.6-flash",
                  contents=f"{system_message}\n\nRepository Context:\n{repo_context}\n\nTask from developer:\n{prompt}"
              )

              reply = f"### 🤖 Gemini Contributor Analysis\n\n{response.text}\n\n---\n*Co-authored-by: {bot_user} <{bot_email}>*"
              issue.create_comment(reply)
          EOF
