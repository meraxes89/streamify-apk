# ============================================================================
# nightly-deep-matrix.yml — the nightly-only lanes extracted from the retired
# extreme-test-matrix.yml (schedule + workflow_dispatch ONLY: no pull_request
# or push triggers, so it can never double-build against the ci.yml hub).
#
# What runs at night (and only at night):
#   engine-nightly  _ci-engine.yml with nextest_profile: nightly — the deep
#                   Rust matrix including the 32-peer mesh chaos suite
#                   (serialized in the serial-heavy-mesh test group).
#   native-deep-fuzz  C++20 LibFuzzer crash hunt (900s on schedule).
#   android-connected   TEST-01: one API-34 x86_64 emulator on a KVM-enabled
#                       ubuntu runner — the instrumented functional suite
#                       (PlaybackService lifecycle, Compose UI critical
#                       flows). TRUTH-01c: this lane REPLACED the three
#                       macos-15 emulator legs whose own comments admitted
#                       they could never boot (HV_UNSUPPORTED) — macOS
#                       runner time per night for zero signal.
#   aggregate         Combined log verdict, committed to the testing-log
#                     branch (the repo's debugging audit trail).
#
# Blocking discipline: a fuzz crash IS a memory-safety bug — the fuzz job
# fails the run. The connected lane is blocking: a red instrumented suite
# means a real user-visible defect.
# ============================================================================
name: Nightly Deep Matrix

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  engine-nightly:
    name: "Rust core: nextest (nightly deep matrix)"
    uses: ./.github/workflows/_ci-engine.yml
    with:
      run_tests: true
      build_android_native: false
      build_linux_native: false
      nextest_profile: nightly

  native-deep-fuzz:
    name: "Native C++20 LibFuzzer (cached corpus)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Clang-17 & LibFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 cmake ninja-build libstdc++-13-dev ccache
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-17 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 100

      - name: Setup CCache for fuzzer compilation
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-ccache-native-fuzz
          restore-keys: |
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Restore fuzzer seed corpus
        uses: actions/cache@v6
        with:
          path: native/fuzz/corpus
          key: libfuzzer-corpus-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            libfuzzer-corpus-

      # Timed-out fuzz runs still exit 0; only crashes fail the job.
      - name: Compile & run LibFuzzer
        id: fuzz_test
        run: |
          mkdir -p native/build native/fuzz/corpus native/fuzz/artifacts
          cd native/build
          cmake -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -O2 -g" \
                -DSTREAMIFY_BUILD_FUZZERS=ON \
                -G Ninja ..
          ninja dsp_fuzzer_harness
          FUZZ_TIME=900
          ./dsp_fuzzer_harness ../fuzz/corpus -max_len=4096 -max_total_time=$FUZZ_TIME -artifact_prefix=../fuzz/artifacts/ > ../fuzz-run.log 2>&1 || true
          if ls ../fuzz/artifacts/crash-* 1> /dev/null 2>&1; then
            echo "FUZZER_FOUND_CRASH=true" >> "$GITHUB_ENV"
          fi

      - name: Upload crash artifacts on fault
        if: env.FUZZER_FOUND_CRASH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: libfuzzer-crash-dumps
          path: native/fuzz/artifacts/

      - name: Upload fuzzer log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-native-libfuzzer
          path: native/fuzz-run.log
          if-no-files-found: ignore

      - name: Fail on crash
        if: env.FUZZER_FOUND_CRASH == 'true'
        run: |
          echo "FATAL: LibFuzzer found a crash — see libfuzzer-crash-dumps artifact" >&2
          exit 1

# TRUTH-01c / TEST-01: the connected Android lane. One API-34 x86_64
# emulator on a KVM-enabled ubuntu-latest runner (hardware acceleration
# on Linux actually works — unlike the retired macos-15 ARM64 legs, which
# aborted with HV_UNSUPPORTED every single night). Runs the instrumented
# functional suite (app/src/androidTest): PlaybackService lifecycle +
# notification actions and the Compose UI critical flows. Blocking: a red
# suite means a real user-visible defect.
  android-connected:
    name: "Connected Android tests (API 34 x86_64, TEST-01)"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Enable host KVM (emulator hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run instrumented suite on the API-34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            touch raw_emulator.log
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest -Pstreamify.skipRust=true --stacktrace > raw_emulator.log 2>&1

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-android-connected
          path: |
            raw_emulator.log
            app/build/reports/androidTests/connected/**
          if-no-files-found: ignore

  aggregate-and-publish-logs:
    name: Aggregate & commit to testing-log
    runs-on: ubuntu-latest
    needs: [engine-nightly, native-deep-fuzz, android-connected]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Download shard logs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: log-*
          path: downloaded-logs
          merge-multiple: true

      - name: Aggregate logs & compute status
        run: |
          echo "========================================================================" > combined-test.log
          echo "STREAMIFY NIGHTLY DEEP MATRIX RUN #${{ github.run_number }}" >> combined-test.log
          echo "COMMIT: ${{ github.sha }}" >> combined-test.log
          echo "========================================================================" >> combined-test.log
          cat downloaded-logs/*.log >> combined-test.log 2>/dev/null || echo "WARN: no shard logs found." >> combined-test.log

          # CANCELLED siblings are NOT failures (concurrency races prove
          # nothing about the code): only an explicit failure gates.
          RESULTS="${{ needs.engine-nightly.result }},${{ needs.native-deep-fuzz.result }},${{ needs.android-connected.result }}"
          if printf '%s\n' "$RESULTS" | grep -q '^failure$'; then
            echo "OVERALL_TEST_RESULT=FAILED" >> "$GITHUB_ENV"
          elif printf '%s\n' "$RESULTS" | grep -q '^cancelled$'; then
            echo "OVERALL_TEST_RESULT=CANCELLED (superseding run carries the verdict)" >> "$GITHUB_ENV"
          else
            echo "OVERALL_TEST_RESULT=PASSED" >> "$GITHUB_ENV"
          fi

      - name: Push combined log to testing-log branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp combined-test.log /tmp/combined-test.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD || true
          git clean -fd || true
          git fetch origin testing-log || true
          if git show-ref --verify --quiet refs/remotes/origin/testing-log; then
            git checkout -f testing-log
            git pull --rebase origin testing-log || true
          else
            git checkout --orphan testing-log
            git rm -rf . || true
          fi
          mkdir -p runs
          cp /tmp/combined-test.log runs/test-run-${{ github.run_number }}.log
          cp /tmp/combined-test.log latest.log
          git add runs/test-run-${{ github.run_number }}.log latest.log
          git commit -m "test(ci): nightly run #${{ github.run_number }} [${{ env.OVERALL_TEST_RESULT }}] [skip ci]" || true
          git push origin testing-log || true

      - name: Fail the run on a FAILED verdict
        if: env.OVERALL_TEST_RESULT == 'FAILED'
        run: |
          grep -A 3 -B 1 -i "fail\|crash" combined-test.log | head -n 40 || true
          exit 1
