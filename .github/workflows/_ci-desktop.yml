# ============================================================================
# _ci-desktop.yml — Tier 2 reusable spoke: the Compose Multiplatform Desktop
# matrix (resp6.md §2/§4), replacing the retired desktop-ci.yml.
#
# Callable ONLY via workflow_call, from:
#   * ci.yml      (PR / merge_group / push-main hub)
#   * release.yml (tag-driven release, release_mode: true)
#
# Matrix: ubuntu-latest (linux), windows-latest (windows), macos-latest (macos).
# On PR fast-path, desktop-linux runs headless CMP JVM tests in ~3 min, while
# desktop-other (windows + macos) is skipped unless full_matrix, package_installers,
# release_mode, or full-matrix label is active.
# ============================================================================
name: CI Desktop (CMP Matrix)

on:
  workflow_call:
    inputs:
      package_installers:
        description: Build .deb/.msi/.dmg installers and enforce the < 250 MiB size budget.
        type: boolean
        default: false
      release_mode:
        description: Upload the packaged installers for the release publish job.
        type: boolean
        default: false
      full_matrix:
        description: Run full OS matrix (Linux, Windows, macOS). When false on PRs, only Linux runs.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── PR Fast Path & Linux Primary Leg ───────────────────────────────────────
  desktop-linux:
    name: "linux"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core submodule patch if present
        shell: bash
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Rust toolchain (host target)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache (host)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: desktop-linux
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache (mandatory compiler caching, resp6 §3)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache server daemon
        run: sccache --start-server || true

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── Engine provisioning: prebuilt fan-out (Linux) ─────────────────────
      - name: Download prebuilt Linux engine cdylib (build-once / fan-out)
        uses: actions/download-artifact@v8
        with:
          name: engine-linux-x86_64
          path: staged-engine

      - name: Set prebuilt engine environment
        shell: bash
        run: |
          echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/libstreamify_core_rs.so" >> "$GITHUB_ENV"

      - name: Build the desktop HAL library (WS-C C5)
        shell: bash
        run: |
          cmake -B native/build-hal -S native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-hal --target streamify_desktop_hal
          HAL_DIR="$(dirname "$PWD/$(find native/build-hal -name 'libstreamify_desktop_hal.so' -print -quit)")"
          echo "STREAMIFY_DESKTOP_HAL_DIR=$HAL_DIR" >> "$GITHUB_ENV"
          echo "desktop HAL module at: $HAL_DIR"

      # ── 1. Desktop Test Suite ─────────────────────────────────────────────
      - name: "Desktop test suite (CMP UI shell + shared desktopTest + JNA smoke)"
        if: ${{ !inputs.release_mode }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:jvmTest \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      # ── 2. Installer packaging + strict size budget (gated) ────────────────
      - name: "Package desktop distribution (jpackage: deb / rpm / msi / dmg)"
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDistributionForCurrentOS \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: MP-HAL10 size budget report (strictly < 250 MiB)
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          echo "Desktop packaging verification completed"

      - name: Upload desktop installers
        if: ${{ inputs.package_installers }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-linux
          path: |
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
            desktopApp/build/compose/binaries/**/*.msi
            desktopApp/build/compose/binaries/**/*.exe
            desktopApp/build/compose/binaries/**/*.dmg
            desktopApp/build/compose/binaries/**/*.pkg
            desktopApp/build/compose/binaries/**/*.AppImage
            desktopApp/build/compose/binaries/main/app/**
            desktopApp/build/appimage/**
          if-no-files-found: warn

      # ── Debug aids ──────────────────────────────────────────────────────────
      - name: Upload generated uniffi bindings (debug aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-uniffi-bindings-linux
          path: composeApp/build/generated/uniffi/
          if-no-files-found: ignore

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-linux
          path: |
            composeApp/build/reports/tests/**
          if-no-files-found: ignore

  # ── Full Matrix Secondary Legs (Windows & macOS) ──────────────────────────
  desktop-other:
    name: "${{ matrix.os-name }}"
    if: inputs.full_matrix || inputs.package_installers || inputs.release_mode || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
          - os: macos-latest
            os-name: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core submodule patch if present
        shell: bash
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Rust toolchain (host target)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache (host)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: desktop-${{ matrix.os-name }}
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache (mandatory compiler caching, resp6 §3)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache server daemon
        run: sccache --start-server || true

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── Engine provisioning: prebuilt fan-out across Windows & macOS ─────────
      - name: Download prebuilt Windows engine cdylib (build-once / fan-out)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: engine-windows-x86_64
          path: staged-engine

      - name: Download prebuilt macOS engine cdylib (build-once / fan-out)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v8
        with:
          name: engine-macos-universal
          path: staged-engine

      - name: Set prebuilt engine environment
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/streamify_core_rs.dll" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/libstreamify_core_rs.dylib" >> "$GITHUB_ENV"
          fi

      - name: Build the desktop HAL library (WS-C C5)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B native/build-hal -S native -A x64
            cmake --build native/build-hal --config Release --target streamify_desktop_hal
            HAL_DLL="$(find native/build-hal -name 'streamify_desktop_hal.dll' -print -quit)"
            HAL_DIR="$(dirname "$(cygpath -m "$PWD")/$HAL_DLL")"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B native/build-hal -S native -DCMAKE_BUILD_TYPE=Release
            cmake --build native/build-hal --target streamify_desktop_hal
            HAL_DIR="$(dirname "$PWD/$(find native/build-hal -name 'libstreamify_desktop_hal.dylib' -print -quit)")"
          fi
          echo "STREAMIFY_DESKTOP_HAL_DIR=$HAL_DIR" >> "$GITHUB_ENV"
          echo "desktop HAL module at: $HAL_DIR"

      # ── 1. Desktop Test Suite ─────────────────────────────────────────────
      - name: "Desktop test suite (CMP UI shell + shared desktopTest + JNA smoke)"
        if: ${{ !inputs.release_mode && (runner.os == 'Windows' || runner.os == 'macOS') }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:jvmTest \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      # ── 2. Installer packaging + strict size budget (gated) ────────────────
      - name: Install WiX Toolset 3.14 (jpackage MSI prerequisite)
        if: ${{ inputs.package_installers && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $wixRoot = "${env:ProgramFiles(x86)}\WiX Toolset v3.14"
          if (Test-Path "$wixRoot\bin\light.exe") {
            Write-Host "WiX 3.14 already present at $wixRoot"
          } else {
            choco install wixtoolset --version=3.14.0.6526 -y --no-progress
          }
          "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "Package desktop distribution (jpackage: deb / rpm / msi / dmg)"
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDistributionForCurrentOS \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: MP-HAL10 size budget report (strictly < 250 MiB)
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          echo "Desktop packaging verification completed"

      - name: Upload desktop installers
        if: ${{ inputs.package_installers }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-${{ matrix.os-name }}
          path: |
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
            desktopApp/build/compose/binaries/**/*.msi
            desktopApp/build/compose/binaries/**/*.exe
            desktopApp/build/compose/binaries/**/*.dmg
            desktopApp/build/compose/binaries/**/*.pkg
            desktopApp/build/compose/binaries/**/*.AppImage
            desktopApp/build/compose/binaries/main/app/**
            desktopApp/build/appimage/**
          if-no-files-found: warn

      # ── Debug aids ──────────────────────────────────────────────────────────
      - name: Upload generated uniffi bindings (debug aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-uniffi-bindings-${{ matrix.os-name }}
          path: composeApp/build/generated/uniffi/
          if-no-files-found: ignore

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-${{ matrix.os-name }}
          path: |
            composeApp/build/reports/tests/**
          if-no-files-found: ignore
