# ============================================================================
# _ci-desktop.yml — Tier 2 reusable spoke: the Compose Multiplatform Desktop
# matrix (resp6.md §2/§4), replacing the retired desktop-ci.yml.
#
# Callable ONLY via workflow_call, from:
#   * ci.yml      (PR / merge_group / push-main hub)
#   * release.yml (tag-driven release, release_mode: true)
#
# Matrix: ubuntu-latest (linux), windows-latest (windows) — the macOS leg
# lives in the Apple Unified lane (_ci-ios.yml) instead of this matrix.
#
# Every leg runs:
#   1. Headless CMP UI smoke tests (:desktop:test --tests shell.* +
#      :shared:desktopTest) — engine-free (FakeEnginePort), deterministic on
#      all three OSes.
#   2. Desktop JNA engine smoke suite (the full :desktop:test +
#      :shared:desktopTest pass) — the engine-tied lane.
#
# Engine provisioning per leg (build-once / fan-out, resp6 §3):
#   * linux    consumes the engine-linux-x86_64 cdylib artifact from
#              _ci-engine.yml via -Pstreamify.prebuiltEngineLib (no cargo
#              invocation for the engine library).
#   * windows  consumes the engine-windows-x86_64 cdylib artifact the same
#              way. TRUTH-01d: the MP-DEC-08 ENGINE_BUILDABLE probe scaffolding
#              is deleted — the Windows engine compiles (task_orchestrator's
#              Linux-only libc was cfg-gated in Phase 4b) and a missing
#              artifact download already fails the leg, so the "blocked
#              upstream (reported, not failed)" branch was unreachable dead
#              code. The macOS leg lives in the Apple Unified lane.
#   * macos    (Apple Unified lane, _ci-ios.yml).
#
# package_installers (PRs: only when packaging files changed; main /
# merge_group / releases: true) adds jpackage + the strict
# :desktop:verifyDesktopSizeBudget gate (< 250 MiB) per leg:
#   .deb on linux, .msi on windows (WiX 3.14), .dmg on macos.
# ============================================================================
name: CI Desktop (CMP Matrix)

on:
  workflow_call:
    inputs:
      package_installers:
        description: Build .deb/.msi/.dmg installers and enforce the < 250 MiB size budget.
        type: boolean
        default: false
      release_mode:
        description: Upload the packaged installers for the release publish job.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop-matrix:
    name: "Desktop (${{ matrix.os-name }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
          - os: windows-latest
            os-name: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust toolchain (host target)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache (host)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: desktop-${{ matrix.os-name }}
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache (mandatory compiler caching, resp6 §3)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── Engine provisioning: prebuilt fan-out across Linux & Windows ─────
      - name: Download prebuilt Linux engine cdylib (build-once / fan-out)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          name: engine-linux-x86_64
          path: staged-engine

      - name: Download prebuilt Windows engine cdylib (build-once / fan-out)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: engine-windows-x86_64
          path: staged-engine

      - name: Set prebuilt engine environment
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/libstreamify_core_rs.so" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/streamify_core_rs.dll" >> "$GITHUB_ENV"
          fi

      # ── 1. Desktop Test Suite (Single combined pass, resp7 Pillar 4) ──────
      # Single combined invocation reuses Gradle daemon state, workers, and bytecode cache.
      - name: "Desktop test suite (CMP UI shell + shared desktopTest + JNA smoke)"
        if: ${{ always() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        # TRUTH-01d: unconditional on both legs — the prebuilt engine
        # artifact download above is the hard dependency (a missing
        # artifact fails the step), so there is nothing left to probe.
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktop:test :shared:desktopTest \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      # ── 2. Installer packaging + strict size budget (gated) ────────────────
      - name: Install WiX Toolset 3.14 (jpackage MSI prerequisite)
        if: ${{ inputs.package_installers && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $wixRoot = "${env:ProgramFiles(x86)}\WiX Toolset v3.14"
          if (Test-Path "$wixRoot\bin\light.exe") {
            Write-Host "WiX 3.14 already present at $wixRoot"
          } else {
            choco install wixtoolset --version=3.14.0.6526 -y --no-progress
          }
          "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "Package desktop distribution (jpackage: deb / msi / dmg)"
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          chmod +x gradlew
          # verifyDesktopNativeHygiene + verifyDesktopSizeBudget run as
          # finalizers of the packaging lifecycle inside this pass.
          ./gradlew :desktop:packageDistributionForCurrentOS \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: MP-HAL10 size budget report (strictly < 250 MiB)
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          ./gradlew :desktop:verifyDesktopSizeBudget \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache

      - name: Upload desktop installers
        if: ${{ inputs.package_installers }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-${{ matrix.os-name }}
          path: |
            desktop/build/compose/binaries/**/*.deb
            desktop/build/compose/binaries/**/*.msi
            desktop/build/compose/binaries/**/*.dmg
          if-no-files-found: error

      # ── Debug aids ──────────────────────────────────────────────────────────
      - name: Upload generated uniffi bindings (debug aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-uniffi-bindings-${{ matrix.os-name }}
          path: shared/build/generated/uniffi/
          if-no-files-found: ignore

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-${{ matrix.os-name }}
          path: |
            desktop/build/reports/tests/**
            shared/build/reports/tests/**
          if-no-files-found: ignore
