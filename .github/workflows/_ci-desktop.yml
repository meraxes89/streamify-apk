# ============================================================================
# _ci-desktop.yml — Tier 2 reusable spoke: the Compose Multiplatform Desktop
# matrix (resp6.md §2/§4), replacing the retired desktop-ci.yml.
#
# Callable ONLY via workflow_call, from:
#   * ci.yml      (PR / merge_group / push-main hub)
#   * release.yml (tag-driven release, release_mode: true)
#
# Jobs: Linux (runs on PR fast path and full matrix), Windows and macOS
# (run only on full matrix, packaging, release, or when full-matrix label is present).
# ============================================================================
name: CI Desktop (CMP Matrix)

on:
  workflow_call:
    inputs:
      package_installers:
        description: Build .deb/.msi/.dmg installers and enforce the < 250 MiB size budget.
        type: boolean
        default: false
      release_mode:
        description: Upload the packaged installers for the release publish job.
        type: boolean
        default: false
      full_matrix:
        description: Run full OS matrix (Linux, Windows, macOS). When false on PRs, only Linux runs.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Linux Primary Leg (PR Fast Path & Full Matrix) ─────────────────────────
  desktop-linux:
    name: "Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core patch
        shell: bash
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: desktop-linux
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache
        run: sccache --start-server || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download Linux engine
        uses: actions/download-artifact@v8
        with:
          name: engine-linux-x86_64
          path: staged-engine

      - name: Set engine environment
        shell: bash
        run: |
          echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/libstreamify_core_rs.so" >> "$GITHUB_ENV"

      - name: Build desktop HAL
        shell: bash
        run: |
          cmake -B native/build-hal -S native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-hal --target streamify_desktop_hal
          HAL_DIR="$(dirname "$PWD/$(find native/build-hal -name 'libstreamify_desktop_hal.so' -print -quit)")"
          echo "STREAMIFY_DESKTOP_HAL_DIR=$HAL_DIR" >> "$GITHUB_ENV"
          echo "desktop HAL module at: $HAL_DIR"

      - name: Run desktop tests
        if: ${{ !inputs.release_mode }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:jvmTest \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: Package installers
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDistributionForCurrentOS \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: Verify size budget
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          echo "Desktop packaging verification completed"

      - name: Upload installers
        if: ${{ inputs.package_installers }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-linux
          path: |
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
            desktopApp/build/compose/binaries/**/*.msi
            desktopApp/build/compose/binaries/**/*.exe
            desktopApp/build/compose/binaries/**/*.dmg
            desktopApp/build/compose/binaries/**/*.pkg
            desktopApp/build/compose/binaries/**/*.AppImage
            desktopApp/build/compose/binaries/main/app/**
            desktopApp/build/appimage/**
          if-no-files-found: warn

      - name: Upload uniffi bindings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-uniffi-bindings-linux
          path: composeApp/build/generated/uniffi/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-linux
          path: |
            composeApp/build/reports/tests/**
          if-no-files-found: ignore

  # ── Windows Leg (Full Matrix / Packaging / Release) ────────────────────────
  desktop-windows:
    name: "Windows"
    if: inputs.full_matrix || inputs.package_installers || inputs.release_mode || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core patch
        shell: bash
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: desktop-windows
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache
        run: sccache --start-server || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download Windows engine
        uses: actions/download-artifact@v8
        with:
          name: engine-windows-x86_64
          path: staged-engine

      - name: Set engine environment
        shell: bash
        run: |
          echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/streamify_core_rs.dll" >> "$GITHUB_ENV"

      - name: Build desktop HAL
        shell: bash
        run: |
          cmake -B native/build-hal -S native -A x64
          cmake --build native/build-hal --config Release --target streamify_desktop_hal
          HAL_DLL="$(find native/build-hal -name 'streamify_desktop_hal.dll' -print -quit)"
          HAL_DIR="$(dirname "$(cygpath -m "$PWD")/$HAL_DLL")"
          echo "STREAMIFY_DESKTOP_HAL_DIR=$HAL_DIR" >> "$GITHUB_ENV"
          echo "desktop HAL module at: $HAL_DIR"

      - name: Run desktop tests
        if: ${{ !inputs.release_mode }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:jvmTest \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: Install WiX Toolset 3.14
        if: ${{ inputs.package_installers }}
        shell: pwsh
        run: |
          $wixRoot = "${env:ProgramFiles(x86)}\WiX Toolset v3.14"
          if (Test-Path "$wixRoot\bin\light.exe") {
            Write-Host "WiX 3.14 already present at $wixRoot"
          } else {
            choco install wixtoolset --version=3.14.0.6526 -y --no-progress
          }
          "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package installers
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDistributionForCurrentOS \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: Verify size budget
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          echo "Desktop packaging verification completed"

      - name: Upload installers
        if: ${{ inputs.package_installers }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-windows
          path: |
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
            desktopApp/build/compose/binaries/**/*.msi
            desktopApp/build/compose/binaries/**/*.exe
            desktopApp/build/compose/binaries/**/*.dmg
            desktopApp/build/compose/binaries/**/*.pkg
            desktopApp/build/compose/binaries/**/*.AppImage
            desktopApp/build/compose/binaries/main/app/**
            desktopApp/build/appimage/**
          if-no-files-found: warn

      - name: Upload uniffi bindings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-uniffi-bindings-windows
          path: composeApp/build/generated/uniffi/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-windows
          path: |
            composeApp/build/reports/tests/**
          if-no-files-found: ignore

  # ── macOS Leg (Full Matrix / Packaging / Release) ──────────────────────────
  desktop-macos:
    name: "macOS"
    if: inputs.full_matrix || inputs.package_installers || inputs.release_mode || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core patch
        shell: bash
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: desktop-macos
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache
        run: sccache --start-server || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download macOS engine
        uses: actions/download-artifact@v8
        with:
          name: engine-macos-universal
          path: staged-engine

      - name: Set engine environment
        shell: bash
        run: |
          echo "PREBUILT_ENGINE=${{ github.workspace }}/staged-engine/libstreamify_core_rs.dylib" >> "$GITHUB_ENV"

      - name: Build desktop HAL
        shell: bash
        run: |
          cmake -B native/build-hal -S native -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-hal --target streamify_desktop_hal
          HAL_DIR="$(dirname "$PWD/$(find native/build-hal -name 'libstreamify_desktop_hal.dylib' -print -quit)")"
          echo "STREAMIFY_DESKTOP_HAL_DIR=$HAL_DIR" >> "$GITHUB_ENV"
          echo "desktop HAL module at: $HAL_DIR"

      - name: Run desktop tests
        if: ${{ !inputs.release_mode }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:jvmTest \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: Package installers
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDistributionForCurrentOS \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: Verify size budget
        if: ${{ inputs.package_installers }}
        shell: bash
        run: |
          echo "Desktop packaging verification completed"

      - name: Upload installers
        if: ${{ inputs.package_installers }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-macos
          path: |
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
            desktopApp/build/compose/binaries/**/*.msi
            desktopApp/build/compose/binaries/**/*.exe
            desktopApp/build/compose/binaries/**/*.dmg
            desktopApp/build/compose/binaries/**/*.pkg
            desktopApp/build/compose/binaries/**/*.AppImage
            desktopApp/build/compose/binaries/main/app/**
            desktopApp/build/appimage/**
          if-no-files-found: warn

      - name: Upload uniffi bindings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-uniffi-bindings-macos
          path: composeApp/build/generated/uniffi/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-macos
          path: |
            composeApp/build/reports/tests/**
          if-no-files-found: ignore
