# ============================================================================
# ci.yml — THE HUB of the 3-Tier Hub-and-Spoke CI DAG (resp6.md blueprint).
#
#   Tier 1  preflight      fast-fail gates + dorny/paths-filter impact
#                           analysis (ubuntu, ~2 min)
#   Tier 2  engine_dsp /   reusable workflow_call shards, dispatched in
#          android /        parallel, each skipped-by-condition (never
#          desktop / ios    missing) when its subtree is untouched
#   Tier 3  ci-gate         "CI Gate (Blocking)" — the ONE required status
#                           check in Branch Protection. Passes on success OR
#                           skipped, fails loudly on failure/cancelled.
#
# Why this shape (resp6 §1): standalone per-OS workflow files with top-level
# `on: pull_request: paths:` filters + platform leaf jobs registered as
# required checks deadlock Branch Protection ("Expected — Waiting for status
# to be reported"). Here every PR runs the hub unconditionally; path filters
# live INSIDE the preflight job, skipped shards report `skipped`, and the
# single gate folds the verdict. Zero deadlocks by construction.
#
# Cost shape (resp6 §3): path-filtered shards + build-once/fan-out engine
# artifacts + the concurrency group below (rapid force-pushes kill orphaned
# windows/macos runners immediately).
# ============================================================================
name: Unified CI Pipeline

on:
  pull_request:
    branches: [main, 'integration/**']
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Branch-isolated concurrency:
# Isolate runs by branch (head_ref on PRs, ref_name on push).
# When a new commit is pushed, cancel in-flight runs immediately so runners
# only build and test the latest commit on the branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # TIER 1: Fast-Fail Preflight & Impact Analysis (ubuntu, fast)
  # =========================================================================
  preflight:
    name: "Preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_android: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.android == 'true' || steps.filter.outputs.root_ci == 'true' || github.event_name != 'pull_request' }}
      run_desktop: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.root_ci == 'true' || github.event_name != 'pull_request' }}
      run_wasm: ${{ steps.filter.outputs.wasm == 'true' || steps.filter.outputs.root_ci == 'true' || github.event_name != 'pull_request' }}
      run_supabase: ${{ steps.filter.outputs.supabase == 'true' || steps.filter.outputs.root_ci == 'true' || github.event_name != 'pull_request' }}
      run_installers: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'package') ||
          steps.filter.outputs.packaging == 'true'
        }}
      full_matrix: >-
        ${{
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'full-matrix') ||
          contains(github.event.pull_request.labels.*.name, 'package') ||
          steps.filter.outputs.packaging == 'true'
        }}
    steps:
      # fetch-depth 0: gitleaks resolves the PR/push commit range (base^..head)
      # instead of the shallow HEAD snapshot.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Impact analysis. Skipped on merge_group/push — those events run the
      # FULL matrix (fail-safe: a queue entry must never under-test).
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            root_ci:
              - '.github/workflows/ci.yml'
              - 'gradle/**'
              - 'gradle.properties'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
            core:
              - 'core/**'
            android:
              - 'androidApp/**'
              - 'vivoAndroidApp/**'
              - 'composeApp/src/android*/**'
              - 'composeApp/src/common*/**'
              - 'core/**'
              - 'streamify-modules/**'
              - 'cast/**'
              - 'lastfm/**'
              - '.github/workflows/_ci-android.yml'
            desktop:
              - 'desktopApp/**'
              - 'composeApp/src/desktop*/**'
              - 'composeApp/src/common*/**'
              - 'core/**'
              - 'streamify-modules/**'
              - 'conveyor.conf'
              - '.github/workflows/_ci-desktop.yml'
            wasm:
              - 'wasmApp/**'
              - 'composeApp/src/wasm*/**'
              - 'composeApp/src/common*/**'
              - 'core/**'
              - 'streamify-modules/**'
              - 'room-wasm-stub/**'
              - 'lastfm/**'
              - 'lastfm-empty/**'
              - 'core.patch'
              - '.github/workflows/_ci-wasm.yml'
            supabase:
              - 'supabase/**'
              - 'streamify-modules/supabase/**'
            packaging:
              - '**/*.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'conveyor.conf'

      # SEC-05 secret scan, blocking, at t=0. PR/push events only: on
      # merge_group a full-history scan would re-flag the pre-existing
      # historical leaks already tracked for rotation (SEC-01/SEC-03).
      - name: Gitleaks secret scan (blocking)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TRUTH-02: docs-vs-reality lint — workflow badges, release-tag
      # links, relative doc links, retired-workflow claims and checked-ledger
      # file claims are grepped against the tree. Runs on EVERY event (a
      # docs-only PR is exactly how drift lands) and costs ~5 s.
      # Tag claims need the tags a fetch-depth 0 clone carries (the
      # gitleaks step above already requires that fetch depth).
      - name: Docs-vs-reality lint (TRUTH-02)
        run: python3 scripts/docs_ledger_check.py

      # Mechanical documentation gate: validates all markdown link targets
      # across the repo and enforces doc-verified-against commit ancestry pins.
      # Runs on every event and fails fast in < 2 seconds.
      - name: Documentation integrity & staleness gate (verify_docs)
        run: python3 scripts/verify_docs.py

      # P5-A: the canonical resolver integrity check. The feishin resolver
      # tree (front-end/feishin/.../playback/resolver/) became the single
      # source of truth when front-end/web was archived to
      # legacy/front-end-web — the old resolver-mirror-sync gate (web-build.yml
      # + scripts/sync_feishin_resolver.py) is retired with it. This keeps
      # the canonical tree honest instead: existence, provenance headers,
      # self-contained imports (no '/@/' aliases, no lib/engine revival,
      # bare deps limited to youtubei.js/googlevideo/bgutils-js) and the
      # getStreamUrl/recentResolveLog contract the engine + daily SABR
      # corpus runner consume. Pure source check, ~1 s, every event.
      - name: Canonical resolver integrity check (P5-A)
        run: python3 scripts/check_feishin_resolver.py

  # =========================================================================
  # TIER 2: Modular Domain Shards (Reusable Workflows, parallel dispatch)
  # =========================================================================
  android:
    name: "Android"
    needs: [preflight]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_android == 'true'
    uses: ./.github/workflows/_ci-android.yml

  desktop:
    name: "Desktop"
    needs: [preflight]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_desktop == 'true'
    uses: ./.github/workflows/_ci-desktop.yml
    with:
      package_installers: ${{ needs.preflight.outputs.run_installers == 'true' }}
      full_matrix: ${{ needs.preflight.outputs.full_matrix == 'true' }}

  wasm:
    name: "Wasm"
    needs: preflight
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_wasm == 'true'
    uses: ./.github/workflows/_ci-wasm.yml
    with:
      fast_check: ${{ needs.preflight.outputs.full_matrix != 'true' }}
      release_mode: false

  # SEC-10 gate: the Supabase RLS hardening suite runs the schema +
  # regression assertions against a real Postgres+pgvector service
  # container. Every assertion FAILS if a pre-SEC-10 permissive policy
  # (WITH CHECK (TRUE) / OR TRUE / email-granted admin) is restored.
  supabase-rls:
    name: "Supabase"
    needs: preflight
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Apply schema + run the RLS regression suite
        env:
          PGPASSWORD: postgres
        run: |
          PG="psql -h 127.0.0.1 -p 5432 -U postgres -d streamify_test -v ON_ERROR_STOP=1"
          $PG -f supabase/sql/tests/00_test_shim.sql
          $PG -f supabase/schema.sql
          $PG -f supabase/sql/tests/01_grants.sql
          $PG -f supabase/sql/tests/rls_test.sql

  # =========================================================================
  # TIER 3: The Single Blocking Merge Gate
  # =========================================================================
  # Register exactly this ONE check ("CI Gate (Blocking)") in Branch
  # Protection — never the platform leaf jobs (resp6 §1). `if: always()`
  # makes it run after any failure; the explicit state scan makes it FAIL on
  # that failure. Skipped is a PASS: path-filtered skips are the design.
  ci-gate:
    name: "CI gate (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, android, desktop, wasm, supabase-rls]
    if: always()
    steps:
      - name: Evaluate all shards (pass on success or skipped, fail otherwise)
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_CONTEXT'])
          failures = []
          print("Shard verdicts:")
          for job, info in sorted(needs.items()):
              result = info['result']
              print(f"  {job}: {result}")
              if result not in ('success', 'skipped'):
                  failures.append(f"{job}: {result}")
          if failures:
              print("::error::CI Gate (Blocking) failed — blocking shard(s) not green:")
              for f in failures:
                  print(f"::error::  - {f}")
              sys.exit(1)
          print("CI Gate (Blocking) passed — every shard green or intentionally skipped.")
          PY

  # =========================================================================
  # TIER 4: Automated Continuous Deployment (GitHub Pages)
  # =========================================================================
  # Deploys the production CMP Wasm client to https://meraxes89.github.io/streamify-apk/.
  # Runs ONLY on push to main, after ci-gate and wasm succeed. Reuses the pre-compiled
  # compose-wasm-dist artifact generated by the wasm spoke: zero Gradle rebuild, ~30s turnaround.
  deploy-pages:
    name: "Deploy GitHub Pages"
    needs: [ci-gate, wasm]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci-gate.result == 'success' &&
      needs.wasm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download compiled Wasm distribution
        uses: actions/download-artifact@v8
        with:
          name: compose-wasm-dist
          path: dist/

      - name: Finalize production compression for Pages
        run: |
          sudo apt-get update && sudo apt-get install -y brotli
          find dist/ -type f \( -name "*.js" -o -name "*.wasm" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
            -exec gzip -9 -k -f {} \; \
            -exec brotli -q 11 -k -f {} \;
          echo "=== Pages Distribution Artifacts ==="
          ls -lh dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
