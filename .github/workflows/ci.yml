# ============================================================================
# ci.yml — THE HUB of the 3-Tier Hub-and-Spoke CI DAG (resp6.md blueprint).
#
#   Tier 1  preflight      fast-fail gates + dorny/paths-filter impact
#                           analysis (ubuntu, ~2 min)
#   Tier 2  engine_dsp /   reusable workflow_call shards, dispatched in
#          android /        parallel, each skipped-by-condition (never
#          desktop / ios    missing) when its subtree is untouched
#   Tier 3  ci-gate         "CI Gate (Blocking)" — the ONE required status
#                           check in Branch Protection. Passes on success OR
#                           skipped, fails loudly on failure/cancelled.
#
# Why this shape (resp6 §1): standalone per-OS workflow files with top-level
# `on: pull_request: paths:` filters + platform leaf jobs registered as
# required checks deadlock Branch Protection ("Expected — Waiting for status
# to be reported"). Here every PR runs the hub unconditionally; path filters
# live INSIDE the preflight job, skipped shards report `skipped`, and the
# single gate folds the verdict. Zero deadlocks by construction.
#
# Cost shape (resp6 §3): path-filtered shards + build-once/fan-out engine
# artifacts + the concurrency group below (rapid force-pushes kill orphaned
# windows/macos runners immediately).
# ============================================================================
name: Unified CI Pipeline

on:
  pull_request:
    branches: [main, 'integration/**']
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Branch-isolated concurrency:
# Isolate runs by branch (head_ref on PRs, ref_name on push).
# When a new commit is pushed, cancel in-flight runs immediately so runners
# only build and test the latest commit on the branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # TIER 1: Fast-Fail Preflight & Impact Analysis (ubuntu, fast)
  # =========================================================================
  preflight:
    name: "Tier 1: Fast-Fail & Path Filter"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_engine: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_android: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.android == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_desktop: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_supabase: ${{ steps.filter.outputs.supabase == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_installers: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'package') ||
          steps.filter.outputs.packaging == 'true'
        }}
    steps:
      # fetch-depth 0: gitleaks resolves the PR/push commit range (base^..head)
      # instead of the shallow HEAD snapshot.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Impact analysis. Skipped on merge_group/push — those events run the
      # FULL matrix (fail-safe: a queue entry must never under-test).
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            core:
              - 'rust/**'
              - 'native/**'
              - 'CMakeLists.txt'
            android:
              - 'androidApp/**'
              - 'composeApp/**'
              - 'core/**'
              - 'streamify-modules/**'
              - 'vivoAndroidApp/**'
              - 'cast/**'
              - 'lastfm/**'
            desktop:
              - 'desktopApp/**'
              - 'composeApp/**'
              - 'core/**'
              - 'streamify-modules/**'
              - 'conveyor.conf'
            supabase:
              - 'supabase/**'
              - 'streamify-modules/supabase/**'
            packaging:
              - '**/*.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'conveyor.conf'
            ci:
              - '.github/workflows/**'

      # SEC-05 secret scan, blocking, at t=0. PR/push events only: on
      # merge_group a full-history scan would re-flag the pre-existing
      # historical leaks already tracked for rotation (SEC-01/SEC-03).
      - name: Gitleaks secret scan (blocking)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # audit #44 P2-5: every Java_* export in rust/src/jni_bridge*.rs must
      # wrap its body in catch_unwind. Pure source check, no toolchain.
      - name: JNI panic-boundary convention gate
        if: steps.filter.outputs.core == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request'
        run: python3 scripts/jni_panic_boundary_check.py

      # TRUTH-02: docs-vs-reality lint — workflow badges, release-tag
      # links, relative doc links, retired-workflow claims and checked-ledger
      # file claims are grepped against the tree. Runs on EVERY event (a
      # docs-only PR is exactly how drift lands) and costs ~5 s.
      # Tag claims need the tags a fetch-depth 0 clone carries (the
      # gitleaks step above already requires that fetch depth).
      - name: Docs-vs-reality lint (TRUTH-02)
        run: python3 scripts/docs_ledger_check.py

      # P5-A: the canonical resolver integrity check. The feishin resolver
      # tree (front-end/feishin/.../playback/resolver/) became the single
      # source of truth when front-end/web was archived to
      # legacy/front-end-web — the old resolver-mirror-sync gate (web-build.yml
      # + scripts/sync_feishin_resolver.py) is retired with it. This keeps
      # the canonical tree honest instead: existence, provenance headers,
      # self-contained imports (no '/@/' aliases, no lib/engine revival,
      # bare deps limited to youtubei.js/googlevideo/bgutils-js) and the
      # getStreamUrl/recentResolveLog contract the engine + daily SABR
      # corpus runner consume. Pure source check, ~1 s, every event.
      - name: Canonical resolver integrity check (P5-A)
        run: python3 scripts/check_feishin_resolver.py

      # Sovereign HAL Phase 0 (D1): Layer-1 upstream-immunity gate. The
      # core.patch allowlist is FROZEN — the patch may carry ONLY platform
      # enablement (wasmJs Gradle targets, expect/actual shims) plus the
      # byte-reviewed utility/security fixes recorded in the script. Any
      # playback/audio/media-routing hunk inside the submodule patch layer
      # is a Phase-0 contract violation (playback behavior belongs in
      # streamify-modules/, never in the patch that every upstream bump
      # re-applies). Pure source check, < 1 s, every event.
      - name: core.patch upstream-immunity gate (Sovereign HAL D1)
        run: python3 scripts/check_core_patch.py

  # =========================================================================
  # TIER 2: Modular Domain Shards (Reusable Workflows, parallel dispatch)
  # =========================================================================
  # Clippy runs as a dedicated parallel spoke (resp7 Pillar 5) so preflight
  # finishes in < 20 seconds.
  clippy:
    name: "Rust clippy (workspace, -D warnings)"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.run_engine == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: clippy-workspace
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Clippy (workspace, all targets, warnings are errors)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Pillar B: UniFFI checked-in bindings drift check against UDL contract
      - name: Verify UniFFI bindings parity (drift check)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        run: |
          mkdir -p /tmp/uniffi-drift
          cargo run --manifest-path rust/Cargo.toml --bin uniffi-bindgen -- \
            generate rust/crates/streamify-contract/src/streamify.udl \
            --language kotlin \
            --out-dir /tmp/uniffi-drift \
            --config rust/crates/streamify-contract/uniffi.toml
          # Apply the uniffi-rs 0.28.3 Kotlin codegen defect shim (rename `message` to `errorMessage`)
          sed -i 's/`message`/`errorMessage`/g' /tmp/uniffi-drift/uniffi/streamify/streamify.kt
          if ! diff -u legacy/shared/src/desktopMain/kotlin/uniffi/streamify/streamify.kt /tmp/uniffi-drift/uniffi/streamify/streamify.kt; then
            echo "::error::UniFFI bindings in legacy/shared/src/desktopMain/kotlin/uniffi/streamify/streamify.kt are out of sync with streamify.udl!"
            echo "::error::Run gradle with UNIFFI_REGENERATE=1 or update the checked-in bindings."
            exit 1
          fi
          echo "UniFFI bindings are in sync with UDL."

  # The engine spoke doubles as the BUILD-ONCE / FAN-OUT artifact factory
  # (resp6 §3): it runs whenever the engine tests OR any artifact consumer
  # (android jniLibs / linux, windows, macos desktop cdylibs) is in scope,
  # with per-input granularity so an app-only PR skips the test suite but
  # still gets its prebuilt natives.
  engine_dsp:
    name: "Core Engine & C++ DSP"
    needs: preflight
    if: >-
      needs.preflight.outputs.run_engine == 'true' ||
      needs.preflight.outputs.run_android == 'true' ||
      needs.preflight.outputs.run_desktop == 'true'
    uses: ./.github/workflows/_ci-engine.yml
    with:
      run_tests: ${{ needs.preflight.outputs.run_engine == 'true' }}
      build_android_native: ${{ needs.preflight.outputs.run_android == 'true' }}
      build_desktop_native: ${{ needs.preflight.outputs.run_desktop == 'true' }}
      build_linux_native: ${{ needs.preflight.outputs.run_desktop == 'true' }}

  android:
    name: "Android Matrix"
    needs: [preflight, engine_dsp]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_android == 'true' &&
      (needs.engine_dsp.result == 'success' || needs.engine_dsp.result == 'skipped')
    uses: ./.github/workflows/_ci-android.yml

  desktop:
    name: "Desktop Matrix (Linux, Windows)"
    needs: [preflight, engine_dsp]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_desktop == 'true' &&
      (needs.engine_dsp.result == 'success' || needs.engine_dsp.result == 'skipped')
    uses: ./.github/workflows/_ci-desktop.yml
    with:
      package_installers: ${{ needs.preflight.outputs.run_installers == 'true' }}

  # SEC-10 gate: the Supabase RLS hardening suite runs the schema +
  # regression assertions against a real Postgres+pgvector service
  # container. Every assertion FAILS if a pre-SEC-10 permissive policy
  # (WITH CHECK (TRUE) / OR TRUE / email-granted admin) is restored.
  supabase-rls:
    name: "Supabase RLS hardening suite (SEC-10)"
    needs: preflight
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Apply schema + run the RLS regression suite
        env:
          PGPASSWORD: postgres
        run: |
          PG="psql -h 127.0.0.1 -p 5432 -U postgres -d streamify_test -v ON_ERROR_STOP=1"
          $PG -f supabase/sql/tests/00_test_shim.sql
          $PG -f supabase/schema.sql
          $PG -f supabase/sql/tests/01_grants.sql
          $PG -f supabase/sql/tests/rls_test.sql

  # Sovereign HAL Phase 3 (Step 4): the 5-platform OS-audio loopback
  # matrix + the frozen-ABI gates + the real-track Fastify E2E parity
  # suite run on EVERY PR into main — a future feature PR cannot
  # regress real audio output unnoticed. Reusable-workflow dispatch
  # (the same hub-and-spoke shape as the platform shards above).
  sovereign-hal:
    name: "Sovereign HAL Gates (5-platform loopback + ABI + Fastify E2E)"
    needs: preflight
    if: always() && needs.preflight.result == 'success'
    uses: ./.github/workflows/_ci-sovereign-hal.yml

  # =========================================================================
  # TIER 3: The Single Blocking Merge Gate
  # =========================================================================
  # Register exactly this ONE check ("CI Gate (Blocking)") in Branch
  # Protection — never the platform leaf jobs (resp6 §1). `if: always()`
  # makes it run after any failure; the explicit state scan makes it FAIL on
  # that failure. Skipped is a PASS: path-filtered skips are the design.
  ci-gate:
    name: "CI gate (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, clippy, engine_dsp, android, desktop, supabase-rls, sovereign-hal]
    if: always()
    steps:
      - name: Evaluate all shards (pass on success or skipped, fail otherwise)
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_CONTEXT'])
          failures = []
          print("Shard verdicts:")
          for job, info in sorted(needs.items()):
              result = info['result']
              print(f"  {job}: {result}")
              if result not in ('success', 'skipped'):
                  failures.append(f"{job}: {result}")
          if failures:
              print("::error::CI Gate (Blocking) failed — blocking shard(s) not green:")
              for f in failures:
                  print(f"::error::  - {f}")
              sys.exit(1)
          print("CI Gate (Blocking) passed — every shard green or intentionally skipped.")
          PY
