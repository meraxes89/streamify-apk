# ============================================================================
# ci.yml — THE HUB of the 3-Tier Hub-and-Spoke CI DAG (resp6.md blueprint).
#
#   Tier 1  preflight      fast-fail gates + dorny/paths-filter impact
#                           analysis (ubuntu, ~2 min)
#   Tier 2  engine_dsp /   reusable workflow_call shards, dispatched in
#          android /        parallel, each skipped-by-condition (never
#          desktop / ios    missing) when its subtree is untouched
#   Tier 3  ci-gate         "CI Gate (Blocking)" — the ONE required status
#                           check in Branch Protection. Passes on success OR
#                           skipped, fails loudly on failure/cancelled.
#
# Why this shape (resp6 §1): standalone per-OS workflow files with top-level
# `on: pull_request: paths:` filters + platform leaf jobs registered as
# required checks deadlock Branch Protection ("Expected — Waiting for status
# to be reported"). Here every PR runs the hub unconditionally; path filters
# live INSIDE the preflight job, skipped shards report `skipped`, and the
# single gate folds the verdict. Zero deadlocks by construction.
#
# Cost shape (resp6 §3): path-filtered shards + build-once/fan-out engine
# artifacts + the concurrency group below (rapid force-pushes kill orphaned
# windows/macos runners immediately).
# ============================================================================
name: Unified CI Pipeline

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  # Manual escape hatch (2026-10-30): GitHub's pull_request event delivery
  # occasionally drops events (diagnosed on both eng1 and eng3 feature PRs).
  # A workflow_dispatch run evaluates the same full matrix (preflight treats
  # non-pull_request events as run-everything, fail-safe) and attaches its
  # check runs to the head sha, so the "CI Gate (Blocking)" required check
  # is satisfied exactly as a pull_request run would.
  workflow_dispatch:

# Parallel-safe multi-engineer concurrency:
# Isolate runs by branch (head_ref) so multiple engineers pushing in parallel
# never collide or cancel each other. In-flight runs complete without premature abortion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # =========================================================================
  # TIER 1: Fast-Fail Preflight & Impact Analysis (ubuntu, fast)
  # =========================================================================
  preflight:
    name: "Tier 1: Fast-Fail & Path Filter"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_engine: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_android: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.android == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_desktop: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_ios: ${{ steps.filter.outputs.core == 'true' || steps.filter.outputs.ios == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
      run_installers: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'package') ||
          steps.filter.outputs.packaging == 'true'
        }}
    steps:
      # fetch-depth 0: gitleaks resolves the PR/push commit range (base^..head)
      # instead of the shallow HEAD snapshot.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Impact analysis. Skipped on merge_group/push — those events run the
      # FULL matrix (fail-safe: a queue entry must never under-test).
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            core:
              - 'rust/**'
              - 'native/**'
            android:
              - 'app/**'
              - 'shared/android/**'
            desktop:
              - 'desktop/**'
              - 'shared/**'
            ios:
              - 'iosApp/**'
              - 'scripts/build_ios_xcframework.sh'
            packaging:
              - '**/*.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'native/**'
            ci:
              - '.github/workflows/**'

      # SEC-05 secret scan, blocking, at t=0. PR/push events only: on
      # merge_group a full-history scan would re-flag the pre-existing
      # historical leaks already tracked for rotation (SEC-01/SEC-03).
      - name: Gitleaks secret scan (blocking)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # audit #44 P2-5: every Java_* export in rust/src/jni_bridge*.rs must
      # wrap its body in catch_unwind. Pure source check, no toolchain.
      - name: JNI panic-boundary convention gate
        if: steps.filter.outputs.core == 'true' || steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request'
        run: python3 scripts/jni_panic_boundary_check.py

  # =========================================================================
  # TIER 2: Modular Domain Shards (Reusable Workflows, parallel dispatch)
  # =========================================================================
  # Clippy runs as a dedicated parallel spoke (resp7 Pillar 5) so preflight
  # finishes in < 20 seconds.
  clippy:
    name: "Rust clippy (workspace, -D warnings)"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.run_engine == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: clippy-workspace
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Clippy (workspace, all targets, warnings are errors)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Pillar B: UniFFI checked-in bindings drift check against UDL contract
      - name: Verify UniFFI bindings parity (drift check)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        run: |
          mkdir -p /tmp/uniffi-drift
          cargo run --manifest-path rust/Cargo.toml --bin uniffi-bindgen -- \
            generate rust/crates/streamify-contract/src/streamify.udl \
            --language kotlin \
            --out-dir /tmp/uniffi-drift \
            --config rust/crates/streamify-contract/uniffi.toml
          # Apply the uniffi-rs 0.28.3 Kotlin codegen defect shim (rename `message` to `errorMessage`)
          sed -i 's/`message`/`errorMessage`/g' /tmp/uniffi-drift/uniffi/streamify/streamify.kt
          if ! diff -u shared/src/desktopMain/kotlin/uniffi/streamify/streamify.kt /tmp/uniffi-drift/uniffi/streamify/streamify.kt; then
            echo "::error::UniFFI bindings in shared/src/desktopMain/kotlin/uniffi/streamify/streamify.kt are out of sync with streamify.udl!"
            echo "::error::Run gradle with UNIFFI_REGENERATE=1 or update the checked-in bindings."
            exit 1
          fi
          echo "UniFFI bindings are in sync with UDL."

  # The engine spoke doubles as the BUILD-ONCE / FAN-OUT artifact factory
  # (resp6 §3): it runs whenever the engine tests OR any artifact consumer
  # (android jniLibs / linux, windows, macos desktop cdylibs) is in scope,
  # with per-input granularity so an app-only PR skips the test suite but
  # still gets its prebuilt natives.
  engine_dsp:
    name: "Core Engine & C++ DSP"
    needs: preflight
    if: >-
      needs.preflight.outputs.run_engine == 'true' ||
      needs.preflight.outputs.run_android == 'true' ||
      needs.preflight.outputs.run_desktop == 'true'
    uses: ./.github/workflows/_ci-engine.yml
    with:
      run_tests: ${{ needs.preflight.outputs.run_engine == 'true' }}
      build_android_native: ${{ needs.preflight.outputs.run_android == 'true' }}
      build_desktop_native: ${{ needs.preflight.outputs.run_desktop == 'true' }}
      build_linux_native: ${{ needs.preflight.outputs.run_desktop == 'true' }}

  android:
    name: "Android Matrix"
    needs: [preflight, engine_dsp]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_android == 'true' &&
      (needs.engine_dsp.result == 'success' || needs.engine_dsp.result == 'skipped')
    uses: ./.github/workflows/_ci-android.yml

  # Apple spoke runs as the single consolidated macos-14 runner job (resp8/resp9):
  # combines iOS headless simulator tests, xcframework probe, macOS cdylib,
  # and macOS desktop UI & JNA smoke suite into ONE session.
  # This eliminates macOS runner pool queue starvation and prevents 15-minute queue timeouts.
  apple:
    name: "Apple Unified (iOS Tests, XCFramework, macOS Desktop)"
    needs: preflight
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.preflight.outputs.run_ios == 'true' || needs.preflight.outputs.run_desktop == 'true')
    uses: ./.github/workflows/_ci-ios.yml
    with:
      package_installers: ${{ needs.preflight.outputs.run_installers == 'true' }}

  desktop:
    name: "Desktop Matrix (Linux, Windows)"
    needs: [preflight, engine_dsp]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.run_desktop == 'true' &&
      (needs.engine_dsp.result == 'success' || needs.engine_dsp.result == 'skipped')
    uses: ./.github/workflows/_ci-desktop.yml
    with:
      package_installers: ${{ needs.preflight.outputs.run_installers == 'true' }}

  # =========================================================================
  # TIER 3: The Single Blocking Merge Gate
  # =========================================================================
  # Register exactly this ONE check ("CI Gate (Blocking)") in Branch
  # Protection — never the platform leaf jobs (resp6 §1). `if: always()`
  # makes it run after any failure; the explicit state scan makes it FAIL on
  # that failure. Skipped is a PASS: path-filtered skips are the design.
  ci-gate:
    name: "CI gate (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, clippy, engine_dsp, android, desktop, apple]
    if: always()
    steps:
      - name: Evaluate all shards (pass on success or skipped, fail otherwise)
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_CONTEXT'])
          failures = []
          print("Shard verdicts:")
          for job, info in sorted(needs.items()):
              result = info['result']
              print(f"  {job}: {result}")
              if result not in ('success', 'skipped'):
                  failures.append(f"{job}: {result}")
          if failures:
              print("::error::CI Gate (Blocking) failed — blocking shard(s) not green:")
              for f in failures:
                  print(f"::error::  - {f}")
              sys.exit(1)
          print("CI Gate (Blocking) passed — every shard green or intentionally skipped.")
          PY
