name: Extreme Test Matrix & Chaos Suite

on:
  push:
    branches: [ main, streamify-yt-spt ]
  pull_request:
    branches: [ main, streamify-yt-spt ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Nightly Deep Annihilation Matrix

concurrency:
  # Repo-wide single-flight: the SAME code often lands on main + spt + adblog
  # in one session — only the most recent push should keep building.
  # (Branch-scoped groups used to let three identical builds run in parallel.)
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  security-events: write # Required for CodeQL


jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # MAX-PARALLELISM DAG (audit item: "tests shouldn't go in vain when the app
  # itself isn't compiling" was naive — compile errors surface in their OWN
  # job in ~4 min; gating every shard behind a full APK build serialized the
  # whole matrix at 20+ min wall-clock with zero extra information).
  #
  #   old:  gatekeeper(1m) -> build(15m) -> [tests, codeql, fuzz]  ≈ 20-25m
  #   new:  t=0 ┬─ compile-check ─> build ─> package/publish
  #             ├─ rust-core ────────────────┐
  #             ├─ native x3 (shared ccache) ├─> aggregate (~max of all)
  #             ├─ jvm-unit ─────────────────┤
  #             ├─ codeql (build-mode none) ─┤
  #             └─ probe (advisory) ─────────┘
  #
  # Critical path = max(build, test shards) instead of sum(). Expected
  # feedback for a broken commit: ~4-6 min (compile gate), not 20+.
  # ─────────────────────────────────────────────────────────────────────────

  # 0a. COMPILE GATE (fast, blocking): Kotlin/JVM compilation only — no NDK,
  # no Rust, no APK packaging. Catches the entire class of "app doesn't
  # compile" breakage in minutes and gates the package/publish stage.
  compile-check:
    name: "Compile Gate (Kotlin/JVM)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile Kotlin (main + unit tests, no native toolchain)
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin \
            -Pstreamify.skipRust=true --stacktrace

  # 0b. ZERO-WAIT SHIFT-LEFT GATEKEEPER: Verify live Innertube Search -> Player -> CDN Range Probe (<5s)
  # ADVISORY ONLY: GitHub runners sit in Azure datacenter IP ranges that YouTube
  # bot-walls regardless of client fingerprints (residential probes pass while
  # identical CI probes get LOGIN_REQUIRED). This job must NEVER block the build —
  # results are published to the run summary for trend monitoring instead.
  # Runs in PARALLEL from t=0 now (was a serial prelude to the build job).
  gatekeeper-api-probe:
    name: "Gatekeeper: Search -> CDN Stream Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 🛡️ Hard End-to-End Search & Stream Resolver Verification
        run: |
          chmod +x tools/probe-search-resolver.sh
          PASS_COUNT=0
          {
            echo "### 🛡️ Search → CDN Resolver Probe (advisory, datacenter-IP caveat)"
            echo "| Track | Verdict |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for Q in "The Weeknd Blinding Lights" "Daft Punk Get Lucky" "Travis Scott SICKO MODE"; do
            echo "--- Testing Track: $Q ---"
            if bash tools/probe-search-resolver.sh "$Q"; then
              PASS_COUNT=$((PASS_COUNT+1))
              echo "| $Q | ✅ PASS |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $Q | ❌ FAIL (likely datacenter-IP bot-wall) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            sleep 2
          done
          echo "**$PASS_COUNT/3 probes passed.** Build proceeds regardless." >> "$GITHUB_STEP_SUMMARY"

  # 1. BUILD JOB: Full native APK build (NDK + cargo-ndk + CMake + Rust).
  # Starts as soon as the fast compile gate passes — it no longer waits for
  # the advisory probe, and no test shard waits for it.
  # Caching is ON (the old --no-build-cache / --no-daemon / cache-disabled trio
  # plus `clean` guaranteed a cold 15-minute build on every single run).
  build-and-compile:
    name: "Build Debug APK (Native Full)"
    needs: compile-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android Rust Targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target list --installed

      - name: Install cargo-ndk
        id: cargondk
        run: which cargo-ndk || cargo install cargo-ndk --locked

      - name: Cache Cargo Registry & Build Dir
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # rust/Cargo.lock is gitignored, so hashFiles() resolved empty before
          # (dead cache key). Key on workspace manifests instead.
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Android NDK & CMake
        id: ndk-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          # Runner-image env vars are NOT part of the Actions `env` context, so
          # `${ { env.ANDROID_HOME } }` resolved empty and this cache never
          # stored anything. Pin the real runner SDK path instead.
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ${{ runner.os }}-ndk-26.1.10909125-cmake-3.22.1

      # android-actions/setup-android@v3 installs the legacy `tools` package
      # by default; Google removed that package from the SDK repository, so
      # the action now fails on every run. GitHub hosted runners already ship
      # the Android SDK with cmdline-tools available via $ANDROID_HOME.
      - name: Install Android NDK & CMake
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" > /dev/null

      - name: Configure NDK Environment
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/26.1.10909125"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Read-write cache on main so merged commits seed the shared cache
          # that PR jobs restore from (cache-read-only elsewhere).
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup CCache for C++ Compilation
        uses: hendrikmuhs/ccache-action@v1.2.14
        continue-on-error: true
        with:
          # ref_slug is NOT a valid context property (silently rendered an
          # empty suffix); use stable keys so main seeds what PRs restore.
          key: ${{ runner.os }}-ccache-native-main
          restore-keys: |
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Build Debug APK
        id: gradle_build
        run: |
          set -o pipefail
          touch build.log
          chmod +x gradlew
          # Incremental by design: no `clean`, build cache + daemon enabled
          # (gradle.properties already sets org.gradle.caching/parallel=true).
          ./gradlew assembleDebug \
            -DANDROID_CCACHE=ccache \
            --stacktrace 2>&1 | tee build.log

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log

      - name: Handle Build Failure & Push to build-logs
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch build.log
          cp build.log /tmp/build.log
          ERROR_LOG=$(grep -A 2 -B 2 "e: " /tmp/build.log | tail -n 50 || echo "Could not extract errors. See artifacts.")
          BODY=$(printf "### ❌ Build Failed (Run #%s)\n\`\`\`text\n%s\n\`\`\`" "${{ github.run_number }}" "$ERROR_LOG")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD || true
          git clean -fd || true
          git fetch origin build-logs || true
          if git show-ref --verify --quiet refs/remotes/origin/build-logs; then
            git checkout -f -B build-logs origin/build-logs
          else
            git checkout --orphan build-logs
            git rm -rf . || true
          fi
          mkdir -p runs
          cp /tmp/build.log runs/build-${{ github.run_number }}.log
          cp /tmp/build.log latest-build.log
          git add runs/build-${{ github.run_number }}.log latest-build.log
          git commit -m "docs: add build log for run ${{ github.run_number }}" || true
          git push origin build-logs || true

      - name: Compute Effective Build Number
        run: |
          EFFECTIVE_BUILD=$((130 + ${{ github.run_number }}))
          echo "EFFECTIVE_BUILD=$EFFECTIVE_BUILD" >> $GITHUB_ENV

      - name: Locate and Move APK
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" streamify.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-Debug-APK
          path: streamify.apk

      - name: Create Build Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.EFFECTIVE_BUILD }}
          name: Streamify Build ${{ env.EFFECTIVE_BUILD }}
          prerelease: true
          files: streamify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Canary Release
        if: success() && github.ref == 'refs/heads/streamify-yt-spt'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canary-build-${{ env.EFFECTIVE_BUILD }}
          name: Streamify Canary ${{ env.EFFECTIVE_BUILD }} (Flagship Test)
          prerelease: true
          make_latest: "false"
          files: streamify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Streamify v1.0.0 (Latest Build)
          prerelease: false
          files: streamify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. CODEQL STATIC ANALYSIS — previously `needs: build-and-compile` ("to
  # prevent orphaned runs"), but CodeQL traced its OWN build there anyway, so
  # the dependency bought nothing and serialized ~15 min behind the APK job.
  # Now starts at t=0 with build-mode=none (source-level analysis; no NDK or
  # Gradle toolchain setup needed at all).
  codeql-analysis:
    name: CodeQL Static Security & Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp, java-kotlin
          queries: security-and-quality
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  # 3. TEST MATRIX: Fast Verification (Every Push/PR)
  # ALL SHARDS START AT t=0 — they test sources/toolchains that do not depend
  # on the packaged APK. A red shard reports in parallel with the build, not
  # after it. (continue-on-error retained per audit-22 policy: shard flakiness
  # must not mask build status; the aggregate job still computes the verdict.)
  test-matrix:
    name: "Shard: ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory: shard flakiness must not mask build/release status.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "native-dsp"
            description: "KissFFT 2048 STFT, Krumhansl Key, Ellis BPM & EBU R128 LUFS"
            type: "native"
            target: "dsp_test_suite"

          - shard: "native-simd-physics"
            description: "128-D ARM NEON VectorStore & RK4 AirDrop ODE Solver"
            type: "native"
            target: "simd_physics_test_suite"

          - shard: "native-telemetry-storage"
            description: "Lock-Free SPSC Buffer, SHA-256 Proof-of-Compute & SQLite WAL"
            type: "native"
            target: "storage_telemetry_test_suite"

          - shard: "jvm-unit-suite"
            description: "Full JVM unit suite: CAD identity gates, fuzzy title/artist matching, dedup hashing"
            type: "android-jvm"
            target: "all"

          - shard: "rust-core-engine"
            description: "Zero-Copy SIMD JSON, Lofty Metadata, Lyric Precompiler & PTP"
            type: "rust"
            target: "rust"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.type == 'android-jvm'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        if: matrix.type == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Host Target Dir
        if: matrix.type == 'rust'
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-host-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/**/Cargo.toml') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: Set up Clang & Sanitizer Matrix
        if: matrix.type == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 cmake ninja-build libstdc++-13-dev ccache
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-17 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 100

      - name: Setup CCache for Native Shards
        if: matrix.type == 'native'
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          # Shared restore prefix across native shards + the fuzzer job:
          # first run populates, subsequent runs restore.
          key: ${{ runner.os }}-ccache-native-asan
          restore-keys: |
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Cache Android NDK & CMake
        id: ndk-cache
        if: matrix.type == 'android-jvm'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ${{ runner.os }}-ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK for AGP Sync
        if: matrix.type == 'android-jvm' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Setup Gradle
        if: matrix.type == 'android-jvm'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Execute Native C++20 ASan / UBSan Shard
        id: native_test
        if: matrix.type == 'native'
        run: |
          mkdir -p native/build && cd native/build
          cmake -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O2 -g" \
                -DSTREAMIFY_BUILD_TESTS=ON \
                -G Ninja ..
          ninja ${{ matrix.target }}
          ./${{ matrix.target }} > ../../shard-${{ matrix.shard }}.log 2>&1
        working-directory: .

      - name: Execute Android JVM State Machine & Chaos Shard
        id: jvm_test
        if: matrix.type == 'android-jvm'
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -Pstreamify.skipRust=true --stacktrace > shard-${{ matrix.shard }}.log 2>&1

      - name: Execute Rust Core Shard
        id: rust_test
        if: matrix.type == 'rust'
        run: |
          cargo test --manifest-path rust/Cargo.toml --verbose > shard-${{ matrix.shard }}.log 2>&1

      - name: Format Shard Log Header
        if: always()
        run: |
          touch shard-${{ matrix.shard }}.log
          STATUS="FAILED ❌"
          if [ "${{ matrix.type }}" == "native" ] && [ "${{ steps.native_test.outcome }}" == "success" ]; then
            STATUS="PASSED ✅"
          elif [ "${{ matrix.type }}" == "android-jvm" ] && [ "${{ steps.jvm_test.outcome }}" == "success" ]; then
            STATUS="PASSED ✅"
          elif [ "${{ matrix.type }}" == "rust" ] && [ "${{ steps.rust_test.outcome }}" == "success" ]; then
            STATUS="PASSED ✅"
          fi
          # printf + cat, NOT sed: the shard description embeds slashes
          # ("title/artist") which terminate a sed s/// script early.
          { printf '==================================================\nSHARD: %s\nDESCRIPTION: %s\nSTATUS: %s\n==================================================\n\n' \
              "${{ matrix.shard }}" "${{ matrix.description }}" "$STATUS";
            cat "shard-${{ matrix.shard }}.log"; } > "shard-${{ matrix.shard }}.log.tmp" \
            && mv "shard-${{ matrix.shard }}.log.tmp" "shard-${{ matrix.shard }}.log"

      - name: Upload Shard Log Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.log
          retention-days: 7

  # 4. NATIVE C++ DEEP FUZZING (Nightly & Main PRs)
  # No `needs`: fuzzing compiles its own harnesses from source; waiting for
  # the APK build added pure latency. Still advisory (continue-on-error).
  native-deep-fuzz:
    name: "Native C++20 LibFuzzer (Cached Corpus)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    if: github.event_name == 'schedule' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang-17 & LibFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 cmake ninja-build libstdc++-13-dev ccache
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-17 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 100

      - name: Setup CCache for Fuzzer Compilation
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: ${{ runner.os }}-ccache-native-fuzz
          restore-keys: |
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Restore Fuzzer Seed Corpus
        uses: actions/cache@v4
        with:
          path: native/fuzz/corpus
          key: libfuzzer-corpus-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            libfuzzer-corpus-

      - name: Compile & Run LibFuzzer
        id: fuzz_test
        run: |
          mkdir -p native/build native/fuzz/corpus native/fuzz/artifacts
          cd native/build
          cmake -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -O2 -g" \
                -DSTREAMIFY_BUILD_FUZZERS=ON \
                -G Ninja ..
          ninja dsp_fuzzer_harness
          FUZZ_TIME=300
          if [ "${{ github.event_name }}" == "schedule" ]; then FUZZ_TIME=900; fi
          ./dsp_fuzzer_harness ../fuzz/corpus -max_len=4096 -max_total_time=$FUZZ_TIME -artifact_prefix=../fuzz/artifacts/ > ../../shard-native-libfuzzer.log 2>&1 || true
          if ls ../fuzz/artifacts/crash-* 1> /dev/null 2>&1; then
            echo "FUZZER_FOUND_CRASH=true" >> $GITHUB_ENV
          fi

      - name: Upload Crash Artifacts on Fault
        if: env.FUZZER_FOUND_CRASH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libfuzzer-crash-dumps
          path: native/fuzz/artifacts/

      - name: Format Fuzzer Log Header
        if: always()
        run: |
          touch shard-native-libfuzzer.log
          STATUS="FAILED ❌"
          if [ "${{ env.FUZZER_FOUND_CRASH }}" != "true" ]; then
            STATUS="PASSED ✅"
          fi
          sed -i "1s/^/==================================================\nSHARD: native-libfuzzer\nDESCRIPTION: Deep LibFuzzer Crash Hunt\nSTATUS: $STATUS\n==================================================\n\n/" shard-native-libfuzzer.log

      - name: Upload Fuzzer Log Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-native-libfuzzer
          path: shard-native-libfuzzer.log

  # 5. MULTI-API ARM64 EMULATOR MATRIX (Nightly only — advisory)
  # Needs the built APK to install, so it stays downstream of the build —
  # but ONLY of the build, never of the test shards.
  emulator-matrix:
    name: "Emulator API ${{ matrix.api }} (ARM64)"
    needs: build-and-compile
    # ARM64 emulators need Hypervisor.Framework, and GitHub's macOS images
    # currently cannot use it (qemu aborts with `HVF error: HV_UNSUPPORTED`
    # on both macos-15 and macos-26; Ubuntu runners have no KVM either), so
    # these shards have never been able to run. Nightly-only: PRs see them
    # as skipped; re-enable for pull_request once the runner fleet recovers.
    runs-on: macos-15
    # Advisory: ARM64 emulator runs are slow/flaky on shared runners.
    continue-on-error: true
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
          - api: 30
            target: google_apis
          - api: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Android NDK & CMake
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Library/Android/sdk/ndk/26.1.10909125
            /Users/runner/Library/Android/sdk/cmake/3.22.1
          key: ${{ runner.os }}-ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK for AGP Sync
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Run Hardware-Accelerated ARM64 Emulator
        id: emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: arm64-v8a
          target: ${{ matrix.target }}
          script: |
            touch raw_emulator.log
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest -Pstreamify.skipRust=true --stacktrace > raw_emulator.log 2>&1

      - name: Format Emulator Log Header
        if: always()
        run: |
          touch raw_emulator.log
          STATUS="FAILED ❌"
          if [ "${{ steps.emulator_test.outcome }}" == "success" ]; then
            STATUS="PASSED ✅"
          fi
          echo "==================================================" > shard-emulator-api-${{ matrix.api }}.log
          echo "SHARD: emulator-api-${{ matrix.api }}" >> shard-emulator-api-${{ matrix.api }}.log
          echo "DESCRIPTION: Headless Media3 & Compose UI Emulator Tests (API ${{ matrix.api }} ARM64)" >> shard-emulator-api-${{ matrix.api }}.log
          echo "STATUS: $STATUS" >> shard-emulator-api-${{ matrix.api }}.log
          echo "==================================================" >> shard-emulator-api-${{ matrix.api }}.log
          cat raw_emulator.log >> shard-emulator-api-${{ matrix.api }}.log

      - name: Upload Shard Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-emulator-api-${{ matrix.api }}
          path: shard-emulator-api-${{ matrix.api }}.log

  # 6. AGGREGATION & DEPLOYMENT
  aggregate-and-publish-logs:
    name: Aggregate & Commit to testing-log
    runs-on: ubuntu-latest
    needs: [compile-check, build-and-compile, test-matrix, native-deep-fuzz, emulator-matrix, codeql-analysis]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download All Shard Logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: downloaded-logs
          merge-multiple: true

      - name: Aggregate Logs & Compute Status
        run: |
          echo "========================================================================" > combined-test.log
          echo "STREAMIFY EXTREME TESTING MATRIX AGGREGATE RUN #${{ github.run_number }}" >> combined-test.log
          echo "COMMIT: ${{ github.sha }}" >> combined-test.log
          echo "========================================================================" >> combined-test.log
          echo "" >> combined-test.log
          cat downloaded-logs/*.log >> combined-test.log 2>/dev/null || echo "WARN: No shard logs found." >> combined-test.log

          # Verdict scan. The emulator matrix is advisory (continue-on-error,
          # nightly-only — GitHub's macOS fleet currently cannot boot ARM64
          # emulators at all), so its shard logs are collected for visibility
          # but excluded from the gating verdict. Same for cancelled/failing
          # emulator jobs: they must not mask the rest of the matrix.
          SHARD_FAIL=0
          for f in downloaded-logs/*.log; do
            case "$(basename "$f")" in shard-emulator-*) continue ;; esac
            if grep -q "STATUS: FAILED ❌" "$f" 2>/dev/null; then SHARD_FAIL=1; fi
          done

          # Three-state verdict: PASSED / FAILED / CANCELLED.
          #
          # CANCELLED siblings are NOT failures. The concurrency group kills
          # older runs whenever several pushes race — the losing run's jobs
          # report "cancelled", which proves nothing either way about the
          # code. Treating that as FAILED painted a red X on PRs #30/#31
          # (2026-10-04): every real check was green, but the aggregate
          # job converted a concurrency cancel into a failure and blocked
          # the PRs for weeks. Only an explicit `failure` (or a FAILED
          # shard log) gates now.
          RESULTS="${{ needs.compile-check.result }},${{ needs.build-and-compile.result }},${{ needs.test-matrix.result }},${{ needs.native-deep-fuzz.result }},${{ needs.codeql-analysis.result }}"
          ANY_FAILED=$(printf '%s\n' "$RESULTS" | grep -c '^failure$' || true)
          ANY_CANCELLED=$(printf '%s\n' "$RESULTS" | grep -c '^cancelled$' || true)
          if [ "${ANY_FAILED:-0}" -gt 0 ] || [ "$SHARD_FAIL" -eq 1 ]; then
            echo "OVERALL_TEST_RESULT=FAILED" >> $GITHUB_ENV
          elif [ "${ANY_CANCELLED:-0}" -gt 0 ]; then
            echo "OVERALL_TEST_RESULT=CANCELLED (concurrency race — inconclusive, not a failure)" >> $GITHUB_ENV
            echo "" >> combined-test.log
            echo "NOTE: this run lost the concurrency race (siblings cancelled)." >> combined-test.log
            echo "Verdict is INCONCLUSIVE, not FAILED. A superseding run carries the verdict." >> combined-test.log
          else
            echo "OVERALL_TEST_RESULT=PASSED" >> $GITHUB_ENV
          fi

      - name: Push Combined Log to testing-log Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp combined-test.log /tmp/combined-test.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD || true
          git clean -fd || true
          git fetch origin testing-log || true
          if git show-ref --verify --quiet refs/remotes/origin/testing-log; then
            git checkout -f testing-log
            git pull --rebase origin testing-log || true
          else
            git checkout --orphan testing-log
            git rm -rf . || true
          fi
          mkdir -p runs
          cp /tmp/combined-test.log runs/test-run-${{ github.run_number }}.log
          cp /tmp/combined-test.log latest.log
          git add runs/test-run-${{ github.run_number }}.log latest.log
          git commit -m "test(ci): run #${{ github.run_number }} [${{ env.OVERALL_TEST_RESULT }}] [skip ci]" || true
          git push origin testing-log || true

      - name: Post Failure Comment on Triggering Commit
        if: env.OVERALL_TEST_RESULT == 'FAILED'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(grep -A 3 -B 1 "FAILED" combined-test.log | head -n 40 || echo "Errors encountered in test shards.")
          BODY=$(printf "### ❌ Extreme Test Suite Failure (Run #%s)\nDetailed traces committed to \`testing-log\` branch.\n\`\`\`text\n%s\n\`\`\`" "${{ github.run_number }}" "$ERRORS")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" || true
          exit 1
