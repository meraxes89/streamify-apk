# ============================================================================
# deploy-pages.yml — Build & Deploy Compose Multiplatform Wasm to GitHub Pages
#
# Deploys the full CMP Wasm client to https://meraxes89.github.io/streamify-apk/.
# Triggered on push to main (when web/wasm files change) or manual dispatch.
# ============================================================================
name: Deploy GitHub Pages (CMP Wasm)

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'core/**'
      - 'streamify-modules/**'
      - 'room-wasm-stub/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Wasm for Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply core submodule patches
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build wasmJs Browser Distribution
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx10g -XX:+UseParallelGC" \
            -Dkotlin.daemon.jvmargs="-Xmx10g"

      - name: Provide SPA fallback (404.html)
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          if [ ! -f "$DIST_DIR/404.html" ]; then
            cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
          fi

      - name: Precompress wasm distribution (.gz and .br)
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          sudo apt-get update && sudo apt-get install -y brotli
          find "$DIST_DIR" -type f \( -name "*.js" -o -name "*.wasm" -o -name "*.html" -o -name "*.css" \) \
            -exec gzip -9 -k -f {} \; \
            -exec brotli -q 11 -k -f {} \;
          echo "=== Pages Distribution Artifacts ==="
          ls -lh "$DIST_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
