# ============================================================================
# release.yml — deterministic release orchestration (resp6.md §5).
#
# Triggered by v* tags. NEVER scrapes artifacts from prior workflow runs
# (artifacts expire, commit SHAs drift, debug flags leak): the release
# invokes the EXACT SAME reusable workflows the ci.yml hub uses, directly on
# the release tag SHA, then collects everything in one atomic publish job.
#
#   engine   _ci-engine.yml  — full Rust suite + sanitizer matrix + the
#                             NDK artifacts the Android lane consumes
#                             (audit #44 P1-3 continuity: no binary is
#                             published before its tests ran — the retired
#                             release.yml ran cargo test + the JVM suite
#                             inline for exactly this reason).
#   android  _ci-android.yml  (release_mode)  -> Streamify-v<tag>.apk
#   desktop  _ci-desktop.yml  (installers)    -> .deb / .msi / .dmg
#   ios      _ci-ios.yml      (release_mode)  -> StreamifyCore.xcframework.zip
#
# publish-release downloads every artifact, emits SHA256SUMS, and attaches
# all binaries to the GitHub Release.
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    name: "Engine (tests + release artifacts)"
    uses: ./.github/workflows/_ci-engine.yml
    with:
      run_tests: true
      build_android_native: true
      build_linux_native: true

  android:
    name: "Android release APK"
    needs: engine
    uses: ./.github/workflows/_ci-android.yml
    with:
      release_mode: true
    secrets: inherit

  desktop:
    name: "Desktop installers (.deb / .msi)"
    needs: engine
    uses: ./.github/workflows/_ci-desktop.yml
    with:
      package_installers: true
      release_mode: true

  apple:
    name: "Apple Unified (.dmg & xcframework)"
    uses: ./.github/workflows/_ci-ios.yml
    with:
      package_installers: true
      release_mode: true

  publish-release:
    name: "Publish release (SHA256SUMS + binaries)"
    needs: [engine, android, desktop, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Android release APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: dist
          merge-multiple: true

      - name: Download desktop installers (.deb/.msi/.dmg)
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-installer-*
          path: dist
          merge-multiple: true

      - name: Download iOS xcframework (optional)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ios-xcframework
          path: dist
          merge-multiple: true

      - name: Stage release binaries & verify the manifest
        run: |
          set -euo pipefail
          mkdir -p release
          # Flatten every downloaded payload (installer artifacts keep their
          # jpackage directory structure inside the artifact zip).
          find dist -type f \( \
            -name '*.apk' -o -name '*.deb' -o -name '*.msi' -o \
            -name '*.dmg' -o -name '*.zip' \) -exec cp -v {} release/ \;
          echo "── release manifest:"
          ls -la release/

          # Hard verification of the expected production installer classes:
          ls release/Streamify-v*.apk            >/dev/null || { echo "FATAL: missing Streamify-v*.apk" >&2; exit 1; }
          ls release/streamify_*_amd64.deb      >/dev/null || { echo "FATAL: missing streamify_*_amd64.deb" >&2; exit 1; }
          ls release/Streamify-*.msi            >/dev/null || { echo "FATAL: missing Streamify-*.msi" >&2; exit 1; }
          ls release/Streamify-*.dmg            >/dev/null || { echo "FATAL: missing Streamify-*.dmg" >&2; exit 1; }

          # Optional iOS framework (reported if present, non-fatal if probe gated)
          if ls release/StreamifyCore.xcframework.zip >/dev/null 2>&1; then
            echo "Found StreamifyCore.xcframework.zip"
          else
            echo "StreamifyCore.xcframework.zip not present (Apple target gated upstream by MP-DEC-08)"
          fi

      - name: Generate SHA256SUMS
        run: |
          cd release
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS" ]; then
              sha256sum "$f"
            fi
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*
          generate_release_notes: true
