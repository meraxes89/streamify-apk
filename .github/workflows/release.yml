# ============================================================================
# release.yml — deterministic release orchestration (resp6.md §5).
#
# Triggered by v* tags or workflow_dispatch.
# NEVER scrapes stale artifacts: invokes the reusable workflows directly on
# the target SHA, then collects all binaries into one atomic publish job.
#
#   engine   _ci-engine.yml   — full Rust suite + sanitizer matrix + JNI/cdylib artifacts
#   android  _ci-android.yml  (release_mode) -> Streamify-v<tag>.apk
#   desktop  _ci-desktop.yml  (installers)   -> .AppImage / .deb / .msi
#   wasm     _ci-wasm.yml     (release_mode) -> Streamify-v<tag>-web-wasm.zip
#
# publish-release downloads every artifact, emits SHA256SUMS, and attaches
# all binaries to the GitHub Release.
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0, or leave blank to use branch name)'
        required: false
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create as prerelease'
        type: boolean
        default: false
      min_version_code:
        description: 'Minimum supported version code (0 for standard)'
        type: number
        default: 0
      breaking:
        description: 'Flag release as containing breaking changes'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: "Preflight (monotonicity & validation)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Version Code Monotonicity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANDIDATE_CODE=$(python3 -c '
          import re, pathlib
          text = pathlib.Path("gradle/libs.versions.toml").read_text()
          m = re.search(r"version-code\s*=\s*[\"\x27]?(\d+)", text)
          print(int(m.group(1)) if m else 0)
          ')
          echo "Candidate versionCode: $CANDIDATE_CODE"
          if [ "$CANDIDATE_CODE" -le 0 ]; then
            echo "::error::Invalid or missing versionCode in gradle/libs.versions.toml"
            exit 1
          fi

          MAX_PUBLISHED_CODE=0
          if command -v gh >/dev/null 2>&1 && [ -n "$GH_TOKEN" ]; then
            RELEASES=$(gh api repos/${{ github.repository }}/releases?per_page=20 --jq '.[].tag_name' 2>/dev/null || true)
            for tag in $RELEASES; do
              CODE=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[] | select(.name=="version.json") | .browser_download_url' 2>/dev/null | xargs -r curl -sL | jq -r '.versionCode // 0' 2>/dev/null || echo 0)
              if [ "$CODE" -gt "$MAX_PUBLISHED_CODE" ]; then
                MAX_PUBLISHED_CODE=$CODE
              fi
            done
          fi

          echo "Highest published versionCode: $MAX_PUBLISHED_CODE"
          if [ "$MAX_PUBLISHED_CODE" -gt 0 ] && [ "$CANDIDATE_CODE" -le "$MAX_PUBLISHED_CODE" ]; then
            echo "::error::Release blocked: Candidate versionCode ($CANDIDATE_CODE) is not strictly greater than highest published code ($MAX_PUBLISHED_CODE)."
            echo "::error::Increment version-code in gradle/libs.versions.toml to at least $(( MAX_PUBLISHED_CODE + 1 ))."
            exit 1
          fi
          echo "Version code monotonicity check passed."

  android:
    name: "Android release APK"
    needs: preflight
    uses: ./.github/workflows/_ci-android.yml
    with:
      release_mode: true
    secrets: inherit

  desktop:
    name: "Desktop installers (.deb / .rpm / .msi / .dmg)"
    needs: preflight
    uses: ./.github/workflows/_ci-desktop.yml
    with:
      package_installers: true
      release_mode: true
      full_matrix: true

  wasm:
    name: "Web Wasm distribution"
    needs: preflight
    uses: ./.github/workflows/_ci-wasm.yml
    with:
      release_mode: true

  ios:
    name: "Apple iOS release (Frameworks & Distribution)"
    needs: preflight
    uses: ./.github/workflows/_ci-ios.yml
    with:
      release_mode: true

  publish-release:
    name: "Publish release (SHA256SUMS + binaries)"
    needs: [android, desktop, wasm, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android release APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: dist
          merge-multiple: true

      - name: Download desktop installers (.AppImage/.deb/.msi)
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-installer-*
          path: dist
          merge-multiple: true

      - name: Download Web Wasm release archive
        uses: actions/download-artifact@v8
        with:
          name: wasm-release-archive
          path: dist
          merge-multiple: true

      - name: Download Apple iOS release archive
        uses: actions/download-artifact@v8
        with:
          name: ios-release-archive
          path: dist
          merge-multiple: true

      - name: Stage release binaries & verify the manifest
        run: |
          set -euo pipefail
          mkdir -p release
          # Flatten every downloaded payload
          find dist -type f \( \
            -name '*.apk' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o \
            -name '*.exe' -o -name '*.dmg' -o -name '*.pkg' -o -name '*.ipa' -o \
            -name '*.AppImage' -o -name '*.zip' \) -exec cp -v {} release/ \;
          echo "── release manifest:"
          ls -la release/

          # Verify that core platform binaries exist
          ls release/*.apk >/dev/null || { echo "FATAL: missing release APK" >&2; exit 1; }
          ls release/*web-wasm.zip >/dev/null || { echo "FATAL: missing web wasm archive" >&2; exit 1; }

      - name: Generate SHA256SUMS
        run: |
          cd release
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS" ]; then
              sha256sum "$f"
            fi
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Generate formatted release body
        run: |
          python3 scripts/generate_release_notes.py \
            --tag "${{ inputs.tag_name || github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --release-dir release \
            --changelog CHANGELOG.md \
            --output release_body.md
          cat release_body.md

      - name: Generate version.json manifest
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.breaking }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --breaking"
          fi
          if [ -n "${{ inputs.min_version_code }}" ] && [ "${{ inputs.min_version_code }}" != "0" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --min-version-code ${{ inputs.min_version_code }}"
          fi
          python3 scripts/make_version_json.py \
            --tag "${{ inputs.tag_name || github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --sums release/SHA256SUMS \
            --notes release_body.md \
            --git-sha "${{ github.sha }}" \
            --output release/version.json $EXTRA_FLAGS
          if [ -n "${{ secrets.STREAMIFY_ANNOUNCEMENT_KEY }}" ]; then
            STREAMIFY_ANNOUNCEMENT_KEY="${{ secrets.STREAMIFY_ANNOUNCEMENT_KEY }}" \
              node scripts/sign_version_json.js --path release/version.json
          fi
          cat release/version.json

      - name: Verify release manifest integrity & naming consistency
        run: |
          python3 - << 'PY'
          import json, sys

          with open("release/version.json") as f:
              manifest = json.load(f)

          artifacts = manifest.get("artifacts", {})
          print(f"Verified {len(artifacts)} release artifacts in manifest.")

          # Fail if legacy SimpMusic binary names leak into the release
          for key, data in artifacts.items():
              url = data.get("url", "")
              if "simpmusic" in url.lower() and not "streamify" in url.lower():
                  print(f"::error::Detected legacy 'SimpMusic' binary in manifest under key '{key}': {url}")
                  sys.exit(1)

          print("✅ All platform binaries correctly mapped with Streamify identity.")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: release_body.md
          files: |
            release/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
