name: Build APK from Ref

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / SHA to build (defaults to main; e.g. a legacy tag)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android Rust Targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK & CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Configure NDK Environment
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/26.1.10909125"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # audit #44 P2-5 — panic-boundary convention gate: every Java_*
      # export in rust/src/jni_bridge*.rs must carry catch_unwind. Cheap
      # source-level check; runs before the build so violations fail fast.
      - name: JNI panic-boundary convention gate
        run: python3 scripts/jni_panic_boundary_check.py

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-build-cache --no-daemon --stacktrace

      # audit #44 P0-1 — link-time JNI parity gate: every `external fun`
      # declared in NativeBridge.kt must resolve to a defined dynamic
      # symbol in at least one built .so. Source-level checks can miss
      # "implemented but not compiled into the CMake/cargo target"; this
      # diff runs on the artifacts that actually ship.
      - name: JNI ABI parity gate (nm on built .so)
        run: |
          NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ ! -x "$NM" ]; then NM=nm; fi
          python3 scripts/jni_parity_check.py --nm --nm-bin "$NM" \
            --so-glob 'app/build/**/*.so'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: streamify-apk-${{ inputs.ref }}
          path: app/build/outputs/apk/**/*.apk
