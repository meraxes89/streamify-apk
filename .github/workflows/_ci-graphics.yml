# ============================================================================
# _ci-graphics.yml — Tier 2 reusable spoke: Sovereign GPU Engine module
# (docs/gpu/CI_TESTING_SPEC.md; docs/gpu/PHASED_PLAN.md Phase 1-B / Phase 4).
#
# Callable ONLY via workflow_call, from ci.yml (PR / merge_group / push-main
# hub). Dispatched whenever the hub preflight's `graphics` path filter
# matches: streamify-modules/streamify-graphics/**, docs/gpu/** or this file.
#
# PHASE 1 SCOPE (ships with the Phase 1-B contracts PR):
#   `:streamify-modules:streamify-graphics:assemble` — compile verification
#   of the module across every KMP target (androidMain, desktopMain,
#   wasmJsMain). Per the Phase 1 task book, module builds are verified in
#   CI, never in a local sandbox.
#
# PHASE 2/4 (CI_TESTING_SPEC.md section 2) will extend this spoke with the
# 5-job matrix — TierGovernor state machine, API 27 (Vivo 1712) Robolectric,
# headless Skia offscreen golden vector, software-raster fallback gate,
# shader-compilation-failure fallback — as those test deliverables land.
# The jobs slot in below without touching the hub wiring.
#
# Mirrors the _ci-android.yml jvm-unit lane's proven setup: recursive
# submodule checkout (settings.gradle.kts maps :common/:data/:domain/...
# into core/), core.patch application, JDK 21, cached NDK+CMake for AGP
# sync, and -PskipExternalNativeBuild so no Rust/C++ lane ever runs here.
# ============================================================================
name: Graphics Engine Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  assemble-graphics:
    name: "Graphics: KMP assemble (android, desktop, wasmJs)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core submodule patch if present
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Not needed to compile the graphics module itself, but Gradle
      # configures the whole tree (settings.gradle.kts includes the core/
      # submodule projects) and AGP sync wants the NDK present — the same
      # tradeoff the _ci-android.yml jvm-unit lane makes.
      - name: Cache Android NDK & CMake
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ${{ runner.os }}-ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK for AGP sync
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: "Assemble :streamify-modules:streamify-graphics (all KMP targets)"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :streamify-modules:streamify-graphics:assemble \
            -PskipExternalNativeBuild=true \
            --parallel --build-cache --configuration-cache \
            --stacktrace 2>&1 | tee build.log

      - name: Upload build log (debug aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphics-build-log
          path: build.log
          if-no-files-found: ignore
