# Web Build — CI gate for the Streamify web port (WS-W P0).
#
# Per the P0 testing protocol: heavy suites run HERE, not in the dev
# sandbox. This workflow proves, per push/PR:
#   1. wasm32 compile gate (W0.2): the vendored web rustypipe +
#      streamify-wasm compile to wasm32-unknown-unknown with NO rquickjs
#      in the tree, and wasm-pack produces the web-target pkg.
#   2. wasm-bindgen-test (headless Chrome): the W0.2 ping test.
#   3. The web unit tests (vitest, headless): the P2-A resolver fixture
#      lock (the link solver must not break) AND the P2-B playback spine
#      suite (queue machine, persistence, scrobbler, gapless scheduler).
#   4. The web bundle builds (vite + strict tsc against the generated .d.ts).
#   5. The relay worker bundles (wrangler dry-run — no Cloudflare creds).
#
# The engine's own 429-test suite belongs to the frozen rust/ workspace's
# CI — it is deliberately NOT invoked here.
name: Web Build

# Path gating (CI cost audit, 2026-11): the broad `front-end/**` glob is
# replaced with explicit non-feishin paths — front-end/feishin/** PRs no
# longer fire the wasm32 crate builds, the headless-Chrome wasm tests, or
# the legacy Vite build (none of them read feishin sources; feishin is not
# an npm workspace member of this root). TWO feishin-coupled exceptions
# keep the #186 gates armed (see scripts/sync_feishin_resolver.py):
#   * the vendored resolver MIRROR subtree — hand-editing the mirror
#     instead of front-end/web must still red resolver-mirror-sync;
#   * scripts/sync_feishin_resolver.py itself — the gate's own logic.
# rust/crates/streamify-audio/** is watched because streamify-golden-wasm
# embeds that crate's golden vectors via include_bytes! — a rust-only
# golden-vector change must exercise the wasm32 parity suite too (the
# pre-gating blind spot). The stale ws-w/* push branch globs are pruned
# to [main] per web-deploy.yml's branch-list policy (all merged).
on:
  pull_request:
    paths:
      - 'front-end/web/**'
      - 'front-end/crates/**'
      - 'front-end/third_party/**'
      - 'front-end/relay/**'
      - 'front-end/canary/**'
      - 'front-end/.cargo/**'
      - 'front-end/package.json'
      - 'front-end/package-lock.json'
      - 'front-end/Cargo.toml'
      - 'front-end/Cargo.lock'
      - 'front-end/tsconfig.base.json'
      - 'rust/crates/streamify-audio/**'
      - 'front-end/feishin/src/renderer/api/streamify/playback/resolver/**'
      - 'scripts/sync_feishin_resolver.py'
      - '.github/workflows/web-build.yml'
  push:
    branches: [main]
    paths:
      - 'front-end/web/**'
      - 'front-end/crates/**'
      - 'front-end/third_party/**'
      - 'front-end/relay/**'
      - 'front-end/canary/**'
      - 'front-end/.cargo/**'
      - 'front-end/package.json'
      - 'front-end/package-lock.json'
      - 'front-end/Cargo.toml'
      - 'front-end/Cargo.lock'
      - 'front-end/tsconfig.base.json'
      - 'rust/crates/streamify-audio/**'
      - 'front-end/feishin/src/renderer/api/streamify/playback/resolver/**'
      - 'scripts/sync_feishin_resolver.py'
      - '.github/workflows/web-build.yml'

jobs:
  # ── P2-A: the vendored resolver mirror gate ────────────────────────────
  # The feishin fork carries a byte-identical mirror of the resolver stack.
  # Resolution fixes land in front-end/web ONLY (the two-stream rule); this
  # gate makes the rule mechanical — the mirror can never drift silently.
  resolver-mirror-sync:
    name: vendored resolver mirror sync (P2-A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Verify the mirror is byte-identical to front-end/web"
        run: python3 scripts/sync_feishin_resolver.py --check

  wasm:
    name: wasm32 compile gate (W0.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: front-end
      - name: "cargo check (wasm32-unknown-unknown)"
        run: cargo check --target wasm32-unknown-unknown -p streamify-wasm -p streamify-engine-wasm
        working-directory: front-end
      - name: "AC — rquickjs must NOT appear in the wasm32 tree"
        run: |
          if cargo tree --target wasm32-unknown-unknown -p streamify-wasm -e normal | grep -q rquickjs; then
            echo "::error::rquickjs found in the wasm32 dependency tree — W0.2 acceptance violated"
            exit 1
          fi
          echo "OK: no rquickjs in the wasm32 tree"
        working-directory: front-end
      - name: cargo build (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown -p streamify-wasm -p streamify-engine-wasm
        working-directory: front-end
      - name: Install wasm-pack
        run: npm i -g wasm-pack@0.15.1
      - name: "wasm-pack build (web target, --no-opt — the bundled wasm-opt rejects rustc bulk-memory ops)"
        run: |
          wasm-pack build crates/streamify-wasm --target web --out-dir pkg --no-opt
          wasm-pack build crates/streamify-engine-wasm --target web --out-dir pkg --no-opt
        working-directory: front-end
      - uses: actions/upload-artifact@v7
        with:
          name: streamify-wasm-pkg
          path: |
            front-end/crates/streamify-wasm/pkg/streamify_wasm.js
            front-end/crates/streamify-wasm/pkg/streamify_wasm.d.ts
            front-end/crates/streamify-wasm/pkg/streamify_wasm_bg.wasm
            front-end/crates/streamify-wasm/pkg/streamify_wasm_bg.wasm.d.ts
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm.js
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm.d.ts
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm_bg.wasm
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm_bg.wasm.d.ts
          if-no-files-found: error

  wasm-tests:
    name: wasm-bindgen-test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: front-end
      # MUST match the wasm-bindgen version resolved in front-end/Cargo.lock
      # (0.2.130 as of W0.2). A mismatch fails at test time with a version
      # skew error — bump this pin together with the lockfile.
      - name: "Install wasm-bindgen-cli (pin matches Cargo.lock)"
        run: cargo install wasm-bindgen-cli --version 0.2.130
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-add-to-path: true
      - name: Expose chrome to wasm-bindgen-test-runner
        run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: "Run wasm-bindgen-test (ping must return pong)"
        # No --headless flag: the 0.2.130 runner is env-driven (headless by
        # default; CHROME_BIN selects the binary). The runner is wired via
        # front-end/.cargo/config.toml [target.wasm32-unknown-unknown].
        run: cargo test -p streamify-wasm --target wasm32-unknown-unknown
        working-directory: front-end
      - name: "W2.1: engine control-plane semantics (headless Chrome)"
        # The wasm engine facade (front-end/crates/streamify-engine-wasm):
        # 17 semantic tests mirroring the UDL contract — debounce, rev
        # monotonicity, queue wrap-around, transport-never-touches-lifecycle,
        # seek clamping, DAC clock envelope, sink-state narrowing.
        run: cargo test -p streamify-engine-wasm --target wasm32-unknown-unknown
        working-directory: front-end
      - name: "W1.7: golden-vector DSP parity (headless Chrome)"
        # The frozen rust/crates/streamify-audio golden suite mirrored onto
        # wasm32 (front-end/crates/streamify-golden-wasm): 5 canonical
        # vectors through CanonicalSrc -> StudioEqualizer -> LufsNormalizer
        # against the native reference fixture at eps=1e-5. The crate
        # path-depends READ-ONLY into the frozen tree; the fixture is
        # embedded via include_bytes! from the frozen path.
        run: cargo test -p streamify-golden-wasm --target wasm32-unknown-unknown
        working-directory: front-end

  web:
    name: web build (vite + strict tsc)
    runs-on: ubuntu-latest
    needs: [wasm]
    # Same env the Pages deploy builds with (WS-W live wiring, 2026-11-12 —
    # see web-deploy.yml): the CI gate must run against the exact wired env,
    # not a bare one. Fork PRs see an empty anon key and build anon-degraded
    # (the canary env vars are all optional; the build stays green).
    env:
      VITE_RELAY_BASE_URL: https://streamify-relay.zephyr4289.workers.dev
      VITE_SUPABASE_URL: https://dbgtvzgwixerhnwvhtil.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: streamify-wasm-pkg
          # download-artifact paths are relative to the JOB workspace (repo
          # root), not the step's working-directory — land it inside
          # front-end so the staging find below sees it.
          path: front-end/pkg
      - name: "Stage wasm pkgs into web/src/wasm + web/src/wasm-engine"
        run: |
          mkdir -p web/src/wasm web/src/wasm-engine
          find pkg -type f \
            \( -name 'streamify_wasm.js' -o -name 'streamify_wasm.d.ts' \
               -o -name 'streamify_wasm_bg.wasm' -o -name 'streamify_wasm_bg.wasm.d.ts' \) \
            -exec cp {} web/src/wasm/ \;
          find pkg -type f \
            \( -name 'streamify_engine_wasm.js' -o -name 'streamify_engine_wasm.d.ts' \
               -o -name 'streamify_engine_wasm_bg.wasm' -o -name 'streamify_engine_wasm_bg.wasm.d.ts' \) \
            -exec cp {} web/src/wasm-engine/ \;
          ls -la web/src/wasm/ web/src/wasm-engine/
        working-directory: front-end
      - name: Install deps
        run: npm install --no-fund --no-audit
        working-directory: front-end
      - name: "Web unit tests (vitest — P2-A resolver fixture lock + P2-B playback spine)"
        # One lane, both suites: the recorded wire fixtures lock the link
        # solver's mapping behavior (any drift in resolve.ts breaks a
        # fixture), and the playback spine tests cover the queue machine,
        # persistence, scrobbler, and gapless scheduler. All network-free;
        # the live SABR corpus runs in resolver-canary.yml instead.
        run: npm test -w web
        working-directory: front-end
      - name: Build web (tsc --noEmit + vite build)
        run: npm run build -w web
        working-directory: front-end

  relay:
    name: relay worker bundles (wrangler dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install deps
        run: npm install --no-fund --no-audit
        working-directory: front-end
      - name: wrangler dry-run (no Cloudflare creds needed)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: front-end/relay
