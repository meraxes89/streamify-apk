# Web Build — CI gate for the wasm/relay crates the production app rides.
#
# P5-A cutover note: the legacy web app (front-end/web) is archived to
# legacy/front-end-web — read-only history, outside every active lane. The
# GitHub Pages deployment (web-deploy.yml) is retired with it: production
# runs the feishin fork via Docker (front-end/feishin/Dockerfile +
# docker-compose.yaml). What this workflow still proves, per push/PR:
#   1. wasm32 compile gate (W0.2): the vendored web rustypipe +
#      streamify-wasm compile to wasm32-unknown-unknown with NO rquickjs
#      in the tree, and wasm-pack produces the web-target pkg (the feishin
#      P4-A cipher artifact is staged deterministically from this lane's
#      output shape).
#   2. wasm-bindgen-test (headless Chrome): the W0.2 ping test, the
#      W2.1 engine control-plane semantics and the W1.7 golden-vector
#      DSP parity.
#   3. The relay worker bundles (wrangler dry-run — no Cloudflare creds).
#
# The retired jobs, for the Branch Protection record (see the P5-A PR):
#   * resolver-mirror-sync — the feishin resolver tree is now the CANONICAL
#     source (front-end/web archived); its integrity is enforced by
#     scripts/check_feishin_resolver.py in ci.yml's preflight instead.
#   * web (vite + tsc + unit tests) — the legacy web app build; the unit
#     suites that still matter run inside front-end/feishin (feishin-ci.yml)
#     and the live SABR corpus runs from the feishin resolver tree in
#     resolver-canary.yml.
#
# The engine's own 429-test suite belongs to the frozen rust/ workspace's
# CI — it is deliberately NOT invoked here.
name: Web Build

# Path gating (CI cost audit, 2026-11, updated P5-A): the retired
# front-end/web/** glob is gone with the archive; the feishin resolver
# mirror path + scripts/sync_feishin_resolver.py triggers are gone with
# the mirror-sync gate (the resolver is now covered by feishin-ci.yml on
# every front-end/feishin/** PR and by the preflight integrity check on
# every event). What remains watches exactly the inputs of the jobs below.
# rust/crates/streamify-audio/** is watched because streamify-golden-wasm
# embeds that crate's golden vectors via include_bytes! — a rust-only
# golden-vector change must exercise the wasm32 parity suite too.
on:
  pull_request:
    paths:
      - 'front-end/crates/**'
      - 'front-end/third_party/**'
      - 'front-end/relay/**'
      - 'front-end/feishin/src/renderer/features/streamify-canary/**'
      - 'front-end/.cargo/**'
      - 'front-end/package.json'
      - 'front-end/package-lock.json'
      - 'front-end/Cargo.toml'
      - 'front-end/Cargo.lock'
      - 'front-end/tsconfig.base.json'
      - 'rust/crates/streamify-audio/**'
      - '.github/workflows/web-build.yml'
  push:
    branches: [main]
    paths:
      - 'front-end/crates/**'
      - 'front-end/third_party/**'
      - 'front-end/relay/**'
      - 'front-end/feishin/src/renderer/features/streamify-canary/**'
      - 'front-end/.cargo/**'
      - 'front-end/package.json'
      - 'front-end/package-lock.json'
      - 'front-end/Cargo.toml'
      - 'front-end/Cargo.lock'
      - 'front-end/tsconfig.base.json'
      - 'rust/crates/streamify-audio/**'
      - '.github/workflows/web-build.yml'

jobs:
  wasm:
    name: wasm32 compile gate (W0.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: front-end
      - name: "cargo check (wasm32-unknown-unknown)"
        run: cargo check --target wasm32-unknown-unknown -p streamify-wasm -p streamify-engine-wasm
        working-directory: front-end
      - name: "AC — rquickjs must NOT appear in the wasm32 tree"
        run: |
          if cargo tree --target wasm32-unknown-unknown -p streamify-wasm -e normal | grep -q rquickjs; then
            echo "::error::rquickjs found in the wasm32 dependency tree — W0.2 acceptance violated"
            exit 1
          fi
          echo "OK: no rquickjs in the wasm32 tree"
        working-directory: front-end
      - name: cargo build (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown -p streamify-wasm -p streamify-engine-wasm
        working-directory: front-end
      - name: Install wasm-pack
        run: npm i -g wasm-pack@0.15.1
      - name: "wasm-pack build (web target, --no-opt — the bundled wasm-opt rejects rustc bulk-memory ops)"
        run: |
          wasm-pack build crates/streamify-wasm --target web --out-dir pkg --no-opt
          wasm-pack build crates/streamify-engine-wasm --target web --out-dir pkg --no-opt
        working-directory: front-end
      - uses: actions/upload-artifact@v7
        with:
          name: streamify-wasm-pkg
          path: |
            front-end/crates/streamify-wasm/pkg/streamify_wasm.js
            front-end/crates/streamify-wasm/pkg/streamify_wasm.d.ts
            front-end/crates/streamify-wasm/pkg/streamify_wasm_bg.wasm
            front-end/crates/streamify-wasm/pkg/streamify_wasm_bg.wasm.d.ts
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm.js
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm.d.ts
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm_bg.wasm
            front-end/crates/streamify-engine-wasm/pkg/streamify_engine_wasm_bg.wasm.d.ts
          if-no-files-found: error

  wasm-tests:
    name: wasm-bindgen-test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: front-end
      # MUST match the wasm-bindgen version resolved in front-end/Cargo.lock
      # (0.2.130 as of W0.2). A mismatch fails at test time with a version
      # skew error — bump this pin together with the lockfile.
      - name: "Install wasm-bindgen-cli (pin matches Cargo.lock)"
        run: cargo install wasm-bindgen-cli --version 0.2.130
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-add-to-path: true
      - name: Expose chrome to wasm-bindgen-test-runner
        run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: "Run wasm-bindgen-test (ping must return pong)"
        # No --headless flag: the 0.2.130 runner is env-driven (headless by
        # default; CHROME_BIN selects the binary). The runner is wired via
        # front-end/.cargo/config.toml [target.wasm32-unknown-unknown].
        run: cargo test -p streamify-wasm --target wasm32-unknown-unknown
        working-directory: front-end
      - name: "W2.1: engine control-plane semantics (headless Chrome)"
        # The wasm engine facade (front-end/crates/streamify-engine-wasm):
        # 17 semantic tests mirroring the UDL contract — debounce, rev
        # monotonicity, queue wrap-around, transport-never-touches-lifecycle,
        # seek clamping, DAC clock envelope, sink-state narrowing.
        run: cargo test -p streamify-engine-wasm --target wasm32-unknown-unknown
        working-directory: front-end
      - name: "W1.7: golden-vector DSP parity (headless Chrome)"
        # The frozen rust/crates/streamify-audio golden suite mirrored onto
        # wasm32 (front-end/crates/streamify-golden-wasm): 5 canonical
        # vectors through CanonicalSrc -> StudioEqualizer -> LufsNormalizer
        # against the native reference fixture at eps=1e-5. The crate
        # path-depends READ-ONLY into the frozen tree; the fixture is
        # embedded via include_bytes! from the frozen path.
        run: cargo test -p streamify-golden-wasm --target wasm32-unknown-unknown
        working-directory: front-end

  relay:
    name: relay worker bundles + ytm-meta tests (wrangler dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install deps
        run: npm install --no-fund --no-audit
        working-directory: front-end
      - name: ytm-meta network-free vitest (W1-A)
        # The edge metadata cache lane: key encoding (gl/hl isolation),
        # TTL matrix, synced-flag preservation, single-flight coalescing,
        # KV-absent fallback, SWR policy, failure separation. Runs before
        # the dry-run so a broken module never reaches the bundler.
        run: npm test
        working-directory: front-end/relay
      - name: wrangler dry-run (no Cloudflare creds needed)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: front-end/relay
