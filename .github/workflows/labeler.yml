# ============================================================================
# labeler.yml — Automatically label PRs based on paths modified.
# Uses official actions/labeler@v5.
# ============================================================================
name: "PR Labeler"

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: "Auto-label PR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: false
