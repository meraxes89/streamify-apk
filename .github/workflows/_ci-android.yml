# ============================================================================
# _ci-android.yml — Tier 2 reusable spoke: Android app, NDK consumption & APK.
# (resp6.md §2 hub-and-spoke; extracted from the retired
# extreme-test-matrix.yml build/test lanes + release.yml's release path.)
#
# Callable ONLY via workflow_call, from:
#   * ci.yml      (PR / merge_group / push-main hub, release_mode: false)
#   * release.yml (tag-driven release, release_mode: true)
#
# Jobs:
#   jvm-unit       the :app:testDebugUnitTest suite (skipExternalNativeBuild:
#                  the UniFFI bindgen still runs on the host, the NDK lanes
#                  do not — the monolith's proven hermetic split).
#   assemble-apk   consumes the jniLibs-<abi> artifacts cross-compiled ONCE by
#                  _ci-engine.yml (build-once / fan-out, resp6 §3), stages
#                  them into app/src/main/jniLibs, then assembles the APK
#                  with -PciPrebuiltNativeDir + -PskipExternalNativeBuild so
#                  Gradle never recompiles Rust/C++ here.
#
# ABI scope: arm64-v8a + x86_64 (matches the engine factory).
#
# release_mode: true switches assembleDebug -> assembleRelease with the SEC-04
# production keystore (fail-fast, no debug-signing fallback) and renames the
# APK to Streamify-v<tag>.apk for the release publish job.
# ============================================================================
name: CI Android (App, NDK & APK)

on:
  workflow_call:
    inputs:
      release_mode:
        description: Assemble a signed release APK (Streamify-v<tag>.apk) instead of the debug APK.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── JVM unit suite: state machines, chaos, CAD identity gates ───────────────
  jvm-unit:
    name: "Tests"
    if: ${{ !inputs.release_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core submodule patch if present
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Android NDK & CMake
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ${{ runner.os }}-ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK for AGP sync
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run :androidApp:testDebugUnitTest
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:testDebugUnitTest \
            -PskipExternalNativeBuild=true \
            --parallel --build-cache --configuration-cache --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-jvm-test-reports
          path: androidApp/build/reports/tests/**
          if-no-files-found: ignore

  # ── APK assembly over the prebuilt engine artifacts ─────────────────────────
  assemble-apk:
    name: "APK"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GOV-05: release signing secrets (RELEASE_KEYSTORE_B64, KEYSTORE_PASSWORD,
    # KEY_ALIAS, KEY_PASSWORD) live ONLY in the protected `release` GitHub
    # environment — tag-scoped to `v*` and reviewer-gated, so no PR lane, no
    # scheduled job and no arbitrary branch can ever read a signing secret.
    # On the PR path (release_mode: false) the expression resolves to an
    # empty string = NO environment: the debug lane runs exactly as before,
    # and can never see the environment's secrets.
    environment: ${{ inputs.release_mode && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Apply core submodule patch if present
        run: |
          if [ -f core.patch ]; then
            git -C core apply --ignore-space-change --ignore-whitespace ../core.patch
            echo "Successfully applied core.patch to core submodule"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Pre-compile Kotlin & resources
        run: |
          chmod +x gradlew
          ./gradlew \
            :androidApp:compileDebugKotlin \
            :androidApp:compileDebugJavaWithJavac \
            :androidApp:processDebugResources \
            -PskipExternalNativeBuild=true \
            --build-cache --configuration-cache

      - name: "Decode release keystore"
        if: inputs.release_mode
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Notice: no RELEASE_KEYSTORE_B64 secret found; falling back to repository signing config."
          fi

      - name: Assemble debug APK
        if: ${{ !inputs.release_mode }}
        env:
          # Backend wiring: the anon (publishable) key for the live Supabase
          # project, so CI-built APKs talk to the real backend instead of
          # degrading to anonymous mode. Never in the tree (gitleaks JWT
          # rule); repo secret only. Fork PRs see an empty value and keep
          # the historical anon-degraded behavior.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug \
            -PskipExternalNativeBuild=true \
            --build-cache --configuration-cache \
            --stacktrace 2>&1 | tee build.log

      - name: Assemble release APK
        if: inputs.release_mode
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleRelease :vivoAndroidApp:assembleRelease \
            -PskipExternalNativeBuild=true \
            --build-cache --configuration-cache \
            --stacktrace 2>&1 | tee build.log

      # Hard verification: the universal APK must carry BOTH beta ABIs.
      - name: Verify architectures
        run: |
          APK=$(find androidApp/build/outputs/apk -name "*universal*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find androidApp/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "FATAL: no APK produced!" >&2
            exit 1
          fi
          echo "Inspecting universal APK: $APK"
          for ABI in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/" || { echo "FATAL: missing $ABI in $APK" >&2; exit 1; }
          done
          echo "Verified universal APK contains arm64-v8a and x86_64."

      - name: Upload build log (debug aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload debug APK artifact
        if: ${{ !inputs.release_mode }}
        uses: actions/upload-artifact@v7
        with:
          name: Streamify-Debug-APK
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Stage release APKs as Streamify-v<tag>*.apk
        if: inputs.release_mode
        run: |
          mkdir -p staged-apks
          # Determine version tag from gradle version catalog or ref
          VERSION_NAME=$(grep -m 1 'version-name =' gradle/libs.versions.toml | cut -d '"' -f 2 || echo "")
          if [ -n "$VERSION_NAME" ]; then
            TAG_CLEAN="v${VERSION_NAME#v}"
          else
            TAG_OR_REF="${GITHUB_REF_NAME:-latest}"
            TAG_CLEAN="${TAG_OR_REF//\//-}"
          fi
          
          # Find all release APKs (both universal and per-ABI splits)
          APKS=$(find androidApp/build/outputs/apk/release -name "*.apk")
          if [ -z "$APKS" ]; then
            APKS=$(find androidApp/build/outputs/apk -name "*.apk")
          fi
          if [ -z "$APKS" ]; then
            echo "FATAL: no release APK produced!" >&2
            exit 1
          fi
          
          for APK in $APKS; do
            BASE=$(basename "$APK" .apk)
            TARGET="Streamify-${TAG_CLEAN}-${BASE}.apk"
            cp -v "$APK" "$TARGET"
          done
          
          # Also stage universal/primary APK directly as Streamify-${TAG_CLEAN}.apk for standard downloads
          UNIV=$(find androidApp/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
          if [ -z "$UNIV" ]; then
            UNIV=$(echo "$APKS" | head -n 1)
          fi
          cp -v "$UNIV" "Streamify-${TAG_CLEAN}.apk"

          # Stage vivo release APKs
          VIVO_APKS=$(find vivoAndroidApp/build/outputs/apk/release -name "*.apk" 2>/dev/null)
          for APK in $VIVO_APKS; do
            BASE=$(basename "$APK" .apk)
            TARGET="Streamify-vivo-${TAG_CLEAN}-${BASE}.apk"
            cp -v "$APK" "$TARGET"
          done

          ls -la Streamify-*.apk

      - name: Upload release APK artifact
        if: inputs.release_mode
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: Streamify-*.apk
          if-no-files-found: error
