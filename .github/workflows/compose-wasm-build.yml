name: Compose Multiplatform Wasm Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'composeApp/**'
      - 'core/**'
      - 'streamify-modules/**'
      - 'room-wasm-stub/**'
      - 'lastfm/**'
      - 'lastfm-empty/**'
      - 'core.patch'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/compose-wasm-build.yml'
      - '.github/workflows/_ci-wasm.yml'

jobs:
  wasm:
    name: "Web Wasm Build"
    uses: ./.github/workflows/_ci-wasm.yml
    with:
      release_mode: false
