# ============================================================================
# _ci-ios.yml — Tier 2 reusable spoke: Apple iOS native lane (MP-CAP03 /
# Multiplatform invariant 2), the coverage the repo never had.
#
# Callable ONLY via workflow_call, from:
#   * ci.yml      (PR / merge_group / push-main hub)
#   * release.yml (tag-driven release, release_mode: true)
#
# Runner: macos-14 (Apple Silicon).
#
# Consolidated single-runner architecture: combines xcodebuild simulator
# tests and xcframework probe into ONE macos-14 runner to eliminate macOS
# runner queue starvation and prevent queue timeouts.
# ============================================================================
name: CI iOS (XCFramework & Swift)

on:
  workflow_call:
    inputs:
      release_mode:
        description: Build the xcframework in release profile and upload StreamifyCore.xcframework.zip.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: "iOS XCFramework & Swift Tests"
    runs-on: macos-14
    timeout-minutes: 45
    env:
      STREAMIFY_IOS_PROFILE: ${{ inputs.release_mode && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v7

      # ── 1. iOS Simulator Test Pass (Headless xcodebuild) ─────────────────
      - name: Cache DerivedData & SwiftPM (resp7 risk register)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('iosApp/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Discover an available iOS Simulator
        run: |
          SIM_NAME="$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = [d["name"] for v in devices.values() for d in v if d.get("isAvailable")]
          iphones = [n for n in names if "iPhone" in n]
          print(iphones[0] if iphones else (names[0] if names else ""))
          ')"
          if [ -z "$SIM_NAME" ]; then
            echo "FATAL: no available iOS Simulator on this runner" >&2
            exit 1
          fi
          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      # The Swift package compiles TODAY against the preview gateway (the
      # real engine lane is #if canImport(uniffi_streamify)-gated), so the
      # suite runs without linking the xcframework.
      - name: Run StreamifyIOSTests (headless xcodebuild)
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild test \
            -scheme StreamifyIOS \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -quiet 2>&1 | tee xcodebuild-test.log

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-log
          path: iosApp/xcodebuild-test.log
          if-no-files-found: ignore

      # ── 2. Rust Core / XCFramework Probe & Assembly ───────────────────────
      - name: Set up Rust toolchain (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Setup Rust cache (iOS targets)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: ios-targets
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache (mandatory compiler caching, resp6 §3)
        uses: mozilla-actions/sccache-action@v0.0.11

      # MP-DEC-08: does the engine compile for the Apple targets TODAY?
      # Probes both slices the xcframework assembles (device + arm64 sim;
      # x86_64 sim shares the same source cfg tree). While either fails,
      # the real build is reported as blocked upstream — green with a loud
      # notice, never red noise — and re-arms automatically once the rust
      # tree heals.
      - name: Probe Apple-target engine buildability (MP-DEC-08)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        run: |
          set +e
          cargo check --manifest-path rust/Cargo.toml --lib --target aarch64-apple-ios --quiet
          device_status=$?
          cargo check --manifest-path rust/Cargo.toml --lib --target aarch64-apple-ios-sim --quiet
          sim_status=$?
          set -e
          if [ "$device_status" -eq 0 ] && [ "$sim_status" -eq 0 ]; then
            echo "ENGINE_APPLE_BUILDABLE=1" >> "$GITHUB_ENV"
            echo "engine compiles for aarch64-apple-ios + sim — xcframework build will run"
          else
            echo "ENGINE_APPLE_BUILDABLE=0" >> "$GITHUB_ENV"
            echo "engine does NOT compile for Apple targets yet (device=$device_status, sim=$sim_status) — xcframework build reports blocked-upstream"
          fi

      - name: Build StreamifyCore.xcframework + UniFFI Swift bindings
        if: env.ENGINE_APPLE_BUILDABLE == '1'
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        run: bash scripts/build_ios_xcframework.sh

      - name: Engine blocked upstream (reported, not failed)
        if: env.ENGINE_APPLE_BUILDABLE == '0'
        run: |
          echo "=============================================================================="
          echo " STREAMIFYCORE.XCFRAMEWORK: BLOCKED UPSTREAM (reported, not failed)"
          echo "=============================================================================="
          echo " The sovereign Rust core does not compile for the Apple targets yet:"
          echo "   probe: cargo check --manifest-path rust/Cargo.toml --lib --"
          echo "          target aarch64-apple-ios && ... --target aarch64-apple-ios-sim"
          echo " rust/src/platform/** is outside the CI subtree and must be healed"
          echo " upstream; this job auto-activates the real build the moment that"
          echo " lands — the probe is the gate (MP-DEC-08)."
          echo "=============================================================================="

      - name: Zip the xcframework
        if: env.ENGINE_APPLE_BUILDABLE == '1'
        run: |
          cd dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            StreamifyCore.xcframework StreamifyCore.xcframework.zip
          ls -la StreamifyCore.xcframework.zip

      - name: Upload xcframework artifact
        if: env.ENGINE_APPLE_BUILDABLE == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcframework
          path: dist/ios/StreamifyCore.xcframework.zip
          if-no-files-found: error

      - name: Upload Swift bindings (debug aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-swift-bindings
          path: dist/ios/swift/
          if-no-files-found: ignore
