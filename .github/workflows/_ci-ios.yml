# ============================================================================
# _ci-ios.yml — Tier 2 reusable spoke: Apple Unified Lane (resp8/resp9).
# Combines iOS Swift tests, XCFramework build, macOS engine cdylib build,
# and macOS desktop UI & JNA smoke suite into ONE SINGLE macos-15 runner job.
#
# Runner label history: macos-14 until 2026-11-09, then migrated to macos-15
# after GitHub retired the macOS 14 image on 2026-11-02 (github.blog
# changelog 2026-10-01) — post-retirement the dead label instant-cancels
# every Apple-lane job with no runner assigned, folding red into ci-gate.
#
# TRUTH-01(a) + IOS-02 (2026-11-09): "green means green" on the Apple lane.
#   * The Apple-target `cargo check` is a BLOCKING failure on every event
#     except pull requests from forks (the advisory notice survives only
#     there — a fork contributor cannot heal our Rust tree).
#   * The lane now LINKS the xcframework it builds: the framework is
#     built (or restored from the content-addressed cache) and staged at
#     iosApp/Frameworks/ BEFORE `xcodebuild test`, so Package.swift's
#     conditional binary target activates the REAL engine lane and the
#     28 `#if canImport(streamifyFFI)` UniFFI contract tests in
#     EngineTests/UniFFIContractTests.swift actually execute. This is
#     the first time Gate 2 of SWIFT_MIGRATION_PLAN.MD has ever run.
# ============================================================================
name: CI Apple Unified (iOS & macOS)

on:
  workflow_call:
    inputs:
      release_mode:
        description: Build the xcframework in release profile and upload StreamifyCore.xcframework.zip.
        type: boolean
        default: false
      package_installers:
        description: Package the desktop macOS distribution (DMG).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apple:
    name: "Apple Unified (iOS Tests, XCFramework, macOS Desktop)"
    runs-on: macos-15
    timeout-minutes: 40
    env:
      STREAMIFY_IOS_PROFILE: ${{ inputs.release_mode && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v7

      # ── WS-B B2 gate: PreviewCatalog production lint (fast fail, no toolchain)
      - name: "WS-B B2 gate: zero PreviewCatalog in production paths"
        run: python3 scripts/apple_preview_catalog_lint.py

      # ── 0. Rust toolchain FIRST: the engine feeds every downstream pass ────
      - name: Set up Rust toolchain (Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          # SW-ENG1-02 universal matrix: iOS device, Apple Silicon
          # simulator, and both macOS arches for the fat darwin slice.
          # (x86_64-apple-ios-sim — the Intel SIMULATOR triple — is NOT
          # distributed in any Rust stable channel: requesting it fails
          # the whole `rustup toolchain install`. build_ios_xcframework.sh
          # probes for it separately and degrades the simulator slice to
          # arm64-only when the std is unavailable.)
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust cache (Apple targets)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: apple-targets
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}

      - name: Setup sccache (mandatory compiler caching, resp6 §3)
        uses: mozilla-actions/sccache-action@v0.0.11

      # ── 1. XCFramework: content-addressed cache, then build-or-restore ────
      # The fingerprint covers rust/ + native/ AND the assembly script
      # itself: a scripts/build_ios_xcframework.sh change (slice matrix,
      # sanity pass, glue flags) must invalidate the cached artifact —
      # otherwise a stale xcframework would be re-uploaded unvalidated.
      - name: Compute Apple Engine Fingerprint
        id: engine_fingerprint
        run: |
          ENGINE_HASH=$(git ls-tree -r HEAD rust/ native/ scripts/build_ios_xcframework.sh | python3 -c "
          import sys, hashlib
          h = hashlib.sha256()
          for line in sys.stdin:
              parts = line.strip().split()
              if len(parts) >= 3:
                  h.update(parts[2].encode())
          print(h.hexdigest()[:16])
          ")
          echo "ENGINE_HASH=${ENGINE_HASH}" >> "$GITHUB_ENV"
          echo "hash=${ENGINE_HASH}" >> "$GITHUB_OUTPUT"
          echo "Apple engine fingerprint: ${ENGINE_HASH}"

      - name: Restore Prebuilt StreamifyCore.xcframework (5-second cache)
        id: xcframework_cache
        uses: actions/cache@v4
        with:
          path: |
            dist/ios/StreamifyCore.xcframework
            dist/ios/swift
          key: apple-xcframework-${{ runner.os }}-${{ env.ENGINE_HASH }}

      # TRUTH-01(a): a failing Apple-target compile is a REAL failure —
      # "BLOCKED UPSTREAM (reported, not failed)" is gone. The advisory
      # behavior survives ONLY for pull requests from forks.
      - name: Check Apple-target engine buildability (blocking, TRUTH-01)
        if: steps.xcframework_cache.outputs.cache-hit != 'true'
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        run: |
          set +e
          cargo check --manifest-path rust/Cargo.toml --lib --target aarch64-apple-ios --quiet
          device_status=$?

          # TRUTH-01 env fix (first CI pass): the SIM check tripped
          # rquickjs-sys's bindgen — clang parses the rust triple
          # 'aarch64-apple-ios-sim' as an invalid VERSION ("version 'sim'
          # in target triple ... is invalid") and without an -isysroot it
          # cannot even find stdio.h. Point bindgen's clang at the iOS
          # Simulator SDK with the clang-spelled triple; a trailing
          # --target overrides the rustc-spelled one. The device check
          # above stays untouched (it compiles as-is).
          SIM_SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export SDKROOT="$SIM_SDKROOT"
          export BINDGEN_EXTRA_CLANG_ARGS="--target=arm64-apple-ios-simulator -isysroot $SIM_SDKROOT"
          cargo check --manifest-path rust/Cargo.toml --lib --target aarch64-apple-ios-sim --quiet
          sim_status=$?
          unset SDKROOT BINDGEN_EXTRA_CLANG_ARGS
          set -e
          if [ "$device_status" -eq 0 ] && [ "$sim_status" -eq 0 ]; then
            echo "ENGINE_APPLE_BUILDABLE=1" >> "$GITHUB_ENV"
            echo "engine compiles for aarch64-apple-ios + sim — xcframework build will run"
          else
            echo "ENGINE_APPLE_BUILDABLE=0" >> "$GITHUB_ENV"
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::warning::FORK PR: Apple-target engine check failing (device=$device_status, sim=$sim_status) — reported, not failed (TRUTH-01 fork exemption)"
            else
              echo "::error::The Rust core does NOT compile for Apple targets (device=$device_status, sim=$sim_status). This is a blocking failure (TRUTH-01): green means green on main."
              exit 1
            fi
          fi

      - name: Build StreamifyCore.xcframework + UniFFI Swift bindings
        if: steps.xcframework_cache.outputs.cache-hit != 'true' && env.ENGINE_APPLE_BUILDABLE == '1'
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
          STREAMIFY_IOS_SKIP_X86_SIM: ${{ inputs.release_mode && '0' || '1' }}
        run: bash scripts/build_ios_xcframework.sh

      # Fork PRs only (ENGINE_APPLE_BUILDABLE == '0' is unreachable on
      # non-fork events since TRUTH-01 made the check fail the job).
      - name: Engine blocked upstream (fork advisory, TRUTH-01 exemption)
        if: steps.xcframework_cache.outputs.cache-hit != 'true' && env.ENGINE_APPLE_BUILDABLE == '0'
        run: |
          echo "=============================================================================="
          echo " STREAMIFYCORE.XCFRAMEWORK: BLOCKED UPSTREAM (fork PR, reported, not failed)"
          echo "=============================================================================="
          echo " The sovereign Rust core does not compile for the Apple targets yet:"
          echo "   probe: cargo check --manifest-path rust/Cargo.toml --lib --"
          echo "          target aarch64-apple-ios && ... --target aarch64-apple-ios-sim"
          echo " Fork contributors cannot heal the Rust tree; maintainers see this"
          echo " as a BLOCKING failure on branch runs (TRUTH-01)."
          echo "=============================================================================="

      - name: Zip the xcframework
        if: steps.xcframework_cache.outputs.cache-hit == 'true' || env.ENGINE_APPLE_BUILDABLE == '1'
        run: |
          cd dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            StreamifyCore.xcframework StreamifyCore.xcframework.zip
          ls -la StreamifyCore.xcframework.zip

      - name: Upload xcframework artifact
        if: steps.xcframework_cache.outputs.cache-hit == 'true' || env.ENGINE_APPLE_BUILDABLE == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcframework
          path: dist/ios/StreamifyCore.xcframework.zip
          if-no-files-found: error

      # ── 2. IOS-02: STAGE the framework so the real lane links ─────────────
      # iosApp/Frameworks/StreamifyCore.xcframework + the probe-gated
      # Generated/uniffi_streamify.swift make Package.swift's conditional
      # binary target active: xcodebuild test below compiles and RUNS the
      # real-engine test lane instead of the preview gateway.
      - name: Stage xcframework into the SPM package (IOS-02)
        if: steps.xcframework_cache.outputs.cache-hit == 'true' || env.ENGINE_APPLE_BUILDABLE == '1'
        run: |
          bash scripts/build_ios_xcframework.sh --stage-only
          echo "REAL_LANE_STAGED=1" >> "$GITHUB_ENV"
          ls -la iosApp/Frameworks/ iosApp/Sources/StreamifyIOS/Generated/ || true

      # ── 3. iOS Simulator Test Pass (REAL lane, headless xcodebuild) ───────
      # With the framework staged, the 28 #if canImport(streamifyFFI)
      # tests in EngineTests/UniFFIContractTests.swift execute for the
      # first time (SWIFT_MIGRATION_PLAN Gate 2). No -quiet:
      # assertion-level failure messages are the primary debugging surface.
      - name: Cache DerivedData & SwiftPM (resp7 risk register)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('iosApp/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Discover an available iOS Simulator
        run: |
          SIM_NAME="$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = [d["name"] for v in devices.values() for d in v if d.get("isAvailable")]
          iphones = [n for n in names if "iPhone" in n]
          print(iphones[0] if iphones else (names[0] if names else ""))
          ')"
          if [ -z "$SIM_NAME" ]; then
            echo "FATAL: no available iOS Simulator on this runner" >&2
            exit 1
          fi
          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run StreamifyIOSTests (real engine lane, IOS-02)
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild test \
            -scheme StreamifyIOS \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            2>&1 | tee xcodebuild-test.log
          # Gate-2 proof: the UniFFI contract suite must have EXECUTED,
          # not compiled out (a silently unlinked real lane is the exact
          # regression TRUTH-01 exists to kill). Fork-advisory runs
          # (no framework staged) keep the preview lane and skip this.
          if [ "${REAL_LANE_STAGED:-0}" = "1" ] && ! grep -q "UniFFIContractTests" xcodebuild-test.log; then
            echo "::error::UniFFIContractTests never ran — the real engine lane did not link (IOS-02 regression)" >&2
            exit 1
          fi

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-log
          path: iosApp/xcodebuild-test.log
          if-no-files-found: ignore

      # ── 3c. WS-B B5 gate: the CHECKED-IN host app target builds from a
      # fresh clone (a real .app + the widget extension, linking the staged
      # real engine lane through the package). No codesign on the sim lane.
      - name: "WS-B B5 gate: host app target builds via xcodebuild"
        run: |
          set -o pipefail
          cd iosApp
          # ARCHS=arm64: the fast-PR lane builds the xcframework's
          # simulator slice arm64-only (STREAMIFY_IOS_SKIP_X86_SIM=1 — the
          # Intel sim std left the Rust distribution); a generic sim
          # destination would otherwise also link x86_64 against a slice
          # the package does not carry.
          xcodebuild build \
            -project App/Streamify.xcodeproj \
            -scheme Streamify \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-app-build.log | tail -40
          # The widget extension must be embedded in the produced app.
          APP_PATH="$(xcodebuild -project App/Streamify.xcodeproj -scheme Streamify -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -showBuildSettings 2>/dev/null | sed -n 's/^ *TARGET_BUILD_DIR = //p' | head -1)"
          echo "TARGET_BUILD_DIR: ${APP_PATH}"
          test -d "${APP_PATH}/Streamify.app/PlugIns/StreamifyWidgets.appex" \
            || { echo "::error::widget extension not embedded in Streamify.app"; exit 1; }
          echo "OK: installable app with embedded widget extension at ${APP_PATH}/Streamify.app"

      - name: Upload app build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-build-log
          path: iosApp/xcodebuild-app-build.log
          if-no-files-found: ignore

      # ── 3b. SPM Compile Gate (macOS host) — SW-ENG1-01 acceptance ─────────
      # Compiles the universal package (now WITH the linked real lane) +
      # the universal test target on the macOS host.
      - name: SPM compile gate (macOS host, SW-ENG1-01)
        run: swift build --package-path iosApp --build-tests

      # ── 4. BUILD-ONCE / FAN-OUT: macOS desktop cdylib for the JNA lane ───
      - name: Build macOS desktop cdylib (release, stripped)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --lib --target aarch64-apple-darwin
          mkdir -p dist/desktop/macos
          cp rust/target/aarch64-apple-darwin/release/libstreamify_core_rs.dylib dist/desktop/macos/libstreamify_core_rs.dylib
          strip -x dist/desktop/macos/libstreamify_core_rs.dylib

      - name: Upload macOS engine cdylib
        uses: actions/upload-artifact@v7
        with:
          name: engine-macos
          path: dist/desktop/macos/libstreamify_core_rs.dylib
          if-no-files-found: error
          compression-level: 1

      # ── 5. macOS Desktop Test Suite (CMP UI shell + shared desktopTest + JNA smoke) ──
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: "Desktop test suite (macOS CMP UI shell + shared desktopTest + JNA smoke)"
        env:
          PREBUILT_ENGINE: ${{ format('{0}/dist/desktop/macos/libstreamify_core_rs.dylib', github.workspace) }}
        run: |
          chmod +x gradlew
          ./gradlew :desktop:test :shared:desktopTest \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace

      # ── 6. macOS Packaging (jpackage DMG, gated) ──────────────────────────
      - name: "Package desktop distribution (macOS DMG)"
        if: ${{ inputs.package_installers }}
        env:
          PREBUILT_ENGINE: ${{ format('{0}/dist/desktop/macos/libstreamify_core_rs.dylib', github.workspace) }}
        run: |
          chmod +x gradlew
          ./gradlew :desktop:packageDistributionForCurrentOS \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache --stacktrace
          ./gradlew :desktop:verifyDesktopSizeBudget \
            -Pstreamify.prebuiltEngineLib="${PREBUILT_ENGINE}" \
            --parallel --build-cache --configuration-cache

      - name: Upload macOS desktop installer
        if: ${{ inputs.package_installers }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-macos
          path: desktop/build/compose/binaries/**/*.dmg
          if-no-files-found: error

      - name: Upload Swift bindings (debug aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-swift-bindings
          path: dist/ios/swift/
          if-no-files-found: ignore
