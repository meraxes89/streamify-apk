# ============================================================================
# _ci-engine.yml — Tier 2 reusable spoke: the sovereign Rust core & C++ DSP.
# (resp6.md §2/§3 — hub-and-spoke, build-once / fan-out.)
#
# Callable ONLY via workflow_call, from:
#   * ci.yml                    (PR / merge_group / push-main hub)
#   * nightly-deep-matrix.yml   (nextest_profile: nightly — chaos suite)
#   * release.yml               (tests-before-release, audit #44 continuity)
#
# Jobs extracted from the retired extreme-test-matrix.yml:
#   rust-core            cargo nextest over the whole workspace (--all-targets):
#                        Adversarial VirtualHAL test double, golden-vector
#                        suites (jam + audio), every integration suite.
#   cpp-sanitizers       the C++20 ASan/UBSan matrix (DSP, SIMD physics,
#                        telemetry/storage) under eatmydata + tmpfs scratch.
#   android-native       BUILD-ONCE / FAN-OUT factory: cargo-ndk + CMake/NDK
#                        for arm64-v8a + x86_64, uploaded once (resp6 §3) so
#                        the Gradle shards never rebuild Rust from scratch.
#   linux-desktop-native the x86_64-unknown-linux-gnu cdylib consumed by the
#                        Linux leg of _ci-desktop.yml through the
#                        -Pstreamify.prebuiltEngineLib Gradle seam.
#
# The beta ABI scope is arm64-v8a + x86_64 (the directive's matrix): 32-bit
# armeabi-v7a/x86 ship no modern device class and burned two extra NDK
# shards per PR in the retired monolith.
# ============================================================================
name: CI Engine (Rust Core & C++ DSP)

on:
  workflow_call:
    inputs:
      run_tests:
        description: Run the Rust nextest suite + C++ ASan/UBSan matrix.
        type: boolean
        default: true
      build_android_native:
        description: Cross-compile the arm64-v8a + x86_64 jniLibs artifacts.
        type: boolean
        default: true
      build_linux_native:
        description: Cross-compile the Linux desktop JNA cdylib artifact.
        type: boolean
        default: true
      nextest_profile:
        description: "nextest profile from rust/.config/nextest.toml: ci (PR fast path, chaos suite excluded) or nightly (deep matrix)."
        type: string
        default: ci

permissions:
  contents: read

jobs:
  # ── Rust core: unit + integration suite (VirtualHAL double, golden vectors) ──
  rust-core:
    name: "Rust core: nextest (${{ inputs.nextest_profile }} ${{ matrix.partition }}/2)"
    if: inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-Clink-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache (target and dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "engine-nextest"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # GOV-04: the ci profile excludes the 32-peer mesh chaos suite (the
      # documented flake lane); the nightly profile runs it serialized in the
      # serial-heavy-mesh test group. --all-targets keeps examples compiled.
      # resp7 Pillar 2: 2-way hash partition gives statistically balanced shards.
      - name: Run workspace test suite (VirtualHAL double, golden vectors, all integration suites)
        run: |
          cargo nextest run \
            --manifest-path rust/Cargo.toml \
            --config-file rust/.config/nextest.toml \
            --profile "${{ inputs.nextest_profile }}" \
            --workspace --all-targets \
            --partition "hash:${{ matrix.partition }}/2" \
            --verbose

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-rust-core-log-${{ matrix.partition }}
          path: rust/target/nextest/**/*.xml
          if-no-files-found: ignore

  # ── C++ DSP: ASan/UBSan matrix (clang-17, ccache, eatmydata on tmpfs) ───────
  cpp-sanitizers:
    name: "C++ ASan/UBSan: ${{ matrix.shard }}"
    if: inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: native-dsp
            description: "KissFFT 2048 STFT, Krumhansl Key, Ellis BPM & EBU R128 LUFS"
            target: dsp_test_suite
          - shard: native-simd-physics
            description: "128-D ARM NEON VectorStore & RK4 AirDrop ODE Solver"
            target: simd_physics_test_suite
          - shard: native-telemetry-storage
            description: "Lock-Free SPSC Buffer, SHA-256 Proof-of-Compute & SQLite WAL"
            target: storage_telemetry_test_suite
    env:
      ASAN_OPTIONS: "fast_unwind_on_malloc=1:detect_leaks=1:halt_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      TMPDIR: /dev/shm/native_test_tmp
      TMP: /dev/shm/native_test_tmp
      TEMP: /dev/shm/native_test_tmp
    steps:
      - uses: actions/checkout@v7

      - name: Set up Clang 17 & build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 cmake ninja-build libstdc++-13-dev ccache eatmydata
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-17 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 100

      - name: Setup CCache for native shards
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-ccache-native-asan
          restore-keys: |
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Build & execute under ASan/UBSan (eatmydata, tmpfs scratch)
        run: |
          mkdir -p /dev/shm/native_test_tmp
          sudo mount -t tmpfs -o size=3G tmpfs /tmp || true
          mkdir -p native/build && cd native/build
          cmake -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O2 -g" \
                -DSTREAMIFY_BUILD_TESTS=ON \
                -G Ninja ..
          ninja ${{ matrix.target }}
          cp -a ${{ matrix.target }} /dev/shm/native_test_tmp/
          cd /dev/shm/native_test_tmp
          eatmydata ./${{ matrix.target }}

  # ── BUILD-ONCE / FAN-OUT: Android NDK artifacts for the Gradle shards ──────
  android-native:
    name: "Android NDK artifact (${{ matrix.abi }})"
    if: inputs.build_android_native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: x86_64
            rust_target: x86_64-linux-android
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "native-android-${{ matrix.abi }}"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup CCache for the C++ DSP
        uses: hendrikmuhs/ccache-action@v1.2.24
        continue-on-error: true
        with:
          key: ${{ runner.os }}-ccache-native-abi-${{ matrix.abi }}
          restore-keys: |
            ${{ runner.os }}-ccache-native-abi-
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Set up Rust toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-ndk
        run: |
          rustup target add ${{ matrix.rust_target }}
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-ndk

      # Direct cargo-ndk + CMake/Ninja: zero Gradle daemon startup tax.
      - name: Cross-compile Rust + C++ DSP for ${{ matrix.abi }}
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/out-jniLibs"
          mkdir -p "$OUT_DIR/${{ matrix.abi }}"

          # 1. Rust cdylib via cargo-ndk inside the rust/ workspace root.
          pushd rust
          cargo ndk -t ${{ matrix.abi }} -o "$OUT_DIR" build --release
          popd

          # 2. C++ DSP .so via CMake + Ninja against the NDK toolchain.
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/26.1.10909125}"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | head -n 1)
          fi
          echo "Using Android NDK at: $NDK_PATH"

          cmake -B build-android-${{ matrix.abi }} -G Ninja \
            -S native \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g0" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g0" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--strip-debug"
          ninja -C build-android-${{ matrix.abi }} -j "$(nproc)"

          # 3. Stage the C++ .so alongside the Rust .so.
          find build-android-${{ matrix.abi }} -name "*.so" -exec cp -vf {} "$OUT_DIR/${{ matrix.abi }}/" \;
          ls -la "$OUT_DIR/${{ matrix.abi }}/"

      - name: Upload jniLibs bundle (${{ matrix.abi }})
        uses: actions/upload-artifact@v7
        with:
          name: jniLibs-${{ matrix.abi }}
          path: out-jniLibs/${{ matrix.abi }}/*.so
          if-no-files-found: error
          compression-level: 1

  # ── BUILD-ONCE / FAN-OUT: Linux desktop cdylib for the JNA lane ────────────
  linux-desktop-native:
    name: "Linux desktop cdylib (x86_64-unknown-linux-gnu)"
    if: inputs.build_linux_native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "native-linux-x86_64"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Deliberately identical to the desktop Gradle lane's
      # `cargo build --release --lib` (no extra RUSTFLAGS, release profile
      # strips) so the prebuilt is byte-equivalent to a local build.
      - name: Cross-compile the engine cdylib (release, stripped)
        run: cargo build --manifest-path rust/Cargo.toml --release --lib --target x86_64-unknown-linux-gnu

      - name: Upload engine cdylib
        uses: actions/upload-artifact@v7
        with:
          name: engine-linux-x86_64
          path: rust/target/x86_64-unknown-linux-gnu/release/libstreamify_core_rs.so
          if-no-files-found: error
          compression-level: 1
