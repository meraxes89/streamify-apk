# ============================================================================
# _ci-engine.yml — Tier 2 reusable spoke: the sovereign Rust core & C++ DSP.
# (resp6.md §2/§3 — hub-and-spoke, build-once / fan-out.)
#
# Callable ONLY via workflow_call, from:
#   * ci.yml                    (PR / merge_group / push-main hub)
#   * nightly-deep-matrix.yml   (nextest_profile: nightly — chaos suite)
#   * release.yml               (tests-before-release, audit #44 continuity)
#
# Jobs extracted from the retired extreme-test-matrix.yml:
#   rust-core            cargo nextest over the whole workspace (--all-targets):
#                        Adversarial VirtualHAL test double, golden-vector
#                        suites (jam + audio), every integration suite.
#   cpp-sanitizers       the C++20 ASan/UBSan matrix (DSP, SIMD physics,
#                        telemetry/storage) under eatmydata + tmpfs scratch.
#                        WS-C (C3): the 7 previously CI-dead native suites
#                        are switched ON — virtual_hal_test_suite,
#                        desktop_hal_render_core_test_suite,
#                        dsp_phase_lock_test_suite,
#                        capability_abi_parity_test_suite,
#                        test_audio_sink_ringbuffer,
#                        coreaudio_render_core_test_suite,
#                        linux_hal_driver_test_suite (ALSA null PCM — no
#                        hardware needed) — ~4,000 LOC of written-but-never-
#                        executed verification now gates every core PR. WS-C
#                        adds the two new lanes: jni_sink_bridge_test_suite
#                        (C1: the frozen JNI sink contract through a stub
#                        JNIEnv) and lufs_parity_test_suite (C8: the C++
#                        BS.1770-4 path vs the canonical Rust vectors).
#   android-native       BUILD-ONCE / FAN-OUT factory: cargo-ndk + CMake/NDK
#                        for arm64-v8a + x86_64, uploaded once (resp6 §3) so
#                        the Gradle shards never rebuild Rust from scratch.
#                        WS-C (C1): the .so now carries the 7-symbol JNI sink
#                        bridge (jni_bridge_audio_sinks.cpp).
#   windows-native       WS-C (C4): the MSVC rot guard — the native tree
#                        (WASAPI adapter + the C5 desktop HAL library)
#                        compiled with Visual Studio on every core PR; the
#                        if(WIN32) targets finally fire somewhere.
#   linux-desktop-native the x86_64-unknown-linux-gnu cdylib consumed by the
#                        Linux leg of _ci-desktop.yml through the
#                        -Pstreamify.prebuiltEngineLib Gradle seam.
#
# The beta ABI scope is arm64-v8a + x86_64 (the directive's matrix): 32-bit
# armeabi-v7a/x86 ship no modern device class and burned two extra NDK
# shards per PR in the retired monolith.
# ============================================================================
name: CI Engine (Rust Core & C++ DSP)

on:
  workflow_call:
    inputs:
      run_tests:
        description: Run the Rust nextest suite + C++ ASan/UBSan matrix.
        type: boolean
        default: true
      build_android_native:
        description: Cross-compile the arm64-v8a + x86_64 jniLibs artifacts.
        type: boolean
        default: true
      build_desktop_native:
        description: Cross-compile desktop JNA cdylib artifacts (Linux, Windows, macOS).
        type: boolean
        default: true
      build_linux_native:
        description: Cross-compile the Linux desktop JNA cdylib artifact (backward compatibility).
        type: boolean
        default: true
      nextest_profile:
        description: "nextest profile from rust/.config/nextest.toml: ci (PR fast path, chaos suite excluded) or nightly (deep matrix)."
        type: string
        default: ci

permissions:
  contents: read

jobs:
  # ── Rust core: unit + integration suite (VirtualHAL double, golden vectors) ──
  rust-core:
    name: "Nextest (${{ inputs.nextest_profile }} ${{ matrix.partition }}/2)"
    if: inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_SERVER_START_TIMEOUT: "60"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-Clink-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache (target and dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "engine-nextest"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache server daemon
        run: sccache --start-server || true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # GOV-04: the ci profile excludes the 32-peer mesh chaos suite (the
      # documented flake lane); the nightly profile runs it serialized in the
      # serial-heavy-mesh test group. --all-targets keeps examples compiled.
      # resp7 Pillar 2: 2-way hash partition gives statistically balanced shards.
      - name: Run workspace test suite (VirtualHAL double, golden vectors, all integration suites)
        run: |
          cargo nextest run \
            --manifest-path rust/Cargo.toml \
            --config-file rust/.config/nextest.toml \
            --profile "${{ inputs.nextest_profile }}" \
            --workspace --all-targets \
            --partition "hash:${{ matrix.partition }}/2" \
            --verbose

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-rust-core-log-${{ matrix.partition }}
          path: rust/target/nextest/**/*.xml
          if-no-files-found: ignore

  # ── WS-D D2: the offline embedding producer's execution benchmark ──────────
  # The directive's budget: <= 200 ms per 30 s reference clip on a
  # mid-range 2020 phone CPU. CI hosts are server cores ~3x faster on
  # scalar f64 DSP than that device class, so the lane asserts a 65 ms
  # median on the runner (65 x 3.1 ~= 200 ms on the phone, ~35%
  # regression headroom over the observed ~48 ms median — the full
  # derivation lives in rust/crates/streamify-audio/examples/embedding_bench.rs).
  embedding-bench:
    name: "Embedding Benchmark"
    if: inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "engine-nextest"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache server daemon
        run: sccache --start-server || true

      - name: Run the embedding benchmark (median-of-21, release)
        run: |
          cargo run --release --manifest-path rust/Cargo.toml \
            -p streamify-audio --example embedding_bench

  # ── C++ DSP: ASan/UBSan consolidated suite (clang-17, ccache, eatmydata on tmpfs) ─────
  # WS-C (C3): Full native verification surface (12 test suites) running in parallel
  # on a single runner under CTest, reducing 12 separate VM allocations to 1 fast runner.
  cpp-sanitizers:
    name: "Sanitizers"
    if: inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: "fast_unwind_on_malloc=1:detect_leaks=1:halt_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      TMPDIR: /dev/shm/native_test_tmp
      TMP: /dev/shm/native_test_tmp
      TEMP: /dev/shm/native_test_tmp
    steps:
      - uses: actions/checkout@v7

      - name: Set up Clang & build tools (DNS-flake resilient)
        run: |
          DNS_OK=1
          if ! timeout 15 getent hosts azure.archive.ubuntu.com >/dev/null 2>&1; then
            DNS_OK=0
            echo "::warning::runner DNS resolution is down — apt skipped; the image's preinstalled toolchain carries the shard"
          fi

          # Bounded retries: `timeout` caps apt's own retry storm, our loop
          # adds two more shots with backoff. Worst case ~9 min, never 17+.
          apt_install() {
            if [ "$DNS_OK" -ne 1 ]; then return 1; fi
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get install -y -o Acquire::Retries=2 "$@"; then
                return 0
              fi
              echo "apt install (attempt ${attempt}/3) failed — runner network flake? retrying after backoff"
              sudo timeout 120 apt-get update -o Acquire::Retries=2 >/dev/null 2>&1 || true
              sleep $((attempt * 10))
            done
            return 1
          }

          if [ "$DNS_OK" -eq 1 ]; then
            sudo timeout 180 apt-get update -o Acquire::Retries=2 \
              || echo "::warning::apt-get update failed — trying installs anyway (cached indexes)"
          fi

          SANI_CC=""; SANI_CXX=""
          if apt_install clang-17 libstdc++-13-dev \
             && command -v clang-17 >/dev/null 2>&1; then
            SANI_CC="$(command -v clang-17)"
            SANI_CXX="$(command -v clang++-17)"
          else
            for v in 22 21 20 19 18; do
              if command -v clang-$v >/dev/null 2>&1 && command -v clang++-$v >/dev/null 2>&1; then
                SANI_CC="$(command -v clang-$v)"
                SANI_CXX="$(command -v clang++-$v)"
                echo "::warning::clang-17 unavailable (apt flake) — running the shard on the image's clang-$v"
                break
              fi
            done
          fi
          if [ -z "$SANI_CC" ] || [ -z "$SANI_CXX" ]; then
            echo "::error::No usable clang on the runner (apt failed AND no preinstalled clang) — cannot run the sanitizer lane."
            exit 1
          fi
          echo "Sanitizer toolchain: $SANI_CXX ($($SANI_CXX --version | head -n1))"

          # eatmydata is an fsync suppressor — a large speed multiplier
          apt_install eatmydata \
            || echo "::warning::eatmydata unavailable — suites run without it"

          # ccache: compiler launcher cache
          apt_install ccache \
            || echo "::warning::ccache unavailable — building without the compile cache"

          # PipeWire dev packages for linux_hal_driver_test_suite ABI cross-check
          apt_install libpipewire-0.3-dev libspa-0.2-dev \
            || echo "::warning::PipeWire dev headers unavailable — frozen-ABI cross-check degrades to the embedded reference"

          echo "SANI_CC=$SANI_CC"   >> "$GITHUB_ENV"
          echo "SANI_CXX=$SANI_CXX" >> "$GITHUB_ENV"

      - name: Setup CCache for native sanitizers
        uses: hendrikmuhs/ccache-action@v1.2.25
        continue-on-error: true
        with:
          key: ${{ runner.os }}-ccache-native-asan
          restore-keys: |
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Build & execute all C++ suites under ASan/UBSan (parallel ctest)
        run: |
          mkdir -p /dev/shm/native_test_tmp
          sudo mount -t tmpfs -o size=3G tmpfs /tmp || true
          mkdir -p native/build && cd native/build
          CCACHE_ARGS=""
          if command -v ccache >/dev/null 2>&1; then
            CCACHE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          else
            echo "::warning::ccache unavailable — building without the compile cache"
          fi
          # shellcheck disable=SC2086
          cmake -DCMAKE_CXX_COMPILER="$SANI_CXX" \
                -DCMAKE_C_COMPILER="$SANI_CC" \
                $CCACHE_ARGS \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O2 -g" \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O2 -g" \
                -DSTREAMIFY_BUILD_TESTS=ON \
                -DENABLE_ASAN=ON \
                -G Ninja ..
          ninja
          if command -v eatmydata >/dev/null 2>&1; then
            eatmydata ctest --output-on-failure --parallel "$(nproc)"
          else
            ctest --output-on-failure --parallel "$(nproc)"
          fi

  # ── WS-C (C4): the Windows native C++ rot guard (MSVC) ────────────────────
  # The WASAPI adapter's if(WIN32) target never fired anywhere before this
  # lane existed (no Windows native CMake configure ever ran), so SDK/MSVC
  # rot could land silently between releases. Every core-touching PR now
  # compiles the native tree with the image's CURRENT Visual Studio: the
  # configure step deliberately does NOT pin -G "Visual Studio 17 2022" —
  # windows-latest migrated to the windows-2025-vs2026 image (VS 2026
  # only), and a hardcoded VS 2022 generator aborts with "could not find
  # any instance of Visual Studio". CMake's default generator resolves to
  # the newest installed VS on the runner, which is exactly what a rot
  # guard should compile against. The desktop HAL shared library (the C5
  # wiring slice — sink registry C ABI + the WASAPI pull adapter) must
  # link against avrt/ole32 and the C++20 over-aligned AudioSink storage
  # must survive MSVC's allocator. The Android packaging .so stays
  # NDK-only (the CMake ANDROID guard); Apple/linux targets are skipped
  # by their own platform guards on this runner.
  windows-native:
    name: "MSVC Guard"
    if: inputs.run_tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure the native tree (host Visual Studio, x64)
        run: cmake -B native/build -S native -A x64

      - name: Compile the WASAPI adapter + desktop HAL library (Release)
        run: |
          cmake --build native/build --config Release `
            --target streamify_desktop_hal streamify_wasapi_adapter

      - name: Upload the built HAL module (rot-guard evidence)
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-hal-x86_64
          path: |
            native/build/Release/streamify_desktop_hal.dll
            native/build/Release/streamify_wasapi_adapter.lib
          if-no-files-found: error
          compression-level: 1

  # ── BUILD-ONCE / FAN-OUT: Android NDK artifacts for the Gradle shards ──────
  android-native:
    name: "NDK (${{ matrix.abi }})"
    if: inputs.build_android_native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: x86_64
            rust_target: x86_64-linux-android
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_SERVER_START_TIMEOUT: "60"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "native-android-${{ matrix.abi }}"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache server daemon
        run: sccache --start-server || true

      - name: Setup CCache for the C++ DSP
        uses: hendrikmuhs/ccache-action@v1.2.25
        continue-on-error: true
        with:
          key: ${{ runner.os }}-ccache-native-abi-${{ matrix.abi }}
          restore-keys: |
            ${{ runner.os }}-ccache-native-abi-
            ${{ runner.os }}-ccache-native-
          max-size: 500M

      - name: Set up Rust toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustup target add ${{ matrix.rust_target }}
          mkdir -p ~/.cargo/bin
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz | tar -xz --strip-components=1 -C ~/.cargo/bin || {
              curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
              cargo binstall -y cargo-ndk
            }
          fi
          cargo ndk --version

      # Direct cargo-ndk + CMake/Ninja: zero Gradle daemon startup tax.
      - name: Cross-compile Rust + C++ DSP for ${{ matrix.abi }}
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/out-jniLibs"
          mkdir -p "$OUT_DIR/${{ matrix.abi }}"

          # 1. Rust cdylib via cargo-ndk inside the rust/ workspace root.
          pushd rust
          cargo ndk -t ${{ matrix.abi }} -o "$OUT_DIR" build --release
          popd

          # 2. C++ DSP .so via CMake + Ninja against the NDK toolchain.
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/26.1.10909125}"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | head -n 1)
          fi
          echo "Using Android NDK at: $NDK_PATH"

          # ccache is a speedup, not a dependency: when its apt install
          # flaked (runner archive/DNS incidents), the old hard-wired
          # CMAKE_*_COMPILER_LAUNCHER poisoned the compiler probe with
          # exit 127. Attach the launcher only when ccache exists.
          CCACHE_ARGS=""
          if command -v ccache >/dev/null 2>&1; then
            CCACHE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          else
            echo "::warning::ccache unavailable — building without the compile cache"
          fi

          # shellcheck disable=SC2086
          cmake -B build-android-${{ matrix.abi }} -G Ninja \
            -S native \
            $CCACHE_ARGS \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -g0" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g0" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--strip-debug"
          ninja -C build-android-${{ matrix.abi }} -j "$(nproc)"

          # 3. Stage the C++ .so alongside the Rust .so.
          find build-android-${{ matrix.abi }} -name "*.so" -exec cp -vf {} "$OUT_DIR/${{ matrix.abi }}/" \;
          ls -la "$OUT_DIR/${{ matrix.abi }}/"

      - name: Upload jniLibs bundle (${{ matrix.abi }})
        uses: actions/upload-artifact@v7
        with:
          name: jniLibs-${{ matrix.abi }}
          path: out-jniLibs/${{ matrix.abi }}/*.so
          if-no-files-found: error
          compression-level: 1

  # ── BUILD-ONCE / FAN-OUT: Linux desktop cdylib for the JNA lane ────────────
  linux-desktop-native:
    name: "Linux cdylib"
    if: inputs.build_desktop_native || inputs.build_linux_native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "native-linux-x86_64"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache server daemon
        run: sccache --start-server || true

      # Deliberately identical to the desktop Gradle lane's
      # `cargo build --release --lib` (no extra RUSTFLAGS, release profile
      # strips) so the prebuilt is byte-equivalent to a local build.
      - name: Cross-compile the engine cdylib (release, stripped)
        run: cargo build --manifest-path rust/Cargo.toml --release --lib --target x86_64-unknown-linux-gnu

      - name: Upload engine cdylib
        uses: actions/upload-artifact@v7
        with:
          name: engine-linux-x86_64
          path: rust/target/x86_64-unknown-linux-gnu/release/libstreamify_core_rs.so
          if-no-files-found: error
          compression-level: 1

  # ── BUILD-ONCE / FAN-OUT: Windows desktop cdylib for the JNA lane ──────────
  windows-desktop-native:
    name: "Windows cdylib"
    if: inputs.build_desktop_native || inputs.build_linux_native
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 2026-11-12 (rustc 1.100.0 stable roll): the runner's stable jumped
      # 1.99.1 → 1.100.0 mid-day and the new rustc's longer argv overflows
      # sccache's Windows spawn — "failed to spawn rustc … The filename or
      # extension is too long. (os error 206)" on streamify-contract (main
      # was green at 10:42 with 1.99.1; the tree was identical). Cargo's own
      # @responsefile mitigation never reaches a RUSTC_WRAPPER, so sccache
      # is OFF for THIS job until sccache learns response files; the Linux
      # jobs keep it (fork/exec has no 32K argv limit). rust-cache (restored
      # from main) still covers most of the build on PR runs; a cold build
      # fits the 30-minute timeout.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "native-windows-x86_64"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile Windows engine cdylib (release, stripped)
        shell: bash
        run: cargo build --manifest-path rust/Cargo.toml --release --lib --target x86_64-pc-windows-msvc

      - name: Upload engine cdylib
        uses: actions/upload-artifact@v7
        with:
          name: engine-windows-x86_64
          path: rust/target/x86_64-pc-windows-msvc/release/streamify_core_rs.dll
          if-no-files-found: error
          compression-level: 1

  # ── BUILD-ONCE / FAN-OUT: macOS desktop cdylib for the JNA lane ────────────
  macos-desktop-native:
    name: "macOS cdylib"
    if: inputs.build_desktop_native || inputs.build_linux_native
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          shared-key: "native-macos-universal"
          key: ${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile macOS engine cdylibs & create universal binary
        shell: bash
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --lib --target aarch64-apple-darwin
          cargo build --manifest-path rust/Cargo.toml --release --lib --target x86_64-apple-darwin
          mkdir -p rust/target/universal/release
          lipo -create \
            rust/target/aarch64-apple-darwin/release/libstreamify_core_rs.dylib \
            rust/target/x86_64-apple-darwin/release/libstreamify_core_rs.dylib \
            -output rust/target/universal/release/libstreamify_core_rs.dylib

      - name: Upload engine cdylib
        uses: actions/upload-artifact@v7
        with:
          name: engine-macos-universal
          path: rust/target/universal/release/libstreamify_core_rs.dylib
          if-no-files-found: error
          compression-level: 1


