name: Resolver Client Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *" # daily; registry rot is detected before users feel it

# GOV-05 (2026-11-09): the self-heal rotation no longer force-commits to
# `main`. The `main-branch-protection` ruleset (GOV-01, active since
# 2026-10-27) rejects every direct push — the nightly canary failed four
# nights in a row (2026-10-31 .. 2026-11-03) at exactly that step. The
# rotation now lands as a REVIEWED PULL REQUEST from the evergreen
# `bot/fleet-rotation` branch: force-push moves the branch (any open
# rotation PR auto-updates), and `gh pr create` opens one when none
# exists. CODEOWNERS routes the review; the ruleset keeps `main`
# merge-gated behind the blocking CI check.
#
# The commit keeps its `[skip ci]` marker: PRs opened with GITHUB_TOKEN
# do not trigger `pull_request` workflows anyway (GitHub's token-event
# recursion guard), and a fleet rotation is a data-only change to
# fleet-config.json — the review gate is the human, not a rebuild.
permissions:
  # contents: write — create/move the bot branch.
  # pull-requests: write — open and comment on the rotation PR.
  contents: write
  pull-requests: write

# Serialize schedule/dispatch races so two probes can never interleave
# their branch pushes (the second run waits; its probe supersedes).
concurrency:
  group: resolver-canary
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ── Single pass over the bare-client × content matrix ─────────────
      # One probe run feeds the assertion, the licensed verdict AND the
      # fleet rotation. (The pre-2026-11 canary probed the same matrix up
      # to three times per run — triple the wall-clock and three times the
      # bot-wall exposure for zero extra signal.)
      - name: Probe bare-client × content matrix (single pass)
        run: |
          bash tools/probe-clients.sh dQw4w9WgXcQ 4NRXx6U8ABQ | tee /tmp/probe.txt
          {
            echo "### 🔭 Resolver Client Canary — probe matrix"
            echo '```'
            cat /tmp/probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── G4 direct-lane canary: CORS posture + googleapis surface ──────
      # The G4 resolver rides the phone's own IP through the three surfaces
      # YouTube serves cross-origin: youtubei.googleapis.com (innertube),
      # jnn-pa.googleapis.com (WAA mint), *.googlevideo.com (media/SABR).
      # jnn-pa is verified CORS-open to foreign origins (2026-11-14,
      # preflight reflects the caller's origin + the exact bgutils header
      # set). youtubei.googleapis.com's posture for foreign origins is the
      # load-bearing unknown the sandbox cannot measure (its lab IP is
      # blocked at that host) — this step measures it nightly from a clean
      # runner IP. NON-GATING by design: a posture change is environmental
      # (YouTube's choice, not registry rot) and the app already degrades
      # per-request onto the relay; the point is DETECTION and evidence.
      - name: G4 direct-lane canary (CORS posture, googleapis surface)
        run: |
          set -u
          GAPI='https://youtubei.googleapis.com/youtubei/v1/player?key=AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8&prettyPrint=false'
          ORIGIN='https://meraxes89.github.io'
          {
            echo "### 🛰️ G4 direct-lane canary"
            echo
            echo "#### youtubei.googleapis.com CORS preflight (foreign origin)"
            echo '```'
            curl -sS -i -X OPTIONS "$GAPI" \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,x-goog-visitor-id,x-youtube-client-name,x-youtube-client-version' \
              --max-time 20 | tr -d '\r' | sed -n '1,20p'
            echo '```'
          } | tee /tmp/g4-cors.txt >> "$GITHUB_STEP_SUMMARY"

          # The real question, in one line: does the preflight answer ACAO?
          if grep -qi 'access-control-allow-origin' /tmp/g4-cors.txt; then
            echo "::notice::youtubei.googleapis.com serves CORS preflight to foreign origins — the direct rungs are browser-viable."
          else
            echo "::warning::youtubei.googleapis.com preflight carries NO access-control-allow-origin for a foreign origin — the direct rungs will relay-fallback (degraded egress) in every browser. The G4 ladder survives via the relay, but licensed content loses the phone-egress advantage."
          fi

          # Licensed verdicts on the googleapis surface (IOS + VISIONOS, the
          # G4 rungs 1-3 clients) — the probe-matrix twin, on the surface the
          # phone actually calls. DOGP2dYUGE0 = the phone-reported failure.
          # NOTE: each jq assignment is failure-guarded — a non-JSON body
          # (an HTML error page answers some IP blocks) must degrade the
          # row to PARSE-ERR, not kill the step (the first canary run died
          # exactly there: bash -e + a command substitution's exit status).
          jqf() { jq -r "$1" 2>/dev/null <<<"$2" || printf 'PARSE-ERR'; }
          {
            echo
            echo "#### googleapis surface — playability (runner IP, informational)"
            echo '```'
            for SPEC in 'IOS|5|IOS|21.26.4' 'VISIONOS|101|VISIONOS|1.02'; do
              IFS='|' read -r NAME NUM CNAME CVER <<<"$SPEC"
              for VID in dQw4w9WgXcQ DOGP2dYUGE0; do
                BODY=$(jq -nc --arg cname "$CNAME" --arg cver "$CVER" --arg vid "$VID" \
                  '{context:{client:{clientName:$cname,clientVersion:$cver,hl:"en",gl:"US"}},videoId:$vid,contentCheckOk:true,racyCheckOk:true}')
                RESP=$(curl -sS --max-time 20 "$GAPI" \
                  -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
                  -H "X-YouTube-Client-Name: $NUM" -H "X-YouTube-Client-Version: $CVER" \
                  --data "$BODY") || RESP=''
                STATUS=$(jqf '.playabilityStatus.status // "NO-RESPONSE"' "$RESP")
                FMTS=$(jqf '[.streamingData.adaptiveFormats[]?] | length' "$RESP")
                SABR=$(jqf '.streamingData.serverAbrStreamingUrl != null' "$RESP")
                HEAD=$(curl -sS -o /dev/null -D - -X POST "$GAPI" \
                  -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
                  -H "X-YouTube-Client-Name: $NUM" -H "X-YouTube-Client-Version: $CVER" \
                  --data "$BODY" --max-time 20 || true)
                ACAO=$(printf '%s' "$HEAD" | tr -d '\r' | awk 'tolower($1)=="access-control-allow-origin:" {sub(/^[^:]*:[ ]*/,""); print; exit}')
                HTTPCODE=$(printf '%s' "$HEAD" | awk 'NR==1 {print $2}')
                RAW="$(printf '%s' "$RESP" | head -c 60 | tr '\n' ' ')"
                printf '%-10s %-13s %-16s http=%-4s fmts=%-3s sabr=%-5s acao=%s\n' \
                  "$NAME" "$VID" "${STATUS:0:16}" "${HTTPCODE:-?}" "${FMTS:0:3}" "$SABR" "${ACAO:-none}"
                [ "${STATUS:-}" != 'PARSE-ERR' ] || printf '  raw: %s\n' "$RAW"
                sleep 2
              done
            done
            echo '```'
          } | tee /tmp/g4-surface.txt >> "$GITHUB_STEP_SUMMARY"

      # ── GATING: standard content, fleet ladder only ───────────────────
      # A fleet-ladder client (ANDROID / ANDROID_VR / IOS — exactly the
      # specs write_fleet_config.py can rotate to) must still resolve
      # STANDARD content with audio formats. If none does, the registry
      # is rotten in a way self-heal cannot fix → red, human required.
      - name: Assert standard-content survivors exist (fleet ladder)
        run: |
          LADDER='^(ANDROID|VR_1\.60\.19|IOS)$'
          if ! awk -v re="$LADDER" '$1 ~ re && $2=="dQw4w9WgXcQ" && $3=="OK" && $4 ~ /^[1-9]/' /tmp/probe.txt | grep -q .; then
            echo "::error::No fleet-ladder client resolves standard content — resolver registry is rotten and cannot self-heal. Manual rotation required."
            exit 1
          fi
          echo "Fleet ladder healthy on standard content:"
          awk -v re="$LADDER" '$1 ~ re && $2=="dQw4w9WgXcQ" && $3=="OK" && $4 ~ /^[1-9]/' /tmp/probe.txt

      # ── NON-GATING: licensed content (bot-wall aware) ──────────────────
      # GitHub-hosted runners sit in Azure datacenter IP ranges that
      # YouTube bot-walls for licensed/official content REGARDLESS of
      # client fingerprint: residential probes pass while identical CI
      # probes get LOGIN_REQUIRED "Sign in to confirm you're not a bot"
      # (observed fleet-wide since 2026-10-18). No fleet rotation can fix
      # an IP-reputation wall, so the licensed probe is INFORMATIONAL:
      # verdict recorded per-client into fleet-config.json (licensedProbe)
      # and annotated here, but it must not fail the canary. This mirrors
      # the advisory policy the Extreme Matrix already applies to its
      # Gatekeeper probe. A licensed regression that IS client-side rot
      # still surfaces first as standard-content rot, which gates above.
      - name: Record licensed-content verdict (bot-wall aware, non-gating)
        run: |
          LADDER='^(ANDROID|VR_1\.60\.19|IOS)$'
          OK=$(awk -v re="$LADDER" '$1 ~ re && $2=="4NRXx6U8ABQ" && $3=="OK" && $4 ~ /^[1-9]/' /tmp/probe.txt | wc -l)
          GATED=$(awk -v re="$LADDER" '$1 ~ re && $2=="4NRXx6U8ABQ" && $3=="LOGIN_REQUIRED"' /tmp/probe.txt | wc -l)
          echo "licensed ladder results: ${OK} OK, ${GATED} login-gated"
          if [ "$OK" -gt 0 ]; then
            echo "licensed=ok" >> "$GITHUB_ENV"
            echo "::notice::Licensed content resolves on ${OK} ladder client(s) — fully healthy."
          elif [ "$GATED" -gt 0 ]; then
            echo "licensed=bot-gated" >> "$GITHUB_ENV"
            echo "::warning::Licensed content LOGIN_REQUIRED on all ${GATED} ladder clients — datacenter-IP bot wall (environmental, not registry rot). Recorded as degraded; rotation proceeds on standard-content health."
            echo "⚠️ Licensed probe degraded: datacenter-IP bot wall (environmental, not registry rot)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "licensed=degraded" >> "$GITHUB_ENV"
            echo "::warning::Licensed content unresolvable on the ladder for non-bot-wall reasons — watch for user reports; rotation still proceeds on standard-content health."
            echo "⚠️ Licensed probe degraded (non-bot-wall reasons) — watch for user reports." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🔄 Self-heal — compute winning fleet into fleet-config.json
        run: |
          python3 tools/write_fleet_config.py /tmp/probe.txt fleet-config.json
          cat fleet-config.json

      # ── GOV-05: rotation lands as a REVIEWED PR, not a direct push ──────
      # Evergreen branch `bot/fleet-rotation`: a force-push moves it (any
      # open rotation PR auto-updates in place); a fresh PR is opened only
      # when none exists. Unchanged config → no branch movement, no PR.
      - name: "Open rotation PR (evergreen bot/fleet-rotation branch)"
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain fleet-config.json)" ]]; then
            echo "fleet-config.json unchanged — fleet healthy, nothing to rotate."
            exit 0
          fi

          DATE=$(date -u +%F)
          {
            echo "### 🔄 Resolver fleet rotation (${DATE})"
            echo
            echo "Nightly canary probe (bare-client × content matrix) found a healthier client ladder. The winning fleet is written into \`fleet-config.json\` and shipped to live apps once this PR merges — no release needed."
            echo
            echo "#### Probe matrix"
            echo '```'
            cat /tmp/probe.txt
            echo '```'
            echo
            echo "- licensed verdict: \`${licensed:-unknown}\` (bot-wall aware, non-gating)"
            echo "- data-only change: \`fleet-config.json\` — carries \`[skip ci]\` by design (GOV-05 note in resolver-canary.yml)."
            echo "- review: routed by CODEOWNERS; \`main\` stays behind the blocking CI gate."
          } > /tmp/rotation_pr_body.md

          git checkout -B bot/fleet-rotation
          git add fleet-config.json
          git commit -m "ci(fleet): rotate client fleet from canary probe [skip ci]"
          git push --force origin HEAD:refs/heads/bot/fleet-rotation

          PR_NUM=$(gh pr list --head bot/fleet-rotation --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "${PR_NUM}" ]]; then
            echo "Open rotation PR #${PR_NUM} found — branch force-push already updated it; annotating with tonight's probe."
            gh pr comment "${PR_NUM}" --body-file /tmp/rotation_pr_body.md
          else
            gh pr create \
              --head bot/fleet-rotation \
              --base "${BASE_BRANCH}" \
              --title "ci(fleet): rotate resolver client fleet (${DATE})" \
              --body-file /tmp/rotation_pr_body.md
          fi
