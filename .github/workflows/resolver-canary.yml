name: Resolver Client Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *" # daily; registry rot is detected before users feel it

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ── Single pass over the bare-client × content matrix ─────────────
      # One probe run feeds the assertion, the licensed verdict AND the
      # fleet rotation. (The pre-2026-11 canary probed the same matrix up
      # to three times per run — triple the wall-clock and three times the
      # bot-wall exposure for zero extra signal.)
      - name: Probe bare-client × content matrix (single pass)
        run: |
          bash tools/probe-clients.sh dQw4w9WgXcQ 4NRXx6U8ABQ | tee /tmp/probe.txt
          {
            echo "### 🔭 Resolver Client Canary — probe matrix"
            echo '```'
            cat /tmp/probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── GATING: standard content, fleet ladder only ───────────────────
      # A fleet-ladder client (ANDROID / ANDROID_VR / IOS — exactly the
      # specs write_fleet_config.py can rotate to) must still resolve
      # STANDARD content with audio formats. If none does, the registry
      # is rotten in a way self-heal cannot fix → red, human required.
      - name: Assert standard-content survivors exist (fleet ladder)
        run: |
          LADDER='^(ANDROID|VR_1\.60\.19|IOS)$'
          if ! awk -v re="$LADDER" '$1 ~ re && $2=="dQw4w9WgXcQ" && $3=="OK" && $4 ~ /^[1-9]/' /tmp/probe.txt | grep -q .; then
            echo "::error::No fleet-ladder client resolves standard content — resolver registry is rotten and cannot self-heal. Manual rotation required."
            exit 1
          fi
          echo "Fleet ladder healthy on standard content:"
          awk -v re="$LADDER" '$1 ~ re && $2=="dQw4w9WgXcQ" && $3=="OK" && $4 ~ /^[1-9]/' /tmp/probe.txt

      # ── NON-GATING: licensed content (bot-wall aware) ──────────────────
      # GitHub-hosted runners sit in Azure datacenter IP ranges that
      # YouTube bot-walls for licensed/official content REGARDLESS of
      # client fingerprint: residential probes pass while identical CI
      # probes get LOGIN_REQUIRED "Sign in to confirm you're not a bot"
      # (observed fleet-wide since 2026-10-18). No fleet rotation can fix
      # an IP-reputation wall, so the licensed probe is INFORMATIONAL:
      # verdict recorded per-client into fleet-config.json (licensedProbe)
      # and annotated here, but it must not fail the canary. This mirrors
      # the advisory policy the Extreme Matrix already applies to its
      # Gatekeeper probe. A licensed regression that IS client-side rot
      # still surfaces first as standard-content rot, which gates above.
      - name: Record licensed-content verdict (bot-wall aware, non-gating)
        run: |
          LADDER='^(ANDROID|VR_1\.60\.19|IOS)$'
          OK=$(awk -v re="$LADDER" '$1 ~ re && $2=="4NRXx6U8ABQ" && $3=="OK" && $4 ~ /^[1-9]/' /tmp/probe.txt | wc -l)
          GATED=$(awk -v re="$LADDER" '$1 ~ re && $2=="4NRXx6U8ABQ" && $3=="LOGIN_REQUIRED"' /tmp/probe.txt | wc -l)
          echo "licensed ladder results: ${OK} OK, ${GATED} login-gated"
          if [ "$OK" -gt 0 ]; then
            echo "licensed=ok" >> "$GITHUB_ENV"
            echo "::notice::Licensed content resolves on ${OK} ladder client(s) — fully healthy."
          elif [ "$GATED" -gt 0 ]; then
            echo "licensed=bot-gated" >> "$GITHUB_ENV"
            echo "::warning::Licensed content LOGIN_REQUIRED on all ${GATED} ladder clients — datacenter-IP bot wall (environmental, not registry rot). Recorded as degraded; rotation proceeds on standard-content health."
            echo "⚠️ Licensed probe degraded: datacenter-IP bot wall (environmental, not registry rot)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "licensed=degraded" >> "$GITHUB_ENV"
            echo "::warning::Licensed content unresolvable on the ladder for non-bot-wall reasons — watch for user reports; rotation still proceeds on standard-content health."
            echo "⚠️ Licensed probe degraded (non-bot-wall reasons) — watch for user reports." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🔄 Self-heal — write winning fleet into fleet-config.json
        run: |
          python3 tools/write_fleet_config.py /tmp/probe.txt fleet-config.json
          cat fleet-config.json

      - name: Commit rotated fleet config (drives live apps without a release)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain fleet-config.json)" ]]; then
            git add fleet-config.json
            git commit -m "ci(fleet): rotate client fleet from canary probe [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          else
            echo "fleet-config.json unchanged — fleet healthy"
          fi
