# audit #44 P3-6: silent dependency rot is a known risk (Compose compiler
# ext 1.5.10 / Kotlin 1.9.22 vs targetSdk 34 at audit time). Weekly
# update PRs for all three first-party ecosystems. Cargo.lock is
# committed (audit #44 P1-3), so cargo updates are actionable PRs.
#
# Sprint directive (P0 Dependabot containment): grouped updates so routine
# minor/patch bumps no longer saturate GitHub Actions runners and no longer
# break crate/gradle ABIs one-by-one. MAJOR bumps intentionally stay
# ungrouped so each one surfaces as its own reviewable upgrade spike.
#
# GOV-01..03 (beta-phase-1): open-pull-requests-limit throttled to 3 per
# ecosystem (was 5) so Dependabot can never monopolize the concurrent
# runner budget consumed by the extreme-test-matrix; minor/patch bumps
# arrive as weekly grouped batches only. Stale ungrouped Dependabot PRs
# (#56, #60, #62, #64, #68) are closed pending the grouped schedule.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Semver-major bumps never arrive as automated PRs: they break
      # gradle/crate ABIs one-by-one and are handled in dedicated upgrade
      # spikes instead (P0 containment directive).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # DEP-01 (alpha-phase-3): pinned to the compileSdk 34 baseline;
      # the compileSdk 35 migration is deferred. Root cause: Dependabot
      # PR #101 bumped 18 Gradle deps at once and jvm-unit-suite failed
      # at :app:checkDebugAarMetadata — core-ktx 1.19.1 and
      # navigation-compose 2.10.2 both enforce compileSdk 35+, while
      # this project pins compileSdk 34 (Android 14). The caps below
      # intercept exactly those break-versions while leaving headroom
      # above the current pins (core-ktx 1.12.0, navigation-compose
      # 2.7.7, AGP 8.2.2, wrapper 8.7) so safe in-window updates keep
      # arriving as reviewable grouped batches. AGP and the wrapper
      # ride the same baseline: AGP 8.3+ requires compileSdk 34's
      # tooling to move in lockstep, and wrapper 8.8+ pairs with that
      # AGP generation.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.16.0"]
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">= 2.8.0"]
      - dependency-name: "com.android.application"
        versions: [">= 8.3.0"]
      - dependency-name: "gradle-wrapper"
        versions: [">= 8.8.0"]

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      rust-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # See gradle ignore: majors go through dedicated upgrade spikes.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
