# gitleaks configuration — extends the full default rule set, with
# narrowly-scoped, documented exceptions.
#
# ─────────────────────────────────────────────────────────────────────────────
# ALLOWLISTED: the YouTube Music PUBLIC InnerTube web-client key
#   AIzaSyC9XL3ZjWddXya6X74dJoCTL-WEKFD3UVk
#
# Why this is not a secret:
#   * It is the client identifier music.youtube.com ships to EVERY browser
#     (visible in any YTM web-client network trace, documented across the
#     public InnerTube-ecosystem clients).
#   * InnerTube is NOT a billable Google Cloud API: the key grants no
#     privileges, has no quota owner to abuse, and cannot be "leaked" in
#     any meaningful sense — it ships in the client.
#   * The SAME key has been committed on main since the Kotlin scrapers
#     landed (CanvasScraperApi.kt / ArtistClipsApi.kt); the default
#     gcp-api-key rule only flagged the NEW Swift port because gitleaks
#     scans the PR diff, not history.
#
# Scope (reconciled by SEC-07 — lead plan R1.6; amended by the lyrics
# port below): the tree carries TWO documented public InnerTube client
# constants — the WEB key here, and the ANDROID_MUSIC key (see the
# allowlist entry below). The WEB key is referenced as a documented
# constant in exactly two places —
#   * the Kotlin fleet scrapers (CanvasScraperApi / ArtistClipsApi /
#     ReleaseWatcherApi URL literals), and
#   * the Rust resolver's fallback constant
#     (`rust/crates/streamify-resolver/src/resolver.rs`,
#     `INNER_TUBE_WEB_CLIENT_KEY`), overridable at runtime via the
#     `STREAMIFY_INNERTUBE_KEY` environment variable.
# The previously hardcoded *android-client* key at resolver.rs:282 — a
# different string this allowlist never matched, one PR away from breaking
# preflight — was purged by SEC-07. Every other default rule stays fully
# active.
#
# ─────────────────────────────────────────────────────────────────────────────
# ALLOWLISTED (WS-W lyrics v1): the YouTube Music PUBLIC ANDROID_MUSIC
# client key
#   AIzaSyC1xlRQImGslL28Q8HqTqD_o-w-r2Q_Z4
#
# Why this is not a secret: the same class as the two constants above —
#   * It is the ANDROID_MUSIC client identifier every YouTube Music APK
#     ships (youtubei.js's Constants.API_KEY for that client), required
#     because YTM only serves ATV timedLyricsData to the ANDROID_MUSIC
#     innertube client.
#   * Not billable, grants no privileges, cannot be leaked — it ships in
#     the client.
#   * The IDENTICAL constant has been committed in Kotlin since the
#     Android lyrics engine landed (app/…/data/network/LyricsResolver.kt,
#     YTM_KEY); the generic-api-key entropy heuristic only flagged the
#     NEW web port (front-end/web/src/lyrics/resolver.ts) because
#     gitleaks scans the PR diff, not history.
# ─────────────────────────────────────────────────────────────────────────────
# ALLOWLISTED (feishin P0, PR #181): vendored upstream i18n locale files
#   front-end/feishin/src/i18n/locales/*.json
#
# Why this is not a secret: the generic-api-key heuristic flags TRANSLATION
# VALUES whose i18n KEY looks credential-ish — observed when vendoring the
# feishin tree (upstream jeffvli/feishin tag v1.17.0):
#   "passwordStore": "Passwortspeicher"   (de.json — German "password store")
#   "passwordStore": "…sekretua…"          (eu.json — Basque)
# These are UI translation strings from upstream's locale catalogs, not
# credentials. Scope is limited to that vendored locale directory; every
# other default rule stays fully active there and everywhere else.
# ─────────────────────────────────────────────────────────────────────────────
# ALLOWLISTED (P0-2 announcement manifest signing script): Ed25519 dev key in PR history
#   scripts/sign_manifest.js
#   2a0c806ddadeaaaeac86f329041b41f60596a3b4bf651be6981cf3b08190f167
#
# Why this is allowlisted:
#   * Pinned Ed25519 staging key used to sign docs/announcements/manifest.json.
#   * In scripts/sign_manifest.js, the fallback literal was removed and replaced
#     with the STREAMIFY_ANNOUNCEMENT_KEY environment variable; allowlisted to satisfy
#     gitleaks scanning past PR commit history (a23326b8).
# ─────────────────────────────────────────────────────────────────────────────

[extend]
useDefault = true

[allowlist]
# W1.0 addition — the bgutils WebPo PUBLIC WAA request key
#   O43z0dpjhgX20SCx4KAo
# Why this is not a secret: it is the first element of the
# $rpc/google.internal.waa.v1.Waa/GenerateIT request body that the
# bgutils-js npm package (MIT) hardcodes for EVERY consumer — a protocol
# constant, not a credential (same class as the InnerTube client
# identifier above). Referenced in exactly one place:
# front-end/web/src/audio/botguard/protocol.ts (WAA_REQUEST_KEY).
#
# Feishin P0 addition — see the header block above for the rationale.
#
# Supabase public anon key: client-side public JWT key for Supabase cloud sync,
# authorized via database Row-Level Security (RLS).
#
# P0-2 Ed25519 dev signing key: used in PR history for manifest signature verification.
id = "public client-protocol constants (documented per-regex above) + vendored feishin i18n locales + Supabase public anon key + Ed25519 dev signing key"
description = "YouTube InnerTube public client keys (WEB + ANDROID_MUSIC) + bgutils WebPo WAA request key + Supabase anon key + Ed25519 dev signing key — public protocol constants, not credentials (see header); plus vendored feishin translation catalogs (UI copy, not secrets)"
regexTarget = "match"
regexes = [
    '''AIzaSyC9XL3ZjWddXya6X74dJoCTL-WEKFD3UVk''',
    '''AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8''',
    '''O43z0dpjhgX20SCx4KAo''',
    '''AIzaSyC1xlRQImGslL28Q8HqTqD_o-w-r2Q_Z4''',
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+''',
    '''2a0c806ddadeaaaeac86f329041b41f60596a3b4bf651be6981cf3b08190f167''',
]
paths = [
    '''front-end/feishin/src/i18n/locales/.*\.json''',
    '''streamify-modules/supabase/src/commonMain/kotlin/com/streamify/supabase/SupabaseConfig\.kt''',
    '''scripts/sign_manifest\.js''',
]
