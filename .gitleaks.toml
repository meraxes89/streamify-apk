# gitleaks configuration — extends the full default rule set, with
# narrowly-scoped, documented exceptions.
#
# ─────────────────────────────────────────────────────────────────────────────
# ALLOWLISTED: the YouTube Music PUBLIC InnerTube web-client key
#   AIzaSyC9XL3ZjWddXya6X74dJoCTL-WEKFD3UVk
#
# Why this is not a secret:
#   * It is the client identifier music.youtube.com ships to EVERY browser
#     (visible in any YTM web-client network trace, documented across the
#     public InnerTube-ecosystem clients).
#   * InnerTube is NOT a billable Google Cloud API: the key grants no
#     privileges, has no quota owner to abuse, and cannot be "leaked" in
#     any meaningful sense — it ships in the client.
#   * The SAME key has been committed on main since the Kotlin scrapers
#     landed (CanvasScraperApi.kt / ArtistClipsApi.kt); the default
#     gcp-api-key rule only flagged the NEW Swift port because gitleaks
#     scans the PR diff, not history.
#
# Scope (reconciled by SEC-07 — lead plan R1.6): this is the ONLY
# InnerTube key string in the tree, referenced as documented constants in
# exactly two places —
#   * the Kotlin fleet scrapers (CanvasScraperApi / ArtistClipsApi /
#     ReleaseWatcherApi URL literals), and
#   * the Rust resolver's fallback constant
#     (`rust/crates/streamify-resolver/src/resolver.rs`,
#     `INNER_TUBE_WEB_CLIENT_KEY`), overridable at runtime via the
#     `STREAMIFY_INNERTUBE_KEY` environment variable.
# The previously hardcoded *android-client* key at resolver.rs:282 — a
# different string this allowlist never matched, one PR away from breaking
# preflight — was purged by SEC-07. Every other default rule stays fully
# active.
# ─────────────────────────────────────────────────────────────────────────────

[extend]
useDefault = true

[allowlist]
# W1.0 addition — the bgutils WebPo PUBLIC WAA request key
#   O43z0dpjhgX20SCx4KAo
# Why this is not a secret: it is the first element of the
# $rpc/google.internal.waa.v1.Waa/GenerateIT request body that the
# bgutils-js npm package (MIT) hardcodes for EVERY consumer — a protocol
# constant, not a credential (same class as the InnerTube client
# identifier above). Referenced in exactly one place:
# front-end/web/src/audio/botguard/protocol.ts (WAA_REQUEST_KEY).
id = "public client-protocol constants (documented per-regex above)"
description = "YouTube InnerTube web-client key + bgutils WebPo WAA request key — public protocol constants, not credentials (see header)"
regexTarget = "match"
regexes = [
    '''AIzaSyC9XL3ZjWddXya6X74dJoCTL-WEKFD3UVk''',
    '''O43z0dpjhgX20SCx4KAo''',
]
