[package]
name = "streamify_core_rs"
version = "1.0.0"
edition = "2021"
authors = ["Streamify Team"]
description = "High-performance Rust engine for Streamify APK"

[lib]
name = "streamify_core_rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.21"
ureq = { version = "2.10", features = ["json", "tls"] }
sha1 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
jni = { version = "0.22", default-features = false }
sha2 = "0.10"
hmac = "0.12"
regex = "1.10"
urlencoding = "2.1"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }
socket2 = { version = "0.5", features = ["all"] }
blake3 = "1.5"
rand = "0.8"
chacha20poly1305 = "0.10"
miniz_oxide = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
strsim = "0.11"
libc = "0.2"
# Phase 1 governance: ephemeral room identities + signed directives/kicks.
# Pure-Rust, no_std-friendly; the 32-byte host ephemeral key in the LAN
# beacon descriptor (directive B) is an Ed25519 verifying key by design.
ed25519-dalek = "2.1"


[dev-dependencies]
tempfile = "3.10"

# Phase 1: the 32-peer mesh simulation is allocation-bound in the default
# unoptimized test profile (7× slower than release — measured: 208 ms
# release vs 1.4 s debug for the same 1000-op trial). The CI matrix runs
# `cargo test` in debug, so the TEST profile carries opt-level 2: the
# chaos harnesses measure the protocol, not the allocator. Debug
# assertions and overflow checks remain on.
[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# unwind (not abort): JNI/FFI entry points rely on catch_unwind shields to
# convert panics into error codes instead of aborting the host Android process.
panic = "unwind"
strip = true
