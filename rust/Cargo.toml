# ─────────────────────────────────────────────────────────────────────────────
#  Streamify Cargo Workspace root (Discussion #120 — post-Phase 5
#  modularization).
#
#  The former monolithic `streamify_core_rs` crate (~43k LOC, 71 source
#  files) is decomposed into 7 focused crates under crates/, organized as
#  a strict DAG:
#
#     streamify-core       pure leaf types, DacPresentationClock,
#                          EngineError, atomic primitives, leaf compute
#     streamify-audio      hard real-time DSP — ZERO async / DB / network
#                          dependencies (compile-time RT boundary)
#     streamify-storage    SQLite pool, migrations, cache encryption
#     streamify-jam        serverless P2P mesh, gossip, CRDT, Kalman-PLL,
#                          PTP
#     streamify-resolver   YouTube Music extractor (RustyPipe), search &
#                          stream ranking
#     streamify-contract   UniFFI contract (UDL scaffolding), engine
#                          object, OS capability adapters
#     streamify-ffi        umbrella cdylib/staticlib producing the
#                          unified libstreamify_core_rs.so / .dll /
#                          StreamifyCore.xcframework
#
#  Build-matrix compatibility contract (DO NOT break — external build
#  systems invoke cargo against this root):
#    * `cargo check --manifest-path rust/Cargo.toml --lib`
#        (desktop-ci.yml probe gate)
#    * `cargo build [--release] [--lib] [--target <triple>]`
#        (gradle cargoBuildRust / buildDesktopEngineLibrary /
#         scripts/build_ios_xcframework.sh)
#    * `cargo ndk -t <abi> -o <dir> build --release`
#        (app Gradle + extreme-test-matrix.yml Tier 1)
#    * `cargo run --bin uniffi-bindgen -- generate ...`
#        (Gradle uniffi tasks + iOS script — the bin lives in the
#         streamify-ffi crate)
#    * `cargo clippy --lib --tests` / `cargo test --lib --tests` /
#      `cargo nextest run --manifest-path rust/Cargo.toml`
#        (CI gates — must cover EVERY member)
#
#  `default-members` lists ALL members so bare workspace-root commands
#  (no `-p`) select the full workspace — preserving the semantics the
#  CI matrix and Gradle tasks relied on when this root was a package.
#
#  The UDL stays at src/streamify.udl and uniffi.toml stays at the
#  workspace root: shared/build.gradle.kts, app/build.gradle.kts and
#  scripts/build_ios_xcframework.sh reference those exact paths.
# ─────────────────────────────────────────────────────────────────────────────
[workspace]
resolver = "2"
members = [
    "crates/streamify-core",
    "crates/streamify-audio",
    "crates/streamify-storage",
    "crates/streamify-jam",
    "crates/streamify-resolver",
    "crates/streamify-contract",
    "crates/streamify-ffi",
]
default-members = [
    "crates/streamify-core",
    "crates/streamify-audio",
    "crates/streamify-storage",
    "crates/streamify-jam",
    "crates/streamify-resolver",
    "crates/streamify-contract",
    "crates/streamify-ffi",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Streamify Team"]
description = "High-performance Rust engine for Streamify APK"
repository = "https://github.com/meraxes89/streamify-apk"
license = "MIT"

# Shared dependency versions (single source of truth; crates inherit via
# `workspace = true` so Dependabot bumps land atomically across members).
[workspace.dependencies]
streamify-core = { path = "crates/streamify-core" }
streamify-audio = { path = "crates/streamify-audio" }
streamify-storage = { path = "crates/streamify-storage" }
streamify-jam = { path = "crates/streamify-jam" }
streamify-resolver = { path = "crates/streamify-resolver" }
streamify-contract = { path = "crates/streamify-contract" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.25"
sha1 = "0.11"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.11"
hmac = "0.13"
regex = "1.10"
urlencoding = "2.1"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }
socket2 = { version = "0.5", features = ["all"] }
blake3 = "1.5"
rand = "0.8"
chacha20poly1305 = "0.11"
miniz_oxide = "0.9"
base64 = "0.22"
strsim = "0.11"
libc = "0.2"
ed25519-dalek = "2.1"
uniffi = { version = "0.28", features = ["cli", "build"] }
rubato = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
metrics = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3.10"
futures-util = "0.3"
# OffsetDateTime arithmetic for the resolver cache TTL discipline (Part B.4
# of Discussion #120: resolved CDN URLs cache with the player response's
# own valid_until minus a safety margin). Version-locked with the copy
# rustypipe 0.11 carries, so the workspace links exactly one `time`.
time = "0.3"

[profile.dev]
debug = "line-tables-only"
incremental = false
codegen-units = 256
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# Phase 1: the 32-peer mesh simulation is allocation-bound in the default
# unoptimized test profile (7× slower than release — measured: 208 ms
# release vs 1.4 s debug for the same 1000-op trial). The CI matrix runs
# `cargo test` in debug, so the TEST profile carries opt-level 2: the
# chaos harnesses measure the protocol, not the allocator. Debug
# assertions and overflow checks remain on.
[profile.test]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

[profile.test.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Multiplatform Phase 3 (MP-C06/MP-C07, master plan invariant 8): the
# approved consensus sets panic = "abort" for release artifacts — a
# panic in a shipped library must NEVER unwind into the host process
# (Kotlin/ART, Swift, or a JVM desktop shell), and abort-fail-fast
# routes the fault through the platform crash reporter instead.
#
# Interaction with the catch_unwind FFI shields (contract.rs::ffi_shield):
# with abort compiled in, panics terminate the process before any
# unwind — the shields are then the specified contract for every OTHER
# configuration: debug/test builds (unwind), host tooling, and any
# downstream binary that links this crate as an rlib and overrides the
# panic strategy back to unwind. The panic→EngineError::Internal
# marshaling path is unit-tested under the (unwinding) test profile.
panic = "abort"
strip = true
