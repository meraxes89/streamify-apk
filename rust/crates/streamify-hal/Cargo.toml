[package]
name = "streamify-hal"
version = "0.1.0"
edition = "2021"
description = "Sovereign HAL Phase 1: the unified cpal cross-platform output engine, hardware DAC presentation-clock shims, and the miniaudio WASAPI-exclusive bracket."
license = "GPL-3.0"

[dependencies]
streamify-core = { workspace = true }
streamify-playback = { workspace = true }
tracing = { workspace = true }

# The unified output backend (Phase 1 D1). cpal 0.18 is the pinned
# battle-tested HAL: WASAPI (shared) on Windows, CoreAudio on macOS/iOS,
# ALSA/PipeWire/Pulse/JACK on Linux, Oboe on Android. Platform features
# are additive so the same crate compiles for every workspace target.
cpal = "0.18"

# The WASAPI-EXCLUSIVE bracket (Phase 1 D1, Windows-only): cpal supports
# WASAPI shared mode only; miniaudio rides behind the `wasapi_exclusive`
# route option for consumer DACs that need exclusive 48 kHz access.
#
# SPEC NOTE: the directive pinned "miniaudio 0.11.26" — that version does
# not exist on crates.io (0.10.0 is the newest published; verified
# 2026-11). Pinned to the real 0.10.0 (same author line, Unlicense OR
# MIT-0, statically links miniaudio.c via cc). If 0.11.x publishes later,
# bumping is a Cargo.toml one-liner behind this same cfg gate.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
miniaudio = { version = "0.10", optional = true }

[features]
default = []
# Windows x86_64 only: the miniaudio WASAPI-exclusive step-down bracket.
wasapi_exclusive = ["dep:miniaudio"]

[dev-dependencies]
# The ebur128 CI oracle (Phase 1 D3): cross-checks the golden-pinned
# lufs.rs integrated loudness within ±0.1 LUFS on reference vectors.
ebur128 = "0.1"
