# streamify-jam-crdt — the pure Jam CRDT leaf (WS-W engine facade breadth).
#
# The jam domain's REPLICATED-STATE engine, split out of streamify-jam so it
# compiles everywhere. The mesh crate's transport surface (tokio net, socket2,
# rusqlite, ed25519 governance) is native-only, which left the CRDT — the one
# part all four runtimes share — trapped behind a wall the wasm32 build could
# never cross. The split is the golden-rule move: the engine change lands in
# rust/ once, and the wasm facade (front-end/crates/streamify-engine-wasm)
# exposes it to JS; Android/iOS/desktop keep their existing paths through the
# streamify-jam re-exports (byte-identical API surface).
#
# Contents:
#   jam_crdt.rs         — moved verbatim from streamify-jam (the Phase-2
#                         democratic CRDT: ops, folds, voting, promotions)
#   cad.rs              — moved from streamify-storage (the canonical CAD-ID
#                         hasher); storage re-exports so every existing path
#                         (ffi / jni / contract) keeps resolving
#   fractional_index.rs — the Kotlin FractionalIndexEngine port
#                         (app/.../jam/FractionalIndexEngine.kt)
#   jam_track_codec.rs  — the Kotlin JamTrackCodec port (queue-entry JSON)
#   state_hash.rs       — moved from streamify-contract (canonical BLAKE3
#                         fold hash, the Merkle reconciliation currency)
#
# wasm32: op-id minting and session timestamps ride the house wasm clock
# (js_sys::Date::now()) behind a target-gated dependency — SystemTime traps
# on that target (W0.1 landmine #4). Native builds never resolve it.
[package]
name = "streamify-jam-crdt"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Streamify Jam CRDT leaf: the pure replicated-state engine (ops, folds, fractional indexing, CAD ids, state hash) shared by every runtime"

[lib]
name = "streamify_jam_crdt"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The house wasm clock (SystemTime traps on wasm32). Each workspace's
# lockfile unifies this against its own wasm-bindgen pairing.
js-sys = "0.3"

[dev-dependencies]
# The in-file jam_crdt parity tests compare against the canonical hex
# pipeline that still lives in storage (audit R3, identity parity).
# Dev-deps never enter the wasm32 dependency closure of the facade.
streamify-storage = { workspace = true }
