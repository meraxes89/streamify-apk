# streamify-radio-scorer — the pure radio/blend scoring leaf (WS-W engine
# facade breadth, work item 3). Moved verbatim from streamify-resolver;
# wasm32-safe (serde only). Re-exported by streamify-resolver at its
# historical path; exposed to JS by the streamify-wasm facade.
[package]
name = "streamify-radio-scorer"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Streamify radio scoring leaf: the anti-drift candidate filter/ranker + blend weights, shared by every runtime"

[lib]
name = "streamify_radio_scorer"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
