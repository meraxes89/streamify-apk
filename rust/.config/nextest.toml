[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 3 }

# Define a strict hardware-isolated mutex group so 32-peer mesh simulations
# never overlap with each other OR with any other unit test in the workspace.
[test-groups.serial-heavy-mesh]
max-threads = 1

[[profile.ci.overrides]]
filter = 'binary(/test_mesh_gossip_32peers/) | test(/thirty_two_nodes/)'
threads-required = "num-cpus"
test-group = "serial-heavy-mesh"
