<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Streamify</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #060608;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error("Runtime Launch Error: " + msg, error || (url + ':' + line + ':' + col));
        };
        window.onunhandledrejection = function(e) {
            console.warn("Unhandled Promise rejection (suppressed overlay):", e.reason);
        };
    </script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 500; letter-spacing: 0.5px;">Loading Streamify...</div>
    </div>
    <script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
